name: One-shot Chat production environment approval

on:
  push:
    branches:
      - lucy/prod-dispatch-chat-11036295-20260924

permissions:
  actions: write
  contents: read

jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Approve only the already-dispatched production run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: "35958515755"
          ENVIRONMENT_ID: "20683786585"
        run: |
          set -euo pipefail

          pending="$(
            curl -fsSL               -H "Authorization: Bearer ${GH_TOKEN}"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/pending_deployments"
          )"

          PENDING="${pending}" ENVIRONMENT_ID="${ENVIRONMENT_ID}" python3 - <<'PY'
          import json, os
          rows=json.loads(os.environ["PENDING"])
          env_id=int(os.environ["ENVIRONMENT_ID"])
          match=[x for x in rows if int(x.get("environment",{}).get("id",-1))==env_id]
          if len(match)!=1:
              raise SystemExit("expected exactly one pending production environment")
          env=match[0].get("environment",{})
          if env.get("name")!="production":
              raise SystemExit("pending environment is not production")
          print("pending-production-environment=verified")
          PY

          payload="$(
            ENVIRONMENT_ID="${ENVIRONMENT_ID}" python3 - <<'PY'
          import json, os
          print(json.dumps({
            "environment_ids":[int(os.environ["ENVIRONMENT_ID"])],
            "state":"approved",
            "comment":"Tei explicitly approved the exact-main Chat production deploy in CDL on 2026-09-24 KST."
          }))
          PY
          )"

          curl -fsS -X POST             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/pending_deployments"             -d "${payload}"

          echo "production-environment-approval=requested"
