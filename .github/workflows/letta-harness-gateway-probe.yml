name: letta-harness-gateway-probe

on:
  push:
    branches:
      - test/letta-harness-gateway-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on:
      - self-hosted
      - linux
      - x64
      - chat-staging
    environment: staging
    timeout-minutes: 15

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run read-only Gateway probe
        shell: bash
        env:
          OPENCLAW_GATEWAY_BASE_URL: ${{ vars.OPENCLAW_GATEWAY_BASE_URL }}
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ vars.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PROBE_EVIDENCE_PATH: ${{ runner.temp }}/LETTA-HARNESS-GATEWAY-PROBE-001.json
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import os from 'node:os';
          import { execFileSync } from 'node:child_process';

          const outputPath = process.env.PROBE_EVIDENCE_PATH;
          const baseUrl = (process.env.OPENCLAW_GATEWAY_BASE_URL || '').replace(/\/$/, '');
          const token = process.env.OPENCLAW_GATEWAY_TOKEN || '';
          const expectedHead = '9bdc7046b6cffc8a08c1397582e5d18d491672ec';

          const safeText = (value, max = 160) => {
            if (typeof value !== 'string') return null;
            return value
              .replace(/(bearer|token|secret|password|api[_-]?key)\s*[:=]\s*\S+/gi, '$1=[REDACTED]')
              .replace(/(gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+|sk-[A-Za-z0-9_-]+)/g, '[REDACTED]')
              .slice(0, max) || null;
          };

          const evidence = {
            probe: 'LETTA-HARNESS-GATEWAY-PROBE-001',
            generatedAt: new Date().toISOString(),
            transport: {},
            catalog: {},
            runner: {
              hostname: os.hostname(),
              hostnameMatchesExpected: os.hostname() === 'hni-node-04',
              openclawAvailable: false,
              openclawVersion: null
            },
            agentResponseParsed: false,
            result: null,
            gatePassed: false
          };

          try {
            const version = execFileSync('openclaw', ['--version'], { encoding: 'utf8', timeout: 10000 }).trim();
            evidence.runner.openclawAvailable = true;
            evidence.runner.openclawVersion = safeText(version);
          } catch {}

          const headers = {
            authorization: 'Bearer ' + token,
            'content-type': 'application/json',
            'cf-access-client-id': process.env.CF_ACCESS_CLIENT_ID || '',
            'cf-access-client-secret': process.env.CF_ACCESS_CLIENT_SECRET || ''
          };

          try {
            if (!baseUrl || !token) throw new Error('staging Gateway configuration is missing');

            const modelsResponse = await fetch(baseUrl + '/v1/models', {
              headers,
              signal: AbortSignal.timeout(60000)
            });
            evidence.transport.modelsHttpStatus = modelsResponse.status;
            const models = await modelsResponse.json();
            const items = Array.isArray(models.data) ? models.data : Array.isArray(models.models) ? models.models : [];
            const ids = items.map((item) => typeof item === 'string' ? item : item && item.id).filter((id) => typeof id === 'string');
            evidence.catalog = {
              targetCount: ids.length,
              defaultAdvertised: ids.includes('openclaw/default') || ids.includes('openclaw'),
              lucyAdvertised: ids.includes('agent:lucy') || ids.includes('openclaw/lucy'),
              mainAdvertised: ids.includes('agent:main') || ids.includes('openclaw/main')
            };

            const prompt = [
              'Run the read-only preflight for LETTA-HARNESS-LIVE-001.',
              'Do not create, edit, move, or delete files. Do not install packages. Do not change config, services, processes, git refs, or GitHub state. Do not restart anything.',
              'Use only read-only local inspection in existing OpenClaw workspaces.',
              'Inspect whether this host is hni-node-04 and whether the since98kr/lucy-openclaw-control checkout has feature/letta-agent-harness at commit ' + expectedHead + '.',
              'Check whether plugins/letta-agent-harness exists, whether the corrected isolated response is PASS, and whether collaboration/responses/LETTA-HARNESS-LIVE-001.md exists.',
              'Return JSON only with exactly these keys: probe, mode, hostname, openclawVersion, agentId, controlRepoPresent, candidateBranch, candidateHead, candidateHeadMatchesExpected, workingTreeClean, pluginPathExists, isolatedEvidenceStatus, liveResponseEvidenceExists, toolNamesUsed, blocker.',
              'Use null when unknown. Do not include credentials, environment values, file contents, or additional paths.'
            ].join(' ');

            const chatResponse = await fetch(baseUrl + '/v1/chat/completions', {
              method: 'POST',
              headers: {
                ...headers,
                'x-openclaw-session-key': 'letta-harness-live-001-probe-' + process.env.GITHUB_RUN_ID
              },
              body: JSON.stringify({
                model: 'openclaw/main',
                stream: false,
                messages: [{ role: 'user', content: prompt }]
              }),
              signal: AbortSignal.timeout(600000)
            });
            evidence.transport.chatHttpStatus = chatResponse.status;
            const response = await chatResponse.json();

            let content = response && response.choices && response.choices[0] && response.choices[0].message && response.choices[0].message.content;
            if (Array.isArray(content)) {
              content = content.map((part) => typeof part === 'string' ? part : part && part.text || '').join('');
            }

            let parsed = null;
            if (typeof content === 'string') {
              const cleaned = content.trim().replace(/^\`\`\`(?:json)?\s*/i, '').replace(/\s*\`\`\`$/, '');
              try { parsed = JSON.parse(cleaned); } catch {}
            }

            evidence.agentResponseParsed = Boolean(parsed);
            evidence.result = parsed ? {
              mode: typeof parsed.mode === 'string' && /^read[-_ ]?only/i.test(parsed.mode) ? 'read-only' : safeText(parsed.mode),
              hostname: safeText(parsed.hostname),
              hostnameMatchesExpected: parsed.hostname === 'hni-node-04',
              openclawVersion: safeText(parsed.openclawVersion),
              agentId: safeText(parsed.agentId),
              controlRepoPresent: typeof parsed.controlRepoPresent === 'boolean' ? parsed.controlRepoPresent : null,
              candidateBranch: safeText(parsed.candidateBranch),
              candidateHead: /^[0-9a-f]{7,40}$/i.test(parsed.candidateHead || '') ? parsed.candidateHead : null,
              candidateHeadMatchesExpected: parsed.candidateHead === expectedHead || parsed.candidateHeadMatchesExpected === true,
              workingTreeClean: typeof parsed.workingTreeClean === 'boolean' ? parsed.workingTreeClean : null,
              pluginPathExists: typeof parsed.pluginPathExists === 'boolean' ? parsed.pluginPathExists : null,
              isolatedEvidenceStatus: safeText(parsed.isolatedEvidenceStatus),
              liveResponseEvidenceExists: typeof parsed.liveResponseEvidenceExists === 'boolean' ? parsed.liveResponseEvidenceExists : null,
              toolNamesUsed: Array.isArray(parsed.toolNamesUsed)
                ? parsed.toolNamesUsed.map((item) => safeText(item, 64)).filter(Boolean).slice(0, 20)
                : [],
              blocker: safeText(parsed.blocker, 500)
            } : null;

            evidence.gatePassed = modelsResponse.ok
              && chatResponse.ok
              && evidence.agentResponseParsed
              && evidence.result.mode === 'read-only'
              && evidence.result.hostnameMatchesExpected === true;
          } catch (error) {
            evidence.error = safeText(error && error.message, 500) || 'probe failed';
          }

          fs.writeFileSync(outputPath, JSON.stringify(evidence, null, 2) + '\n', { mode: 0o600 });
          NODE

      - name: Verify existing restricted hni-node-04 preflight gate
        if: always()
        shell: bash
        env:
          LETTA_SSH_PRIVATE_KEY: ${{ secrets.LETTA_SSH_PRIVATE_KEY }}
          LETTA_SSH_KNOWN_HOSTS: ${{ secrets.LETTA_SSH_KNOWN_HOSTS }}
          LETTA_SSH_RESTRICTED_MODE: ${{ vars.LETTA_SSH_RESTRICTED_MODE }}
          LETTA_SSH_HOST: ${{ vars.LETTA_SSH_HOST }}
          LETTA_SSH_PORT: ${{ vars.LETTA_SSH_PORT }}
          LETTA_SSH_USER: ${{ vars.LETTA_SSH_USER }}
          PROBE_EVIDENCE_PATH: ${{ runner.temp }}/LETTA-HARNESS-GATEWAY-PROBE-001.json
        run: |
          set -u
          key_path="${RUNNER_TEMP}/letta-harness-restricted-key"
          known_hosts_path="${RUNNER_TEMP}/letta-harness-known-hosts"
          stdout_path="${RUNNER_TEMP}/letta-harness-ssh.stdout"
          stderr_path="${RUNNER_TEMP}/letta-harness-ssh.stderr"
          cleanup() {
            rm -f "${key_path}" "${known_hosts_path}" "${stdout_path}" "${stderr_path}"
          }
          trap cleanup EXIT
          umask 077

          host="${LETTA_SSH_HOST:-ax.hni-gl.ai}"
          port="${LETTA_SSH_PORT:-3004}"
          user="${LETTA_SSH_USER:-since98kr}"
          status=125
          response=''

          if [[ "${LETTA_SSH_RESTRICTED_MODE:-}" == 'true' && -n "${LETTA_SSH_PRIVATE_KEY:-}" && -n "${LETTA_SSH_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "${LETTA_SSH_PRIVATE_KEY}" >"${key_path}"
            printf '%s\n' "${LETTA_SSH_KNOWN_HOSTS}" >"${known_hosts_path}"
            chmod 0600 "${key_path}" "${known_hosts_path}"

            set +e
            ssh -p "${port}"               -i "${key_path}"               -o IdentitiesOnly=yes               -o BatchMode=yes               -o ConnectTimeout=20               -o StrictHostKeyChecking=yes               -o "UserKnownHostsFile=${known_hosts_path}"               "${user}@${host}" letta-preflight-v1               >"${stdout_path}" 2>"${stderr_path}"
            status=$?
            set -e
            if [[ -f "${stdout_path}" ]]; then
              response="$(tr -d '\r\n' <"${stdout_path}")"
            fi
          fi

          SSH_STATUS="${status}" SSH_RESPONSE="${response}"             node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = process.env.PROBE_EVIDENCE_PATH;
          let evidence = {};
          try { evidence = JSON.parse(fs.readFileSync(path, 'utf8')); } catch {}
          const status = Number(process.env.SSH_STATUS || 125);
          const response = process.env.SSH_RESPONSE || '';
          evidence.restrictedSsh = {
            configured: process.env.LETTA_SSH_RESTRICTED_MODE === 'true'
              && Boolean(process.env.LETTA_SSH_PRIVATE_KEY)
              && Boolean(process.env.LETTA_SSH_KNOWN_HOSTS),
            exitCode: status,
            canonicalResponse: response === 'letta-preflight-v1:ok',
            gatePassed: status === 0 && response === 'letta-preflight-v1:ok'
          };
          fs.writeFileSync(path, JSON.stringify(evidence, null, 2) + '\n', { mode: 0o600 });
          NODE

      - name: Upload sanitized probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: letta-harness-gateway-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/LETTA-HARNESS-GATEWAY-PROBE-001.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce probe gate
        if: always()
        shell: bash
        env:
          PROBE_EVIDENCE_PATH: ${{ runner.temp }}/LETTA-HARNESS-GATEWAY-PROBE-001.json
        run: |
          node -e "const e=require(process.env.PROBE_EVIDENCE_PATH); if (!e.gatePassed) process.exit(1)"
