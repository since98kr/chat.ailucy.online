name: Diagnose Hermes Gemma runtime

on:
  push:
    branches:
      - diag/hermes-gemma-runtime

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, chat-staging]
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Gemma profile model and provider without secrets
        shell: bash
        run: |
          set -euo pipefail
          pid="$(pgrep -f '/hermes -p gemma gateway run' | head -n1 || true)"
          [[ -n "$pid" ]] || { echo 'RESULT gemma_pid=not-found'; exit 1; }
          echo "RESULT gemma_pid=$pid"
          echo "RESULT gemma_cwd=$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"

          echo '=== process environment names only ==='
          tr '\0' '\n' < "/proc/$pid/environ" 2>/dev/null | sed 's/=.*//' | sort | grep -Ei 'MODEL|PROVIDER|PROFILE|HERMES|GOOGLE|GEMINI|OPENAI|ANTHROPIC|CODEX|API' || true

          echo '=== Hermes config/profile paths ==='
          find "$HOME/.hermes" -maxdepth 5 -type f -size -1024k 2>/dev/null \
            | grep -Ei '(gemma|profile|config|settings|\.ya?ml$|\.json$|\.toml$)' \
            | sort | head -n 200 || true

          echo '=== sanitized model/provider config evidence ==='
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path.home()/'.hermes'
          allow = re.compile(r'gemma|model|provider|profile|base[_-]?url|api[_-]?base|endpoint|gateway[_-]?port|port', re.I)
          block = re.compile(r'api[_-]?key|token|secret|password|authorization|credential|private[_-]?key', re.I)
          suffixes={'.yaml','.yml','.json','.toml','.ini','.conf','.env',''}
          count=0
          for p in root.rglob('*'):
              try:
                  if not p.is_file() or p.stat().st_size > 1024*1024 or p.suffix.lower() not in suffixes:
                      continue
                  text=p.read_text(errors='ignore')
              except Exception:
                  continue
              hits=[]
              for line in text.splitlines():
                  if allow.search(line) and not block.search(line):
                      s=line.strip()
                      if len(s)>400: s=s[:400]+'…'
                      hits.append(s)
              if hits:
                  print(f'FILE {p}')
                  for line in hits[:80]: print(line)
                  count += 1
                  if count >= 40: break
          PY

          echo '=== Hermes CLI help hints ==='
          "$HOME/.hermes/hermes-agent/venv/bin/hermes" -p gemma --help 2>&1 | grep -Ei 'model|provider|profile|config' | head -n 80 || true
