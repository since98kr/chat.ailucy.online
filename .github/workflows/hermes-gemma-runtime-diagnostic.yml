name: Diagnose Hermes Gemma runtime

on:
  push:
    branches:
      - diag/hermes-gemma-runtime

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Inspect existing Hermes system service template
        shell: bash
        run: |
          set -euo pipefail
          echo '=== status ==='
          systemctl status hermes-gateway.service --no-pager --full 2>&1 \
            | sed -E 's/([A-Za-z0-9_]*(KEY|TOKEN|SECRET|PASSWORD|AUTH)[A-Za-z0-9_]*=)[^ ]+/\1[REDACTED]/Ig' || true
          echo '=== show ==='
          systemctl show hermes-gateway.service --no-pager \
            -p FragmentPath -p User -p Group -p ExecStart -p WorkingDirectory -p Restart -p RestartUSec -p KillMode \
            | sed -E 's/([A-Za-z0-9_]*(KEY|TOKEN|SECRET|PASSWORD|AUTH)[A-Za-z0-9_]*=)[^ ;]+/\1[REDACTED]/Ig'
          echo '=== cat sanitized ==='
          systemctl cat hermes-gateway.service --no-pager 2>&1 \
            | sed -E 's/^([[:space:]]*Environment(File)?=.*(KEY|TOKEN|SECRET|PASSWORD|AUTH).*)$/[REDACTED ENVIRONMENT LINE]/Ig' \
            | sed -E 's/([A-Za-z0-9_]*(KEY|TOKEN|SECRET|PASSWORD|AUTH)[A-Za-z0-9_]*=)[^ ]+/\1[REDACTED]/Ig'
          echo '=== unit permissions ==='
          unit="$(systemctl show hermes-gateway.service -p FragmentPath --value)"
          [[ -n "$unit" ]] && stat -c '%A %U:%G %n' "$unit" || true
