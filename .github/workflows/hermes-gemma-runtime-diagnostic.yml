name: Diagnose Hermes Gemma runtime

on:
  push:
    branches:
      - diag/hermes-gemma-runtime

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, chat-staging]
    steps:
      - uses: actions/checkout@v4
      - name: Trace host-side Gemma relay without secrets
        shell: bash
        run: |
          set -euo pipefail
          echo '=== listener ==='
          ss -ltnp '( sport = :8643 )' || true

          echo '=== matching processes ==='
          ps -eo pid,ppid,user,comm,args --width 240 | grep -Ei '8643|gemma|hermes' | grep -v grep | sed -E 's/([A-Za-z0-9_]*(KEY|TOKEN|SECRET|PASSWORD|AUTH)[A-Za-z0-9_]*=)[^ ]+/\1[REDACTED]/Ig' || true

          echo '=== user systemd matches ==='
          systemctl --user list-units --all --no-pager 2>/dev/null | grep -Ei 'gemma|hermes|8643' || true
          systemctl --user list-unit-files --no-pager 2>/dev/null | grep -Ei 'gemma|hermes|8643' || true

          echo '=== unit files containing 8643 ==='
          for root in "$HOME/.config/systemd/user" /etc/systemd/system; do
            [[ -d "$root" ]] || continue
            grep -RIl --exclude='*.wants' '8643' "$root" 2>/dev/null || true
          done

          echo '=== bridge health ==='
          status="$(curl --silent --show-error --max-time 10 -o /tmp/gemma-health.body -w '%{http_code}' http://172.17.0.1:8643/health || true)"
          echo "RESULT health_http=$status"
          head -c 1500 /tmp/gemma-health.body 2>/dev/null | sed -E 's/("?(api[_-]?key|token|secret|password|authorization)"?[[:space:]]*:[[:space:]]*")[^"]+"/\1[REDACTED]"/Ig' || true
          echo

          echo '=== unauthenticated model metadata ==='
          status="$(curl --silent --show-error --max-time 10 -o /tmp/gemma-models.body -w '%{http_code}' http://172.17.0.1:8643/v1/models || true)"
          echo "RESULT models_http=$status"
          head -c 2000 /tmp/gemma-models.body 2>/dev/null | sed -E 's/("?(api[_-]?key|token|secret|password|authorization)"?[[:space:]]*:[[:space:]]*")[^"]+"/\1[REDACTED]"/Ig' || true
          echo
