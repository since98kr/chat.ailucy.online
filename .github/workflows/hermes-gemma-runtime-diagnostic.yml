name: Diagnose Hermes Gemma runtime

on:
  push:
    branches:
      - diag/hermes-gemma-runtime

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Read Gemma profile through read-only host mount
        shell: bash
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        run: |
          set -euo pipefail
          IMAGE='chat-ailucy-v2:19523e65dd77f9477fdab4801cf36b36f665d4f3'
          echo '=== authenticated gateway model aliases ==='
          [[ -n "$HERMES_API_KEY" ]] || { echo 'RESULT hermes_api_key=missing'; exit 1; }
          for port in 8642 8643 8644 8645; do
            printf 'PORT %s ' "$port"
            curl --fail --silent --show-error --max-time 15 \
              -H "Authorization: Bearer $HERMES_API_KEY" \
              "http://172.17.0.1:${port}/v1/models" \
              | python3 -c 'import json,sys; j=json.load(sys.stdin); print(json.dumps([{"id":x.get("id"),"owned_by":x.get("owned_by")} for x in j.get("data",[])], separators=(",",":")))'
          done

          echo '=== sanitized host profile evidence via read-only mount ==='
          docker run --rm -i --user 0:0 \
            -v /home/since98kr/.hermes:/mnt/hermes:ro \
            "$IMAGE" node - <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const root='/mnt/hermes';
          const allow=/gemma|model|provider|profile|base[_-]?url|api[_-]?base|endpoint|gateway[_-]?port|vision|multimodal|google|gemini|openai|anthropic|openrouter|codex/i;
          const block=/api[_-]?key|token|secret|password|authorization|credential|private[_-]?key/i;
          const wanted=new Set(['.yaml','.yml','.json','.toml','.ini','.conf','.env','']);
          let files=0;
          function walk(dir,depth){
            if(depth>7||files>=80)return;
            let ents=[]; try{ents=fs.readdirSync(dir,{withFileTypes:true})}catch{return}
            for(const e of ents){
              if(files>=80)return;
              const p=path.join(dir,e.name);
              if(e.isDirectory()){walk(p,depth+1);continue}
              if(!e.isFile())continue;
              let st; try{st=fs.statSync(p)}catch{continue}
              if(st.size>1024*1024||!wanted.has(path.extname(e.name).toLowerCase()))continue;
              let text; try{text=fs.readFileSync(p,'utf8')}catch{continue}
              const hits=text.split(/\r?\n/).filter(l=>allow.test(l)&&!block.test(l)).slice(0,120).map(l=>l.trim().slice(0,500));
              if(hits.length){console.log('FILE '+p); hits.forEach(l=>console.log(l)); files++;}
            }
          }
          walk(root,0);
          NODE

          echo '=== profile tree names ==='
          docker run --rm --user 0:0 \
            -v /home/since98kr/.hermes:/mnt/hermes:ro \
            "$IMAGE" sh -lc "find /mnt/hermes -maxdepth 5 -type f | grep -Ei '(gemma|profile|config|settings|\\.ya?ml$|\\.json$|\\.toml$)' | sort | head -n 250" || true
