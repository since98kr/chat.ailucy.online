name: AICOS OpenClaw relay source test

on:
  push:
    branches:
      - agent/aicos-openclaw-relay-v1
    paths:
      - scripts/aicos-relay-v1.mjs
      - scripts/aicos-openclaw-relay-handler.mjs
      - tests/aicos-relay-v1.test.mjs
      - .github/workflows/aicos-openclaw-relay-source-test.yml
      - .github/workflows/aicos-openclaw-relay.yml
  pull_request:
    paths:
      - scripts/aicos-relay-v1.mjs
      - scripts/aicos-openclaw-relay-handler.mjs
      - tests/aicos-relay-v1.test.mjs
      - .github/workflows/aicos-openclaw-relay-source-test.yml
      - .github/workflows/aicos-openclaw-relay.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          node --check scripts/aicos-relay-v1.mjs
          node --check scripts/aicos-openclaw-relay-handler.mjs
      - name: Relay contract tests
        run: node --test tests/aicos-relay-v1.test.mjs
      - name: Diff check
        run: git diff --check
