name: Chat 199 stale federation identity guard worker

on:
  push:
    branches:
      - lucy/chat-199-federation-identity-guard-20260903

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lucy/chat-199-federation-identity-guard-20260903
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply stale federation identity runtime guard
        shell: bash
        run: |
          set -euo pipefail
          cat > server/federation-identity.ts <<'EOF'
          import type { ConversationRecord, FederationSnapshotRecord } from '../shared/contracts.js';

          export const FEDERATED_CONVERSATION_IDENTITY_ERROR = 'FEDERATED_CONVERSATION_REQUIRES_HERMES_LUCY';

          export function isFederationConversationIdentity(
            conversation: Pick<ConversationRecord, 'systemId' | 'agentId'>,
          ) {
            return conversation.systemId === 'hermes' && conversation.agentId === '[Hermes] Lucy';
          }

          export function federationSnapshotForConversation(
            conversation: Pick<ConversationRecord, 'systemId' | 'agentId'>,
            snapshot: FederationSnapshotRecord,
          ): FederationSnapshotRecord {
            return isFederationConversationIdentity(conversation)
              ? snapshot
              : { ...snapshot, config: null };
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path('server/index.ts')
          s = p.read_text()
          old = "import { FederationService } from './federation.js';\n"
          new = old + "import {\n  FEDERATED_CONVERSATION_IDENTITY_ERROR,\n  federationSnapshotForConversation,\n  isFederationConversationIdentity,\n} from './federation-identity.js';\n"
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = "    federation.cloneConversation(id, conversation.id);"
          new = "    if (isFederationConversationIdentity(conversation)) federation.cloneConversation(id, conversation.id);"
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = "      federation.snapshot(id),\n    ));"
          new = "      federationSnapshotForConversation(conversation, federation.snapshot(id)),\n    ));"
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = """    const config = federation.getConfig(id);
    const federated = config?.mode === 'federated' || input.workflowMode === 'federated';
    if (federated && config?.mode !== 'federated') {
      return reply.status(409).send({ error: 'FEDERATION_NOT_ENABLED' });
    }
"""
          new = """    const federationIdentityValid = isFederationConversationIdentity(conversation);
    const config = federationIdentityValid ? federation.getConfig(id) : null;
    if (input.workflowMode === 'federated' && !federationIdentityValid) {
      return reply.status(409).send({ error: FEDERATED_CONVERSATION_IDENTITY_ERROR });
    }
    const federated = config?.mode === 'federated' || input.workflowMode === 'federated';
    if (federated && config?.mode !== 'federated') {
      return reply.status(409).send({ error: 'FEDERATION_NOT_ENABLED' });
    }
"""
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = "federatedConversations: db.db.prepare(`SELECT COUNT(*) AS count FROM conversation_federation WHERE mode = 'federated'`).get(),"
          new = "federatedConversations: db.db.prepare(`SELECT COUNT(*) AS count FROM conversation_federation cf JOIN conversations c ON c.id = cf.conversation_id WHERE cf.mode = 'federated' AND c.system_id = 'hermes' AND c.agent_id = '[Hermes] Lucy'`).get(),"
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('server/federation-routes.ts')
          s = p.read_text()
          old = "import type { FederationService } from './federation.js';\n"
          new = old + "import {\n  FEDERATED_CONVERSATION_IDENTITY_ERROR,\n  federationSnapshotForConversation,\n  isFederationConversationIdentity,\n} from './federation-identity.js';\n"
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = "    const snapshot = federation.snapshot(id);"
          new = "    const snapshot = federationSnapshotForConversation(conversation, federation.snapshot(id));"
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = """    if (!database.getConversation(id)) return reply.status(404).send({ error: 'CONVERSATION_NOT_FOUND' });
    return { federation: federation.snapshot(id) };
"""
          new = """    const conversation = database.getConversation(id);
    if (!conversation) return reply.status(404).send({ error: 'CONVERSATION_NOT_FOUND' });
    return { federation: federationSnapshotForConversation(conversation, federation.snapshot(id)) };
"""
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = """    if (conversation.systemId !== 'hermes' || conversation.agentId !== '[Hermes] Lucy') {
      return reply.status(409).send({ error: 'FEDERATED_CONVERSATION_REQUIRES_HERMES_LUCY' });
    }
"""
          new = """    if (!isFederationConversationIdentity(conversation)) {
      return reply.status(409).send({ error: FEDERATED_CONVERSATION_IDENTITY_ERROR });
    }
"""
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = """    const conversation = database.getConversation(id);
    if (!conversation) return reply.status(404).send({ error: 'CONVERSATION_NOT_FOUND' });
    if (federation.getConfig(id)?.mode !== 'federated') {
"""
          new = """    const conversation = database.getConversation(id);
    if (!conversation) return reply.status(404).send({ error: 'CONVERSATION_NOT_FOUND' });
    if (!isFederationConversationIdentity(conversation)) {
      return reply.status(409).send({ error: FEDERATED_CONVERSATION_IDENTITY_ERROR });
    }
    if (federation.getConfig(id)?.mode !== 'federated') {
"""
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = """    const current = federation.getCapsule(capsuleId);
    if (!current) return reply.status(404).send({ error: 'MEMORY_CAPSULE_NOT_FOUND' });
    if (current.status === 'revoked' && input.status === 'approved') {
"""
          new = """    const current = federation.getCapsule(capsuleId);
    if (!current) return reply.status(404).send({ error: 'MEMORY_CAPSULE_NOT_FOUND' });
    const conversation = database.getConversation(current.conversationId);
    if (!conversation) return reply.status(409).send({ error: 'MEMORY_CAPSULE_CONTEXT_MISSING' });
    if (!isFederationConversationIdentity(conversation) && input.status !== 'revoked') {
      return reply.status(409).send({ error: FEDERATED_CONVERSATION_IDENTITY_ERROR });
    }
    if (current.status === 'revoked' && input.status === 'approved') {
"""
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = """    if (!foundConversation || !foundUserMessage) {
      return reply.status(409).send({ error: 'WORKFLOW_SOURCE_CONTEXT_MISSING' });
    }

    const run = foundRun;
"""
          new = """    if (!foundConversation || !foundUserMessage) {
      return reply.status(409).send({ error: 'WORKFLOW_SOURCE_CONTEXT_MISSING' });
    }
    if (!isFederationConversationIdentity(foundConversation)) {
      return reply.status(409).send({ error: FEDERATED_CONVERSATION_IDENTITY_ERROR });
    }

    const run = foundRun;
"""
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('server/federated-runner.ts')
          s = p.read_text()
          old = "import type { FederationService } from './federation.js';\n"
          new = old + "import { FEDERATED_CONVERSATION_IDENTITY_ERROR, isFederationConversationIdentity } from './federation-identity.js';\n"
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = """export async function* runFederatedWorkflow(input: FederatedRunInput): AsyncGenerator<StreamEvent> {
  const { database, collaboration, federation, conversation, userMessage, attachedArtifacts, signal } = input;
  const resolved = resolveFederatedAgents(collaboration, conversation, userMessage.content, input.requestedAgentIds);
"""
          new = """export async function* runFederatedWorkflow(input: FederatedRunInput): AsyncGenerator<StreamEvent> {
  const { database, collaboration, federation, conversation, userMessage, attachedArtifacts, signal } = input;
  if (!isFederationConversationIdentity(conversation)) {
    throw new Error(FEDERATED_CONVERSATION_IDENTITY_ERROR);
  }
  const resolved = resolveFederatedAgents(collaboration, conversation, userMessage.content, input.requestedAgentIds);
"""
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          cat > server/federation-identity.test.ts <<'EOF'
          import { afterEach, beforeEach, describe, expect, it } from 'vitest';
          import Database from 'better-sqlite3';
          import { mkdtempSync, rmSync } from 'node:fs';
          import { join } from 'node:path';
          import { tmpdir } from 'node:os';
          import type { FastifyInstance } from 'fastify';
          import { buildApp } from './index.js';

          process.env.NODE_ENV = 'test';

          describe('federation conversation identity guard', () => {
            let directory: string;
            let databasePath: string;
            let app: FastifyInstance;

            beforeEach(async () => {
              directory = mkdtempSync(join(tmpdir(), 'chat-v2-federation-identity-'));
              databasePath = join(directory, 'chat.sqlite');
              app = buildApp({
                databasePath,
                artifactRoot: join(directory, 'artifacts'),
              });
              await app.ready();
            });

            afterEach(async () => {
              await app.close();
              rmSync(directory, { recursive: true, force: true });
            });

            const createConversation = async (systemId: 'letta' | 'hermes', agentId: string, title: string) => {
              const created = await app.inject({
                method: 'POST',
                url: '/api/conversations',
                payload: { systemId, agentId, title },
              });
              expect(created.statusCode).toBe(201);
              return created.json().conversation.id as string;
            };

            const seedStaleFederation = (conversationId: string) => {
              const db = new Database(databasePath);
              const timestamp = new Date().toISOString();
              db.prepare(`
                INSERT INTO conversation_federation (
                  conversation_id, mode, coordinator_agent_id, allowed_system_ids_json,
                  memory_policy, created_at, updated_at
                ) VALUES (?, 'federated', '[Hermes] Lucy', ?, 'explicit-capsules-only', ?, ?)
              `).run(conversationId, JSON.stringify(['letta', 'hermes', 'claude']), timestamp, timestamp);
              db.close();
            };

            it('rejects federation on a personal Letta conversation', async () => {
              const id = await createConversation('letta', '[Letta] Lucy', 'Personal Lucy');
              const enabled = await app.inject({
                method: 'POST',
                url: `/api/conversations/${id}/federation`,
                payload: { coordinatorAgentId: '[Hermes] Lucy' },
              });
              expect(enabled.statusCode).toBe(409);
              expect(enabled.json()).toMatchObject({
                error: 'FEDERATED_CONVERSATION_REQUIRES_HERMES_LUCY',
              });
            });

            it('keeps a persisted stale Letta federation config inert after upgrade', async () => {
              const id = await createConversation('letta', '[Letta] Lucy', 'Persisted personal Lucy');
              seedStaleFederation(id);

              const snapshot = await app.inject({ method: 'GET', url: `/api/conversations/${id}/federation` });
              expect(snapshot.statusCode).toBe(200);
              expect(snapshot.json().federation.config).toBeNull();

              const direct = await app.inject({
                method: 'POST',
                url: `/api/conversations/${id}/messages/stream`,
                payload: {
                  content: 'ordinary personal chat remains direct',
                  workflowMode: 'chat',
                  idempotencyKey: 'stale-personal-direct-0001',
                },
              });
              expect(direct.statusCode).toBe(200);
              expect(direct.body).not.toContain('"type":"workflow.run"');

              const federated = await app.inject({
                method: 'POST',
                url: `/api/conversations/${id}/messages/stream`,
                payload: {
                  content: 'do not federate this personal conversation',
                  workflowMode: 'federated',
                  idempotencyKey: 'stale-personal-federated-0001',
                },
              });
              expect(federated.statusCode).toBe(409);
              expect(federated.json()).toMatchObject({
                error: 'FEDERATED_CONVERSATION_REQUIRES_HERMES_LUCY',
              });

              const capsule = await app.inject({
                method: 'POST',
                url: `/api/conversations/${id}/memory-capsules`,
                payload: {
                  sourceSystemId: 'letta',
                  targetSystemId: 'hermes',
                  title: 'must stay inert',
                  content: 'stale cross-system state',
                },
              });
              expect(capsule.statusCode).toBe(409);
              expect(capsule.json()).toMatchObject({
                error: 'FEDERATED_CONVERSATION_REQUIRES_HERMES_LUCY',
              });
            });

            it('still allows federation on an explicit Hermes Lucy conversation', async () => {
              const id = await createConversation('hermes', '[Hermes] Lucy', 'Hermes federation');
              const enabled = await app.inject({
                method: 'POST',
                url: `/api/conversations/${id}/federation`,
                payload: { coordinatorAgentId: '[Hermes] Lucy' },
              });
              expect(enabled.statusCode).toBe(201);
              expect(enabled.json().config).toMatchObject({
                conversationId: id,
                coordinatorAgentId: '[Hermes] Lucy',
              });
            });
          });
          EOF
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and contract tests
        run: npm test -- --run
      - name: Production build
        run: npm run build
      - name: Commit verified source and remove worker
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chat199-federation-stale-guard-worker.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/federation-identity.ts server/federation-identity.test.ts server/index.ts server/federation-routes.ts server/federated-runner.ts .github/workflows/chat199-federation-stale-guard-worker.yml
          git diff --cached --check
          git commit -m "fix(chat): make stale federation state inert [chat199-federation-stale-guard]"
          git push origin HEAD:lucy/chat-199-federation-identity-guard-20260903
