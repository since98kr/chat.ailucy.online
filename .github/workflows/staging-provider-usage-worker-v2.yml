name: Staging Provider Usage Worker V2

on:
  push:
    branches:
      - lucy/staging-provider-usage-gate-199

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce and validate provider gate source
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/staging-provider-usage-worker-v2.py')
          text = path.read_text()
          old = "s = s.rstrip() + provider_blocked_job + '\\n'"
          new = "s = s.rstrip() + '\\n\\n' + provider_blocked_job.lstrip('\\n')"
          if old not in text:
              raise SystemExit('EOF patch anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 .github/staging-provider-usage-worker-v2.py
          git diff --check
          node scripts/ops/staging-provider-usage-gate.nodecheck.mjs
          ruby - <<'RUBY'
          require 'yaml'
          value = YAML.load_file('.github/workflows/deploy-staging.yml')
          jobs = value.fetch('jobs')
          %w[provider_gate deploy provider_blocked].each { |name| raise "missing jobs.#{name}" unless jobs.key?(name) }
          raise 'provider_blocked leaked to top-level' if value.key?('provider_blocked')
          raise 'deploy must depend on provider_gate' unless jobs.fetch('deploy').fetch('needs') == 'provider_gate'
          raise 'provider_blocked must depend on provider_gate' unless jobs.fetch('provider_blocked').fetch('needs') == 'provider_gate'
          puts 'deploy-staging.yml structure PASS'
          RUBY
      - name: Commit only verified final source
        id: publish
        shell: bash
        run: |
          set -o pipefail
          {
            set -euxo pipefail
            git config user.name since98kr
            git config user.email since98kr@gmail.com
            git add .github/workflows/deploy-staging.yml package.json ops/staging-provider-usage-block.json scripts/ops/staging-provider-usage-gate.mjs scripts/ops/staging-provider-usage-gate.nodecheck.mjs docs/E2E_STAGING_QA_GATES.md
            git diff --cached --check
            git commit -m 'ci(staging): fail closed before provider calls when usage is exhausted'
            git push origin HEAD:lucy/staging-provider-usage-gate-199
          } 2>&1 | tee provider-gate-publish.log
      - name: Upload publish diagnostic
        if: failure() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: provider-gate-publish-diagnostic-${{ github.run_id }}
          path: provider-gate-publish.log
          if-no-files-found: error
          retention-days: 1
