name: OpenClaw staging config gate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: chat-v2-openclaw-staging-config
  cancel-in-progress: true

jobs:
  config:
    name: Validate OpenClaw staging environment contract
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5

    steps:
      - name: Mark configuration check pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'chat-v2/openclaw-config',
              description: 'Validating OpenClaw staging Environment contract',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Validate private OpenClaw routing contract and secret presence
        id: validate
        shell: bash
        env:
          OPENCLAW_CONTAINER_BASE_URL: http://host.docker.internal:18792
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
          OPENCLAW_LUCY_TARGET: openclaw/main
          LETTA_OPENCLAW_SESSION_PREFIX: ${{ vars.LETTA_OPENCLAW_SESSION_PREFIX }}
        run: |
          set -euo pipefail
          [[ "${OPENCLAW_CONTAINER_BASE_URL}" == 'http://host.docker.internal:18792' ]] \
            || { echo 'Chat staging must use the repository-owned private OpenClaw Docker bridge proxy.' >&2; exit 1; }
          [[ -n "${OPENCLAW_GATEWAY_TOKEN}" ]] || { echo 'OPENCLAW_GATEWAY_TOKEN is not configured.' >&2; exit 1; }
          [[ "${OPENCLAW_LUCY_TARGET}" == 'openclaw/main' ]] \
            || { echo 'Chat Letta must route through the canonical OpenClaw main agent.' >&2; exit 1; }
          [[ -n "${LETTA_OPENCLAW_SESSION_PREFIX}" ]] \
            || { echo 'LETTA_OPENCLAW_SESSION_PREFIX is not configured in the staging Environment.' >&2; exit 1; }
          echo 'OpenClaw private staging routing contract is present.'
          {
            echo '## OpenClaw staging configuration'
            echo
            echo '- Gateway ingress: Docker bridge proxy (`host.docker.internal:18792`) to the private reverse tunnel'
            echo '- Gateway credential: configured (value intentionally omitted)'
            echo '- Agent target: `openclaw/main` (repository-owned canonical target)'
            echo "- Session prefix: \`${LETTA_OPENCLAW_SESSION_PREFIX}\`"
            echo '- Backend model override: disabled; OpenClaw main keeps its configured model (`letta/lucy`)'
            echo '- Public `gateway.ailucy.online` is not a Chat Letta runtime dependency.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish configuration status
        if: always()
        uses: actions/github-script@v7
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        with:
          script: |
            const success = process.env.VALIDATION_OUTCOME === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'chat-v2/openclaw-config',
              description: success
                ? 'Private OpenClaw staging routing contract is configured'
                : 'OpenClaw staging routing contract is incomplete',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
