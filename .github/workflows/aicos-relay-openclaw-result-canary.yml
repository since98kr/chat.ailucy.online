name: AICOS relay OpenClaw result canary

on:
  push:
    branches:
      - test/aicos-relay-gateway-bridge
    paths:
      - .github/workflows/aicos-relay-openclaw-result-canary.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: aicos-relay-openclaw-result-canary
  cancel-in-progress: false

jobs:
  consume:
    if: ${{ github.actor == 'since98kr' }}
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 15
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Correlate child Result, return to OpenClaw, finalize parent
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PARENT_ISSUE: "118"
          CHILD_ISSUE: "119"
          OPENCLAW_GATEWAY_BASE_URL: ${{ vars.OPENCLAW_GATEWAY_BASE_URL }}
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ vars.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          LETTA_OPENCLAW_AGENT_TARGET: ${{ vars.LETTA_OPENCLAW_AGENT_TARGET }}
        run: |
          set -Eeuo pipefail
          umask 077
          node --input-type=module <<'NODE'
          const workMarker = '<!-- aicos-agent-relay:v1:work-order -->';
          const resultMarker = '<!-- aicos-agent-relay:v1:result -->';
          const repo = process.env.GH_REPO;
          const parentIssue = Number(process.env.PARENT_ISSUE);
          const childIssue = Number(process.env.CHILD_ISSUE);
          const ghToken = process.env.GH_TOKEN || '';
          const gatewayBase = (process.env.OPENCLAW_GATEWAY_BASE_URL || '').replace(/\/$/, '');
          const gatewayToken = process.env.OPENCLAW_GATEWAY_TOKEN || '';
          const target = process.env.LETTA_OPENCLAW_AGENT_TARGET || '';
          const parentTaskId = 'aicos-114-openclaw-outbound-canary-001';
          const childTaskId = 'aicos-114-openclaw-outbound-canary-001:chatgpt-001';
          const expectedChildSummary = 'CHATGPT_RELAY_CHILD_OK';
          const exactAck = 'OPENCLAW_CHILD_RESULT_CONSUMED_OK';

          function fail(message) { throw new Error(message); }
          async function gh(path, options = {}) {
            const response = await fetch('https://api.github.com' + path, {
              ...options,
              headers: {
                accept:'application/vnd.github+json',
                authorization:'Bearer ' + ghToken,
                'x-github-api-version':'2022-11-28',
                'content-type':'application/json',
                ...(options.headers || {})
              }
            });
            if (!response.ok) fail('GitHub API ' + response.status + ' ' + response.statusText);
            return response.status === 204 ? null : response.json();
          }
          function parse(body, marker) {
            if (typeof body !== 'string' || !body.includes(marker)) return null;
            const match = body.slice(body.indexOf(marker) + marker.length).match(/```json\s*([\s\S]*?)\s*```/i);
            if (!match) fail('relay JSON block missing');
            return JSON.parse(match[1]);
          }
          function render(value) {
            return resultMarker + '\n\n```json\n' + JSON.stringify(value, null, 2) + '\n```';
          }

          if (!ghToken || !gatewayToken) fail('required relay credential unavailable');
          const gatewayUrl = new URL(gatewayBase || 'https://invalid.invalid');
          if (gatewayUrl.protocol !== 'https:' || gatewayUrl.hostname !== 'gateway.ailucy.online') fail('unexpected Gateway endpoint');
          if (!/^(?:openclaw[/:]|agent:)[A-Za-z0-9._:-]+$/.test(target)) fail('OpenClaw target unavailable');

          const child = await gh(`/repos/${repo}/issues/${childIssue}`);
          const childWork = parse(child.body || '', workMarker);
          if (!childWork || childWork.taskId !== childTaskId || childWork.sourceAgent !== 'openclaw' || childWork.targetAgent !== 'chatgpt') fail('child Work Order identity mismatch');
          const childComments = await gh(`/repos/${repo}/issues/${childIssue}/comments?per_page=100`);
          const results = childComments.map((c) => parse(c.body || '', resultMarker)).filter(Boolean);
          const childResult = results.find((r) => r.taskId === childTaskId && r.agent === 'chatgpt' && r.status === 'PASS');
          if (!childResult) fail('correlated chatgpt PASS Result not found');
          if (childResult.summary !== expectedChildSummary) fail('chatgpt child summary mismatch');

          const parentComments = await gh(`/repos/${repo}/issues/${parentIssue}/comments?per_page=100`);
          const alreadyFinal = parentComments.map((c) => parse(c.body || '', resultMarker)).filter(Boolean)
            .some((r) => r.taskId === parentTaskId && r.agent === 'openclaw' && r.status === 'PASS');
          if (alreadyFinal) {
            console.log(JSON.stringify({parentTaskId, status:'ALREADY_FINAL', secretValuePrinted:false}));
            process.exit(0);
          }

          const prompt = [
            'You are OpenClaw + persistent Letta Lucy continuing a validated aicos.agent-relay/v1 parent Work Order.',
            'The child Work Order you dispatched to chatgpt has returned a correlated PASS Result.',
            'Child taskId: ' + childTaskId + '.',
            'Child status: PASS.',
            'Child summary: ' + expectedChildSummary + '.',
            'No tools, shell, host access, memory mutation, deployment, credentials, or live action are allowed.',
            'If you have consumed and correlated this child Result, reply with exactly this token and nothing else: ' + exactAck
          ].join(' ');
          const response = await fetch(gatewayBase + '/v1/chat/completions', {
            method:'POST',
            headers:{
              authorization:'Bearer ' + gatewayToken,
              'content-type':'application/json',
              'cf-access-client-id':process.env.CF_ACCESS_CLIENT_ID || '',
              'cf-access-client-secret':process.env.CF_ACCESS_CLIENT_SECRET || '',
              'x-openclaw-session-key':'aicos-relay:' + parentTaskId + ':result:run-' + process.env.GITHUB_RUN_ID
            },
            body:JSON.stringify({model:target, stream:false, messages:[{role:'user', content:prompt}]}),
            signal:AbortSignal.timeout(600000)
          });
          let payload = null;
          try { payload = await response.json(); } catch {}
          let reply = payload?.choices?.[0]?.message?.content;
          if (Array.isArray(reply)) reply = reply.map((p) => typeof p === 'string' ? p : p?.text || '').join('');
          if (typeof reply !== 'string') reply = '';
          const exact = reply.trim() === exactAck;
          const final = exact ? {
            schemaVersion:'aicos.agent-relay/v1', kind:'result', taskId:parentTaskId,
            agent:'openclaw', status:'PASS', observedAt:new Date().toISOString(),
            summary:'OpenClaw dispatched the chatgpt child Work Order, consumed the correlated child Result, and completed the parent relay canary.',
            evidence:[
              `relay:child-issue:${childIssue}`,
              `relay:child-result-comment:${childResult.taskId}`,
              'chatgpt:child-result:PASS',
              'gateway:child-result-consumed:true'
            ],
            nextAction:'Promote the canary logic into the generic issue-driven OpenClaw relay adapter.'
          } : {
            schemaVersion:'aicos.agent-relay/v1', kind:'result', taskId:parentTaskId,
            agent:'openclaw', status:'BLOCKED', observedAt:new Date().toISOString(),
            summary:'The child Result was correlated by the adapter, but OpenClaw did not return the exact result-consumption acknowledgement.',
            evidence:[`relay:child-issue:${childIssue}`, 'gateway:child-result-consumed:false'],
            blockedReason:'OPENCLAW_CHILD_RESULT_ACK_MISMATCH'
          };
          await gh(`/repos/${repo}/issues/${parentIssue}/comments`, {method:'POST', body:JSON.stringify({body:render(final)})});
          console.log(JSON.stringify({parentTaskId, childTaskId, childIssue, childResult:'PASS', gatewayAck:exact, parentStatus:final.status, secretValuePrinted:false}));
          if (!response.ok || !exact) process.exit(1);
          NODE
