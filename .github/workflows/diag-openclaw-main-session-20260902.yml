name: DIAG OpenClaw main session 20260902

on:
  push:
    branches: [diag/openclaw-ws-20260902]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe exact main session through Gateway API
        env:
          OPENCLAW_GATEWAY_BASE_URL: ${{ vars.OPENCLAW_GATEWAY_BASE_URL }}
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ vars.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          LETTA_OPENCLAW_AGENT_TARGET: ${{ vars.LETTA_OPENCLAW_AGENT_TARGET }}
        run: |
          set -Eeuo pipefail
          marker="MAIN_SESSION_HEALTH_OK_${GITHUB_RUN_ID}"
          payload="$(node -e 'const [m,k]=process.argv.slice(1); process.stdout.write(JSON.stringify({model:m,stream:false,messages:[{role:"user",content:`Diagnostic canary. Return exactly ${k} and nothing else.`}]}))' "$LETTA_OPENCLAW_AGENT_TARGET" "$marker")"
          code="$(curl -sS --max-time 120 -o /tmp/main-session.json -w '%{http_code}' -X POST "${OPENCLAW_GATEWAY_BASE_URL%/}/v1/chat/completions" -H "Authorization: Bearer $OPENCLAW_GATEWAY_TOKEN" -H 'Content-Type: application/json' -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" -H 'x-openclaw-session-key: agent:main:main' --data "$payload" || true)"
          echo "http_status=$code"
          MARKER="$marker" CODE="$code" node -e 'const fs=require("fs"); const raw=fs.existsSync("/tmp/main-session.json")?fs.readFileSync("/tmp/main-session.json","utf8"):""; let d; try{d=JSON.parse(raw)}catch{console.log(JSON.stringify({ok:false,http:process.env.CODE,json:false,bodyPrefix:raw.slice(0,300)}));process.exit(1)} const c=d?.choices?.[0]?.message?.content??""; const ok=process.env.CODE==="200"&&String(c).includes(process.env.MARKER); console.log(JSON.stringify({ok,http:process.env.CODE,markerSeen:String(c).includes(process.env.MARKER),contentPrefix:String(c).slice(0,180),error:d?.error??null})); if(!ok) process.exit(1)'
