name: Patch production launcher defaults once

on:
  push:
    branches:
      - fix/production-runtime-contract

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'ops-patch-production-launcher-defaults' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-runtime-contract
          fetch-depth: 0

      - name: Patch production launcher defaults
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/deploy/production.sh')
          text = p.read_text()
          old = '''BACKUP_RETENTION="${CHAT_BACKUP_RETENTION:-14}"
HERMES_DOCKER_NETWORK="${HERMES_DOCKER_NETWORK:-}"
VERSION="$(node -p "require('${REPO_ROOT}/package.json').version")"
'''
          new = '''BACKUP_RETENTION="${CHAT_BACKUP_RETENTION:-14}"
HERMES_DOCKER_NETWORK="${HERMES_DOCKER_NETWORK:-}"
export LETTA_OPENCLAW_AGENT_TARGET="${LETTA_OPENCLAW_AGENT_TARGET:-openclaw/main}"
export LETTA_OPENCLAW_SESSION_PREFIX="${LETTA_OPENCLAW_SESSION_PREFIX:-chat-v2}"
export HERMES_BASE_URL_MAP_JSON="${HERMES_BASE_URL_MAP_JSON:-{\\"Gemma\\":\\"http://host.docker.internal:8643\\",\\"Lynn\\":\\"http://host.docker.internal:8644\\",\\"Xixi\\":\\"http://host.docker.internal:8645\\"}}"
VERSION="$(node -p "require('${REPO_ROOT}/package.json').version")"
'''
          if text.count(old) != 1:
              raise SystemExit('production launcher anchor mismatch')
          p.write_text(text.replace(old, new, 1))
          PY
          bash -n scripts/deploy/production.sh
          git diff --check
          git config user.name 'since98kr'
          git config user.email 'since98kr@gmail.com'
          git add scripts/deploy/production.sh
          git commit -m 'fix production launcher defaults'
          git push origin HEAD:fix/production-runtime-contract
