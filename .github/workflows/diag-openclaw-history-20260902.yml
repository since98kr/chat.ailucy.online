name: DIAG OpenClaw history metadata 20260902

on:
  push:
    branches: [diag/openclaw-history-20260902]

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read main-session history metadata only
        env:
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const token=process.env.OPENCLAW_GATEWAY_TOKEN;
          const ws=new WebSocket('ws://127.0.0.1:18789/');
          let done=false;
          const timer=setTimeout(()=>finish(false,'timeout'),15000);
          function send(id,method,params){ws.send(JSON.stringify({type:'req',id,method,params}));}
          function finish(ok,reason){if(done)return;done=true;clearTimeout(timer);console.log(`finish=${reason}`);try{ws.close()}catch{};setTimeout(()=>process.exit(ok?0:1),100);}
          function messageText(m){
            const c=m?.content;
            if(typeof c==='string') return c;
            if(Array.isArray(c)) return c.map(x=>typeof x==='string'?x:(typeof x?.text==='string'?x.text:'')).join('');
            if(typeof m?.text==='string') return m.text;
            return '';
          }
          ws.addEventListener('message',(e)=>{
            let f;try{f=JSON.parse(String(e.data))}catch{return finish(false,'invalid-json')}
            if(f.type==='event'&&f.event==='connect.challenge'){
              send('connect','connect',{minProtocol:4,maxProtocol:4,client:{id:'gateway-client',version:'2026.7.1-2',platform:'linux',mode:'backend'},role:'operator',scopes:['operator.read'],caps:[],commands:[],permissions:{},auth:{token},locale:'en-US',userAgent:'lucy-history-diag/1'});return;
            }
            if(f.type==='res'&&f.id==='connect'){
              if(!f.ok){console.log(`connect_error=${f.error?.code||'unknown'}`);return finish(false,'connect-failed')}
              send('history','chat.history',{sessionKey:'agent:main:main',limit:40});return;
            }
            if(f.type==='res'&&f.id==='history'){
              if(!f.ok){console.log(`history_error=${f.error?.code||'unknown'}`);return finish(false,'history-failed')}
              const p=f.payload||{};
              const messages=Array.isArray(p.messages)?p.messages:(Array.isArray(p)?p:[]);
              const summaries=messages.map((m,i)=>{
                const txt=messageText(m);
                const diagnostic=/Diagnostic canary|MAIN_SESSION_HEALTH_OK_|WS_CHAT_OK_|OPENCLAW_LIVE_HEALTH_OK/.test(txt);
                const ts=m?.timestamp??m?.createdAt??m?.created_at??m?.ts??null;
                return {i,role:m?.role??m?.type??'unknown',chars:txt.length,diagnostic,ts};
              });
              const nonDiag=summaries.filter(x=>!x.diagnostic);
              const tail=nonDiag.slice(-16);
              let userTail=0;for(let i=nonDiag.length-1;i>=0&&String(nonDiag[i].role).toLowerCase().includes('user');i--)userTail++;
              console.log(JSON.stringify({payloadKeys:Object.keys(p),messageCount:messages.length,nonDiagnosticCount:nonDiag.length,lastNonDiagnosticRole:nonDiag.at(-1)?.role??null,consecutiveUserTail:userTail,tail},null,2));
              return finish(true,'history-ok');
            }
          });
          ws.addEventListener('error',()=>finish(false,'ws-error'));
          NODE
