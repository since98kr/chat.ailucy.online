name: DIAG OpenClaw history metadata 20260902

on:
  push:
    branches: [diag/openclaw-history-20260902]

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inspect filtered Gateway latency logs
        env:
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const token=process.env.OPENCLAW_GATEWAY_TOKEN;
          const ws=new WebSocket('ws://127.0.0.1:18789/');
          let done=false;
          const timer=setTimeout(()=>finish(false,'timeout'),15000);
          function send(id,method,params){ws.send(JSON.stringify({type:'req',id,method,params}));}
          function finish(ok,reason){if(done)return;done=true;clearTimeout(timer);console.log(`finish=${reason}`);try{ws.close()}catch{};setTimeout(()=>process.exit(ok?0:1),100);}
          function safe(line){
            let s=String(line??'');
            if(!/letta-harness|embedded run|lane task|tpm pace|provider failure|fail-closed|stream timeout|runtime_start|queue|rate limit|usage limit/i.test(s)) return null;
            if(!/2026-09-02T00:(5[0-9]|0[0-5])|Sep 02 00:(5[0-9]|0[0-5])|08:5[0-9]|09:0[0-5]/.test(s) && !/tpm pace|provider failure|fail-closed|stream timeout/i.test(s)) return null;
            s=s.replace(/Bearer\s+\S+/gi,'Bearer [REDACTED]').replace(/sk-[A-Za-z0-9_-]+/g,'[REDACTED_KEY]');
            s=s.replace(/detail=Letta run failed:.*/,'detail=[REDACTED_FAILURE_DETAIL]');
            return s.slice(0,1200);
          }
          ws.addEventListener('message',(e)=>{
            let f;try{f=JSON.parse(String(e.data))}catch{return finish(false,'invalid-json')}
            if(f.type==='event'&&f.event==='connect.challenge'){
              send('connect','connect',{minProtocol:4,maxProtocol:4,client:{id:'gateway-client',version:'2026.7.1-2',platform:'linux',mode:'backend'},role:'operator',scopes:['operator.read'],caps:[],commands:[],permissions:{},auth:{token},locale:'en-US',userAgent:'lucy-log-diag/1'});return;
            }
            if(f.type==='res'&&f.id==='connect'){
              if(!f.ok)return finish(false,'connect-failed');
              send('logs','logs.tail',{limit:5000,maxBytes:2000000});return;
            }
            if(f.type==='res'&&f.id==='logs'){
              if(!f.ok){console.log(`logs_error=${f.error?.code||'unknown'}`);return finish(false,'logs-failed')}
              const p=f.payload||{};
              const candidates=[];
              if(Array.isArray(p.lines))candidates.push(...p.lines);
              if(Array.isArray(p.entries))candidates.push(...p.entries);
              if(typeof p.text==='string')candidates.push(...p.text.split('\n'));
              if(typeof p.data==='string')candidates.push(...p.data.split('\n'));
              const lines=candidates.map(x=>typeof x==='string'?x:JSON.stringify(x)).map(safe).filter(Boolean);
              console.log(JSON.stringify({payloadKeys:Object.keys(p),candidateCount:candidates.length,matchedCount:lines.length,lines:lines.slice(-180)},null,2));
              return finish(true,'logs-ok');
            }
          });
          ws.addEventListener('error',()=>finish(false,'ws-error'));
          NODE
