name: DIAG OpenClaw history metadata 20260902

on:
  push:
    branches: [diag/openclaw-history-20260902]

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read main-session runtime metadata only
        env:
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const token=process.env.OPENCLAW_GATEWAY_TOKEN;
          const ws=new WebSocket('ws://127.0.0.1:18789/');
          let done=false;
          const timer=setTimeout(()=>finish(false,'timeout'),15000);
          function send(id,method,params){ws.send(JSON.stringify({type:'req',id,method,params}));}
          function finish(ok,reason){if(done)return;done=true;clearTimeout(timer);console.log(`finish=${reason}`);try{ws.close()}catch{};setTimeout(()=>process.exit(ok?0:1),100);}
          function pick(s){if(!s||typeof s!=='object')return null;const keys=['key','sessionId','status','startedAt','endedAt','runtimeMs','modelProvider','model','agentRuntime','contextTokens','totalTokensFresh','effectiveFastMode','effectiveFastModeSource','fastAutoOnSeconds','hasActiveRun','abortedLastRun','thinkingLevel','unread','updatedAt'];const out={};for(const k of keys)out[k]=s[k]??null;out.activeRunCount=Array.isArray(s.activeRunIds)?s.activeRunIds.length:null;out.effectiveResponseUsage=s.effectiveResponseUsage??null;return out;}
          ws.addEventListener('message',(e)=>{
            let f;try{f=JSON.parse(String(e.data))}catch{return finish(false,'invalid-json')}
            if(f.type==='event'&&f.event==='connect.challenge'){
              send('connect','connect',{minProtocol:4,maxProtocol:4,client:{id:'gateway-client',version:'2026.7.1-2',platform:'linux',mode:'backend'},role:'operator',scopes:['operator.read'],caps:[],commands:[],permissions:{},auth:{token},locale:'en-US',userAgent:'lucy-runtime-diag/1'});return;
            }
            if(f.type==='res'&&f.id==='connect'){
              if(!f.ok)return finish(false,'connect-failed');
              send('history','chat.history',{sessionKey:'agent:main:main',limit:2});return;
            }
            if(f.type==='res'&&f.id==='history'){
              if(!f.ok)return finish(false,'history-failed');
              const p=f.payload||{};
              console.log(JSON.stringify({thinkingLevel:p.thinkingLevel??null,sessionInfo:pick(p.sessionInfo),defaults:{modelProvider:p.defaults?.modelProvider??null,model:p.defaults?.model??null,contextTokens:p.defaults?.contextTokens??null,agentRuntime:p.defaults?.agentRuntime??null,thinkingDefault:p.defaults?.thinkingDefault??null}},null,2));
              return finish(true,'history-ok');
            }
          });
          ws.addEventListener('error',()=>finish(false,'ws-error'));
          NODE
