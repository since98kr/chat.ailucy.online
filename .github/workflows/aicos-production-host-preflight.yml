name: AICOS Production Host Preflight from Chat Staging

on:
  push:
    branches:
      - ops/wake-lho-runner-from-chat-staging-v1
    paths:
      - .github/workflows/aicos-production-host-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ vars.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      HERMES_BASE_URL: ${{ vars.HERMES_BASE_URL }}
      HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
    steps:
      - name: Classify exact production-host capabilities without mutation
        shell: bash
        run: |
          set -euo pipefail
          host="$(hostname -s)"
          user="$(id -un)"
          source='/opt/data/projects/ai-collaboration-os'
          app='aicos-app'

          docker_ok=false
          app_present=false
          source_present=false
          source_readable=false
          source_writable=false
          source_sha='unavailable'
          source_clean='unknown'
          deployed_sha='unavailable'
          user_bus_direct=false
          hermes_health=false

          if docker version >/dev/null 2>&1; then
            docker_ok=true
            if docker inspect "$app" >/dev/null 2>&1; then
              app_present=true
              deployed_sha="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$app" | sed -n 's/^AICOS_COMMIT_SHA=//p' | tail -n1)"
              [[ -n "$deployed_sha" ]] || deployed_sha='missing'
            fi
          fi
          if [[ -d "$source/.git" ]]; then
            source_present=true
            [[ -r "$source/.git/HEAD" ]] && source_readable=true
            [[ -w "$source/.git" ]] && source_writable=true
            if [[ "$source_readable" == true ]]; then
              source_sha="$(git -C "$source" rev-parse HEAD 2>/dev/null || printf unavailable)"
              if [[ -z "$(git -C "$source" status --porcelain 2>/dev/null || printf error)" ]]; then source_clean=true; else source_clean=false; fi
            fi
          fi

          target_uid="$(id -u since98kr 2>/dev/null || true)"
          if [[ -n "$target_uid" ]] && env XDG_RUNTIME_DIR="/run/user/${target_uid}" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/${target_uid}/bus" \
              systemctl --user show actions.runner.since98kr-lucy-hermes-optimization.agentlucy.service --property=LoadState --value >/dev/null 2>&1; then
            user_bus_direct=true
          fi

          if [[ -n "${HERMES_BASE_URL:-}" && -n "${HERMES_API_KEY:-}" ]]; then
            hermes_url="${HERMES_BASE_URL%/}/health"
            if [[ "$hermes_url" == *host.docker.internal* ]] && [[ "$docker_ok" == true ]]; then
              gateway="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}' 2>/dev/null || true)"
              [[ -n "$gateway" ]] && hermes_url="${hermes_url/host.docker.internal/${gateway}}"
            fi
            if curl -fsS --max-time 5 -H "Authorization: Bearer ${HERMES_API_KEY}" "$hermes_url" >/dev/null 2>&1; then hermes_health=true; fi
          fi

          printf 'host=%s\nuser=%s\ndocker_ok=%s\naicos_app_present=%s\nsource_present=%s\nsource_readable=%s\nsource_writable=%s\nsource_sha=%s\nsource_clean=%s\ndeployed_sha=%s\nuser_bus_direct=%s\ncloudflare_api_token_present=%s\ncloudflare_account_id_present=%s\ncf_access_identity_present=%s\nhermes_health=%s\n' \
            "$host" "$user" "$docker_ok" "$app_present" "$source_present" "$source_readable" "$source_writable" "$source_sha" "$source_clean" "$deployed_sha" "$user_bus_direct" \
            "$( [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] && echo true || echo false )" \
            "$( [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] && echo true || echo false )" \
            "$( [[ -n "${CF_ACCESS_CLIENT_ID:-}" && -n "${CF_ACCESS_CLIENT_SECRET:-}" ]] && echo true || echo false )" \
            "$hermes_health"
