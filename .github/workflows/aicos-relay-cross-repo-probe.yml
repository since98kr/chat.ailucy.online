name: AICOS relay cross-repo probe

on:
  push:
    branches:
      - test/aicos-relay-gateway-bridge
    paths:
      - .github/workflows/aicos-relay-cross-repo-probe.yml

permissions:
  contents: read

concurrency:
  group: aicos-relay-cross-repo-probe
  cancel-in-progress: false

jobs:
  probe:
    if: ${{ github.actor == 'since98kr' }}
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Probe existing runner GitHub identity without exposing credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          command -v gh >/dev/null || { echo 'gh_available=false'; exit 1; }

          repo_json="$(gh api /repos/since98kr/ai-collaboration-os 2>/dev/null)" || {
            echo 'aicos_private_repo_readable=false'
            exit 1
          }
          issue_json="$(gh api /repos/since98kr/ai-collaboration-os/issues/118 2>/dev/null)" || {
            echo 'aicos_canary_readable=false'
            exit 1
          }

          node --input-type=module <<'NODE' "$repo_json" "$issue_json"
          const repo = JSON.parse(process.argv[1]);
          const issue = JSON.parse(process.argv[2]);
          console.log(JSON.stringify({
            ghAvailable: true,
            aicosPrivateRepoReadable: repo.full_name === 'since98kr/ai-collaboration-os',
            aicosCanaryReadable: issue.number === 118,
            repoPushPermission: repo.permissions?.push === true,
            repoMaintainPermission: repo.permissions?.maintain === true,
            canaryHasRelayMarker: typeof issue.body === 'string' && issue.body.includes('aicos-agent-relay:v1:work-order'),
            secretValuePrinted: false
          }));
          NODE
