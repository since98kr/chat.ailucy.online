name: Chat 199 routeable-agent guard worker

on:
  push:
    branches:
      - lucy/chat-199-routeable-agent-guard-20260903

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lucy/chat-199-routeable-agent-guard-20260903
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply fail-closed routeability patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          collaboration = Path('server/collaboration.ts')
          text = collaboration.read_text()
          old = "const timestamp = () => new Date().toISOString();\n\nconst seedAgents"
          new = "const timestamp = () => new Date().toISOString();\n\nexport function claudeDirectChatEnabled(env: NodeJS.ProcessEnv = process.env) {\n  if (env.NODE_ENV === 'test') return true;\n  return Boolean(env.CLAUDE_BASE_URL?.trim());\n}\n\nconst seedAgents"
          if old not in text:
              raise SystemExit('collaboration helper anchor not found')
          text = text.replace(old, new, 1)
          old = "      for (const agent of seedAgents) {\n        const createdAt = timestamp();\n        statement.run("
          new = "      for (const agent of seedAgents) {\n        const createdAt = timestamp();\n        const directChatEnabled = agent.systemId === 'claude'\n          ? claudeDirectChatEnabled()\n          : agent.directChatEnabled;\n        statement.run("
          if old not in text:
              raise SystemExit('collaboration seed anchor not found')
          text = text.replace(old, new, 1)
          old = "          agent.enabled ? 1 : 0,\n          agent.directChatEnabled ? 1 : 0,\n          agent.isLead ? 1 : 0,"
          new = "          agent.enabled ? 1 : 0,\n          directChatEnabled ? 1 : 0,\n          agent.isLead ? 1 : 0,"
          if old not in text:
              raise SystemExit('collaboration direct-chat value anchor not found')
          collaboration.write_text(text.replace(old, new, 1))
          sidebar = Path('src/AppSidebar.tsx')
          text = sidebar.read_text()
          old = "  const lead = agents.find((agent) => agent.isLead) ?? agents[0];"
          new = "  const lead = agents.find((agent) => agent.isLead && agent.enabled && agent.directChatEnabled)\n    ?? agents.find((agent) => agent.enabled && agent.directChatEnabled);"
          if old not in text:
              raise SystemExit('sidebar lead anchor not found')
          text = text.replace(old, new, 1)
          old = "<span><strong>{label}</strong><small>{id === 'letta' ? 'Memory-first system' : id === 'claude' ? 'Independent review system' : 'Collaborative system'}</small></span>"
          new = "<span><strong>{label}</strong><small>{!lead ? 'Backend not configured' : id === 'letta' ? 'Memory-first system' : id === 'claude' ? 'Independent review system' : 'Collaborative system'}</small></span>"
          if old not in text:
              raise SystemExit('sidebar status anchor not found')
          sidebar.write_text(text.replace(old, new, 1))
          encoded = ''
          Path('server/claude-routing-availability.test.ts').write_bytes(base64.b64decode(encoded))
          PY

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and contract tests
        run: npm test -- --run

      - name: Production build
        run: npm run build

      - name: Commit verified source and remove worker
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chat199-routeable-agent-worker.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/collaboration.ts src/AppSidebar.tsx server/claude-routing-availability.test.ts .github/workflows/chat199-routeable-agent-worker.yml
          git diff --cached --check
          git commit -m "fix(chat): fail closed for unconfigured Claude routing [chat199-routeable-guard-done]"
          git push origin HEAD:lucy/chat-199-routeable-agent-guard-20260903
