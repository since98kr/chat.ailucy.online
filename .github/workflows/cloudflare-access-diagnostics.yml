name: Diagnose staging Cloudflare Access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Diagnose service-token response without exposing credentials
        shell: bash
        env:
          CHAT_STAGING_BASE_URL: ${{ vars.CHAT_PUBLIC_ORIGIN }}
          CF_ACCESS_CLIENT_ID: ${{ vars.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          [[ -n "${CHAT_STAGING_BASE_URL:-}" ]] || { echo 'CHAT_PUBLIC_ORIGIN is missing'; exit 1; }
          [[ -n "${CF_ACCESS_CLIENT_ID:-}" ]] || { echo 'CF_ACCESS_CLIENT_ID is missing'; exit 1; }
          [[ -n "${CF_ACCESS_CLIENT_SECRET:-}" ]] || { echo 'CF_ACCESS_CLIENT_SECRET is missing'; exit 1; }

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          url="${CHAT_STAGING_BASE_URL%/}/api/health"
          status="$(curl --silent --show-error --max-redirs 0 \
            -D "$tmp/headers" -o "$tmp/body" -w '%{http_code}' \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            "$url" || true)"

          header_value() {
            awk -v key="$1" 'BEGIN { IGNORECASE=1 } index(tolower($0), tolower(key) ":") == 1 { sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit }' "$tmp/headers"
          }

          content_type="$(header_value content-type)"
          server="$(header_value server)"
          location="$(header_value location)"
          cf_ray="$(header_value cf-ray)"
          access_jwt="$(header_value cf-access-jwt-assertion)"
          safe_location="$(printf '%s' "$location" | sed -E 's#(https?://[^/?#]+/[^?#]*).*#\1#')"
          title="$(tr '\n' ' ' < "$tmp/body" | sed -nE 's#.*<title[^>]*>([^<]{0,200})</title>.*#\1#Ip' | head -n 1)"
          prefix="$(head -c 80 "$tmp/body" | tr '\n\r\t' ' ' | sed -E 's/[[:space:]]+/ /g')"

          printf '{\n'
          printf '  "status": %s,\n' "${status:-0}"
          printf '  "contentType": "%s",\n' "${content_type//\"/\\\"}"
          printf '  "server": "%s",\n' "${server//\"/\\\"}"
          printf '  "location": "%s",\n' "${safe_location//\"/\\\"}"
          [[ -n "$cf_ray" ]] && cf_ray_present=true || cf_ray_present=false
          [[ -n "$access_jwt" ]] && access_jwt_present=true || access_jwt_present=false
          printf '  "cfRayPresent": %s,\n' "$cf_ray_present"
          printf '  "accessJwtPresent": %s,\n' "$access_jwt_present"
          printf '  "title": "%s",\n' "${title//\"/\\\"}"
          printf '  "bodyPrefix": "%s"\n' "${prefix//\"/\\\"}"
          printf '}\n'

          [[ "$status" == "200" && "${content_type,,}" == *application/json* ]]
