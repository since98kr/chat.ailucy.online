name: AICOS OpenClaw Hermes E2E resume

on:
  push:
    branches:
      - test/aicos-relay-gateway-bridge
    paths:
      - .github/workflows/aicos-openclaw-hermes-e2e-resume.yml

permissions:
  contents: read
  issues: write

jobs:
  resume:
    if: ${{ github.actor == 'since98kr' }}
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 87b3a4466d42b1366fffae0f27b039efafab862f
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resume existing child and parent only
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENCLAW_GATEWAY_BASE_URL: ${{ vars.OPENCLAW_GATEWAY_BASE_URL }}
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ vars.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          LETTA_OPENCLAW_AGENT_TARGET: ${{ vars.LETTA_OPENCLAW_AGENT_TARGET }}
          HERMES_BASE_URL: ${{ vars.HERMES_BASE_URL }}
          HERMES_CHAT_PATH: ${{ vars.HERMES_CHAT_PATH }}
          HERMES_AGENT_ID: ${{ vars.HERMES_AGENT_ID }}
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
          HERMES_MODEL_MAP_JSON: ${{ vars.HERMES_MODEL_MAP_JSON }}
        run: |
          set -Eeuo pipefail
          if [[ "${HERMES_BASE_URL}" == *"host.docker.internal"* ]]; then
            docker_gateway="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
            export HERMES_BASE_URL="${HERMES_BASE_URL/host.docker.internal/${docker_gateway}}"
          fi
          node scripts/aicos-hermes-relay-handler.mjs sweep
          sleep 2
          node scripts/aicos-openclaw-relay-handler.mjs sweep
          node --input-type=module <<'NODE'
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/issues/121/comments?per_page=100`, {
            headers:{accept:'application/vnd.github+json',authorization:`Bearer ${process.env.GITHUB_TOKEN}`,'x-github-api-version':'2022-11-28'}
          });
          const comments = await response.json();
          const text = comments.map(c => c.body || '').join('\n');
          if (!text.includes('"taskId": "aicos-114-openclaw-hermes-e2e-001"') || !text.includes('"agent": "openclaw"') || !text.includes('"status": "PASS"')) {
            throw new Error('OpenClaw parent PASS not observed');
          }
          console.log(JSON.stringify({openclawHermesRoundTrip:true,parentIssue:121,childIssue:122,secretValuePrinted:false}));
          NODE
