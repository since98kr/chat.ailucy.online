name: One-shot Chat production release enable

on:
  push:
    branches:
      - lucy/prod-dispatch-chat-11036295-20260924

permissions:
  actions: write
  contents: read

jobs:
  enable-and-rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable exact production release switch and rerun failed canonical job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: "35958515755"
          EXPECTED_SHA: "11036295770060ec8279af4b21194d99cbb56c2f"
        run: |
          set -euo pipefail

          run_json="$(
            curl -fsSL               -H "Authorization: Bearer ${GH_TOKEN}"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          )"

          RUN_JSON="${run_json}" EXPECTED_SHA="${EXPECTED_SHA}" python3 - <<'PY'
          import json, os
          x=json.loads(os.environ["RUN_JSON"])
          if x.get("head_sha") != os.environ["EXPECTED_SHA"]:
              raise SystemExit("production run head SHA drift")
          if x.get("name") != "Production release gate":
              raise SystemExit("unexpected production workflow")
          print("production-run-identity=verified")
          PY

          # Update only the pre-existing production environment kill switch.
          curl -fsS -X PATCH             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments/production/variables/CHAT_PRODUCTION_RELEASE_ENABLED"             -d '{"name":"CHAT_PRODUCTION_RELEASE_ENABLED","value":"true"}'

          echo "production-release-switch=enabled"

          # Re-run only the failed canonical production job. Environment protection remains in force.
          curl -fsS -X POST             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs"

          echo "canonical-production-rerun=requested"
