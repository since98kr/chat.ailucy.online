name: Diagnose public artifact stream failure

on:
  push:
    branches:
      - diag/public-artifact-500

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, chat-staging]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load authoritative Cloudflare staging identity
        env:
          CHAT_PUBLIC_ORIGIN: https://chat-staging.ailucy.online
          CHAT_CLOUDFLARE_ACCESS_STATE_FILE: /opt/chat-v2/staging/secrets/cloudflare-access-staging.json
        run: node scripts/ops/load-cloudflare-staging-identity.mjs
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Ensure Chromium
        run: npx playwright install chromium
      - name: Reproduce public artifact stream and capture origin error
        env:
          CHAT_STAGING_BASE_URL: https://chat-staging.ailucy.online
          LETTA_PROTOCOL: openclaw
        run: |
          set +e
          npx playwright test --config playwright.external.config.ts e2e-staging/artifacts.spec.ts
          result=$?
          echo '=== staging container error tail ==='
          docker logs --since 10m chat-v2-staging 2>&1 | tail -n 300 || true
          exit "$result"
