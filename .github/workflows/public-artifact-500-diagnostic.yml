name: Diagnose public external OpenClaw QA

on:
  push:
    branches:
      - diag/public-artifact-500

permissions:
  contents: read

# Re-run against fix/external-openclaw-qa head after image-load synchronization update.
jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, chat-staging]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/external-openclaw-qa
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load authoritative Cloudflare staging identity
        env:
          CHAT_PUBLIC_ORIGIN: https://chat-staging.ailucy.online
          CHAT_CLOUDFLARE_ACCESS_STATE_FILE: /opt/chat-v2/staging/secrets/cloudflare-access-staging.json
        run: node scripts/ops/load-cloudflare-staging-identity.mjs
      - name: Run scoped public Access and artifact transport QA
        env:
          CHAT_STAGING_BASE_URL: https://chat-staging.ailucy.online
          LETTA_PROTOCOL: openclaw
        run: bash scripts/ops/external-staging-browser-smoke.sh
