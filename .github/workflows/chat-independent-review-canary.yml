name: Chat independent review canary

on:
  push:
    branches:
      - lucy/chat-independent-review-canary-20260903

permissions:
  contents: read

jobs:
  reviewer-canary:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 8
    steps:
      - name: Require private OpenClaw staging ingress
        shell: bash
        env:
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${OPENCLAW_GATEWAY_TOKEN}" ]] || { echo 'OPENCLAW_GATEWAY_TOKEN_MISSING'; exit 1; }
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:18789/health >/dev/null
          echo 'OPENCLAW_REVIEWER_GATEWAY_HEALTHY'

      - name: Probe independent DeepSeek reviewer
        shell: bash
        env:
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          req="$RUNNER_TEMP/reviewer-canary-request.json"
          out="$RUNNER_TEMP/reviewer-canary-response.json"
          printf '%s' '{"model":"deepseek/deepseek-v4-pro","stream":false,"max_tokens":32,"messages":[{"role":"user","content":"Reply exactly REVIEWER_OK"}]}' >"$req"
          set +e
          curl --silent --show-error --fail-with-body \
            --max-time 240 \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${OPENCLAW_GATEWAY_TOKEN}" \
            --data-binary @"$req" \
            http://127.0.0.1:18789/v1/chat/completions >"$out" 2>"$RUNNER_TEMP/reviewer-canary.err"
          rc=$?
          set -e
          if [[ $rc -ne 0 ]]; then
            echo "INDEPENDENT_REVIEWER_CANARY_FAILED rc=$rc"
            exit 1
          fi
          if ! grep -q 'REVIEWER_OK' "$out"; then
            echo 'INDEPENDENT_REVIEWER_CANARY_BAD_RESPONSE'
            exit 1
          fi
          echo 'INDEPENDENT_REVIEWER_CANARY_PASS model=deepseek/deepseek-v4-pro'
