name: Hermes profile recovery probe

on:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 4
    steps:
      - name: Ask default Hermes for one bounded local probe
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          prompt = (
              "AUTHORIZED READ-ONLY LOCAL PROBE. Use your terminal tool only on this host. "
              "Do not modify anything. Run only: id -un; test whether $HOME/.hermes/profiles exists; "
              "list only immediate profile directory names; report whether gemma/lynn/xixi .env files exist; "
              "report whether systemctl --user is-system-running succeeds. "
              "Return exactly one compact JSON object with keys user, profileDirExists, profileNames, "
              "envExists with gemma/lynn/xixi booleans, and userSystemdAvailable. Never print secret/config values."
          )
          payload=json.dumps({"model":"hermes-agent","messages":[{"role":"user","content":prompt}],"stream":False}).encode()
          req=urllib.request.Request(
              "http://172.17.0.1:8642/v1/chat/completions",
              data=payload,
              headers={
                  "Authorization":"Bearer "+os.environ["HERMES_API_KEY"],
                  "Content-Type":"application/json",
                  "User-Agent":"Lucy-CDL-profile-probe"
              },
              method="POST"
          )
          with urllib.request.urlopen(req,timeout=75) as r:
              raw=json.load(r)
          ans=raw.get("choices",[{}])[0].get("message",{}).get("content","")
          a=ans.find("{"); b=ans.rfind("}")
          if a < 0 or b < a:
              raise SystemExit("probe did not return JSON")
          obj=json.loads(ans[a:b+1])
          safe={
              "user":str(obj.get("user",""))[:80],
              "profileDirExists":bool(obj.get("profileDirExists",False)),
              "profileNames":[str(x)[:80] for x in obj.get("profileNames",[])][:20],
              "envExists":{k:bool((obj.get("envExists") or {}).get(k,False)) for k in ("gemma","lynn","xixi")},
              "userSystemdAvailable":bool(obj.get("userSystemdAvailable",False))
          }
          print(json.dumps(safe,ensure_ascii=False,sort_keys=True))
          PY
