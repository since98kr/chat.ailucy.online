name: Probe Hermes profile recovery

on:
  workflow_dispatch:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Inspect B200 Qwen server process read-only
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/lucy-b200-qwen-8080-20260924.json
          rm -f "$OUT" 2>/dev/null || true
          python3 - <<'PY'
          import json,os,urllib.request
          script=r'''python3 - <<'HOSTPY'
          from pathlib import Path
          import json, subprocess, re

          proxy="ssh -i /home/since98kr/.ssh/hni-gpu-tunnel.key -p 3006 -W %h:%p -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null hni-gpu-tunnel@59.14.42.208"
          base=[
              "ssh","-i","/home/since98kr/.ssh/kgeo-2026-dev2_key",
              "-o","ExitOnForwardFailure=yes",
              "-o","StrictHostKeyChecking=no",
              "-o","UserKnownHostsFile=/dev/null",
              "-o","ProxyCommand="+proxy,
              "-p","44703","kgeo_01@59.150.32.1"
          ]
          remote="\n".join([
              "set -e",
              "echo '=== host ==='",
              "hostname",
              "echo '=== listener 8080 ==='",
              "ss -ltnp 2>/dev/null | grep ':8080 ' || true",
              "echo '=== listener process ==='",
              "pid=$(ss -ltnp 2>/dev/null | sed -n 's/.*:8080 .*pid=\\([0-9][0-9]*\\).*/\\1/p' | head -1)",
              "if [ -n \"$pid\" ]; then echo PID=$pid; ps -o pid=,ppid=,user=,comm=,args= -p \"$pid\"; echo EXE=$(readlink /proc/$pid/exe 2>/dev/null || true); echo CWD=$(readlink /proc/$pid/cwd 2>/dev/null || true); fi",
              "echo '=== candidate services ==='",
              "systemctl --user list-units --type=service --all --no-pager 2>/dev/null | grep -Ei 'vllm|qwen|model|router|inference' || true",
              "systemctl --user list-unit-files --type=service --no-pager 2>/dev/null | grep -Ei 'vllm|qwen|model|router|inference' || true",
              "echo '=== version health ==='",
              "curl -fsS --max-time 5 http://127.0.0.1:8080/version || true",
              "echo",
              "curl -fsS --max-time 5 http://127.0.0.1:8080/health >/dev/null && echo HEALTH_OK || echo HEALTH_FAIL"
          ])
          p=subprocess.run(base+[remote],capture_output=True,text=True,timeout=35)
          out=(p.stdout+"\n"+p.stderr)
          out=re.sub(r'(?i)(--api-key|api[_-]?key|token|secret|password)(?:=|\s+)\S+',r'\1 <redacted>',out)
          dest=Path("/tmp/lucy-b200-qwen-8080-20260924.json")
          dest.write_text(json.dumps({"rc":p.returncode,"output":out[:24000]},ensure_ascii=False,indent=2)+"\n")
          dest.chmod(0o644)
          print("LUCY_B200_QWEN_8080_WRITTEN")
          HOSTPY'''
          prompt=("AUTHORIZED READ-ONLY INFRA DIAGNOSTIC. Execute this script verbatim once with the terminal tool. "
                  "It uses the already-configured B200 SSH path only to inspect port 8080 listener/process/service metadata and health; no mutation. "
                  "Do not display private key contents or secrets. After success reply exactly LUCY_B200_QWEN_8080_WRITTEN.\n\n"+script)
          payload=json.dumps({"model":"hermes-agent","messages":[{"role":"user","content":prompt}],"stream":False}).encode()
          req=urllib.request.Request("http://172.17.0.1:8642/v1/chat/completions",data=payload,headers={
              "Authorization":"Bearer "+os.environ["HERMES_API_KEY"],
              "Content-Type":"application/json",
              "User-Agent":"Lucy-CDL-b200-qwen"
          },method="POST")
          with urllib.request.urlopen(req,timeout=90) as r:
              raw=json.load(r)
          ans=raw.get("choices",[{}])[0].get("message",{}).get("content","")
          if "LUCY_B200_QWEN_8080_WRITTEN" not in ans:
              raise SystemExit("Hermes did not confirm B200 inspection")
          PY
          [[ -r "$OUT" ]] || { echo "B200 inspection evidence missing"; exit 1; }
          cat "$OUT"
