name: Probe Hermes profile recovery

on:
  workflow_dispatch:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 3
    steps:
      - name: Read Gemma repair evidence and live endpoint
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          echo '=== repair evidence ==='
          if [[ -r /tmp/lucy-gemma-vision-enable-20260924.json ]]; then
            cat /tmp/lucy-gemma-vision-enable-20260924.json
          else
            echo 'repair-evidence=missing'
          fi

          echo '=== listeners ==='
          ss -ltn 2>/dev/null | awk 'NR==1 || /:(8642|8643|8644|8645)[[:space:]]/' || true

          echo '=== gemma models ==='
          python3 - <<'PY'
          import json,os,urllib.request
          req=urllib.request.Request(
              "http://172.17.0.1:8643/v1/models",
              headers={"Authorization":"Bearer "+os.environ["HERMES_API_KEY"],"User-Agent":"Lucy-CDL-gemma-post-repair"}
          )
          with urllib.request.urlopen(req,timeout=8) as r:
              obj=json.load(r)
          print(json.dumps({"http":200,"models":[x.get("id") for x in obj.get("data",[]) if isinstance(x,dict)]},sort_keys=True))
          PY
