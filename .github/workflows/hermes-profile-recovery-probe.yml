name: Probe Hermes profile recovery

on:
  workflow_dispatch:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-staging-disk-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    timeout-minutes: 4
    steps:
      - name: Inspect staging disk and Docker usage read-only
        shell: bash
        run: |
          set -euo pipefail
          echo '=== filesystem ==='
          df -h / /opt/chat-v2/staging 2>/dev/null || true
          echo '=== docker system df ==='
          docker system df 2>/dev/null || true
          echo '=== chat images ==='
          docker images --format '{{.Repository}} {{.Tag}} {{.ID}} {{.Size}} {{.CreatedSince}}'             | grep -E '^chat-ailucy-v2 ' | head -80 || true
          echo '=== running containers/images ==='
          docker ps --format '{{.Names}} {{.Image}} {{.Status}}' | head -80 || true
          echo '=== staging tree top-level ==='
          du -x -h -d 2 /opt/chat-v2/staging 2>/dev/null | sort -h | tail -40 || true
          echo '=== runner work usage ==='
          du -x -h -d 2 /opt/actions-runner-chat-staging/_work 2>/dev/null | sort -h | tail -40 || true
