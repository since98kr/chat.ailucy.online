name: Probe Hermes profile recovery

on:
  workflow_dispatch:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 3
    steps:
      - name: Prove Gemma image completion with tool_choice none
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          png="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z9U8AAAAASUVORK5CYII="
          payload={
            "model":"gemma",
            "messages":[{"role":"user","content":[
              {"type":"text","text":"Reply with READY after processing this attached image."},
              {"type":"image_url","image_url":{"url":"data:image/png;base64,"+png}}
            ]}],
            "tool_choice":"none",
            "max_tokens":16
          }
          req=urllib.request.Request("http://172.17.0.1:8643/v1/chat/completions",
            data=json.dumps(payload).encode(),
            headers={"Content-Type":"application/json","Authorization":"Bearer "+os.environ["HERMES_API_KEY"],"User-Agent":"Lucy-CDL-gemma-tool-none"},
            method="POST")
          try:
            with urllib.request.urlopen(req,timeout=90) as r:
              raw=json.load(r)
            h=raw.get("hermes") or {}
            msg=((raw.get("choices") or [{}])[0].get("message") or {}).get("content")
            passed=(r.status==200 and h.get("completed") is True and not h.get("failed"))
            print(json.dumps({"http":r.status,"completed":h.get("completed"),"failed":h.get("failed"),"contentPrefix":str(msg)[:300],"passed":passed},ensure_ascii=False))
            raise SystemExit(0 if passed else 2)
          except urllib.error.HTTPError as e:
            print(json.dumps({"http":e.code,"errorPrefix":e.read(1600).decode("utf-8","replace")},ensure_ascii=False))
            raise
          PY
