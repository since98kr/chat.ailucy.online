name: Probe Hermes profile recovery

on:
  workflow_dispatch:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 6
    steps:
      - name: Apply Gemma API tool-free runtime
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          script=r'''python3 - <<'HOSTPY'
          from pathlib import Path
          import yaml,shutil,subprocess
          p=Path.home()/".hermes"/"profiles"/"gemma"/"config.yaml"
          backup=p.with_name("config.yaml.bak.lucy-api-tool-free-final-20260924")
          shutil.copy2(p,backup)
          obj=yaml.safe_load(p.read_text()) or {}
          model=obj.get("model") or {}
          if model.get("default")!="kimi-vl" or model.get("supports_vision") is not True or model.get("context_length")!=131072:
              raise SystemExit("unexpected Gemma Kimi-VL vision state")
          pts=obj.setdefault("platform_toolsets",{})
          pts["cli"]=["web","vision","video","kanban","clarify"]
          pts["api_server"]=[]
          obj.setdefault("agent",{})["tool_use_enforcement"]="auto"
          p.write_text(yaml.safe_dump(obj,sort_keys=False,allow_unicode=True))
          chk=yaml.safe_load(p.read_text()) or {}
          if (chk.get("platform_toolsets") or {}).get("api_server")!=[]:
              shutil.copy2(backup,p)
              raise SystemExit("api_server toolset write validation failed")
          r=subprocess.run(["systemctl","--user","restart","hermes-gateway-gemma.service"],capture_output=True,text=True,timeout=30)
          if r.returncode!=0:
              shutil.copy2(backup,p)
              subprocess.run(["systemctl","--user","restart","hermes-gateway-gemma.service"],capture_output=True,text=True,timeout=30)
              raise SystemExit("Gemma restart failed")
          print("LUCY_GEMMA_API_TOOL_FREE_FINAL_SET")
          HOSTPY'''
          prompt=("AUTHORIZED STAGING GEMMA REPAIR. Execute verbatim once. Back up only Gemma config, restore normal CLI toolsets, set only "
                  "platform_toolsets.api_server to [], restore tool_use_enforcement=auto, and restart only hermes-gateway-gemma.service. "
                  "Do not modify credentials, B200, other profiles, production, DNS, or DB. "
                  "Reply exactly LUCY_GEMMA_API_TOOL_FREE_FINAL_SET.\n\n"+script)
          payload=json.dumps({"model":"hermes-agent","messages":[{"role":"user","content":prompt}],"stream":False}).encode()
          req=urllib.request.Request("http://172.17.0.1:8642/v1/chat/completions",data=payload,headers={
            "Authorization":"Bearer "+os.environ["HERMES_API_KEY"],"Content-Type":"application/json","User-Agent":"Lucy-CDL-gemma-api-final"},method="POST")
          with urllib.request.urlopen(req,timeout=80) as r: raw=json.load(r)
          ans=raw.get("choices",[{}])[0].get("message",{}).get("content","")
          if "LUCY_GEMMA_API_TOOL_FREE_FINAL_SET" not in ans: raise SystemExit("Hermes did not confirm final mutation")
          PY

      - name: Prove Gemma image response
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request,urllib.error
          key=os.environ["HERMES_API_KEY"]
          for _ in range(30):
              try:
                  q=urllib.request.Request("http://172.17.0.1:8643/v1/models",headers={"Authorization":"Bearer "+key})
                  with urllib.request.urlopen(q,timeout=3) as r:
                      if r.status==200: break
              except Exception: pass
              time.sleep(1)
          else: raise SystemExit("Gemma 8643 did not recover")
          png="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z9U8AAAAASUVORK5CYII="
          payload={"model":"gemma","messages":[{"role":"user","content":[
            {"type":"text","text":"Reply with READY after processing this attached image."},
            {"type":"image_url","image_url":{"url":"data:image/png;base64,"+png}}
          ]}],"max_tokens":32}
          q=urllib.request.Request("http://172.17.0.1:8643/v1/chat/completions",data=json.dumps(payload).encode(),
            headers={"Authorization":"Bearer "+key,"Content-Type":"application/json","User-Agent":"Lucy-CDL-gemma-image-final"},method="POST")
          with urllib.request.urlopen(q,timeout=90) as r: body=json.load(r)
          msg=str(((body.get("choices") or [{}])[0].get("message") or {}).get("content",""))
          passed=(r.status==200 and "READY" in msg.upper() and "HTTP 400" not in msg.upper())
          print(json.dumps({"http":r.status,"contentPrefix":msg[:300],"passed":passed},ensure_ascii=False))
          if not passed: raise SystemExit("Gemma image proof failed")
          PY

      - name: Roll back final Gemma mutation on proof failure
        if: failure()
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          script=r'''python3 - <<'HOSTPY'
          from pathlib import Path
          import shutil,subprocess
          p=Path.home()/".hermes"/"profiles"/"gemma"/"config.yaml"
          backup=p.with_name("config.yaml.bak.lucy-api-tool-free-final-20260924")
          if not backup.exists(): raise SystemExit("final backup missing")
          shutil.copy2(backup,p)
          subprocess.run(["systemctl","--user","restart","hermes-gateway-gemma.service"],capture_output=True,text=True,timeout=30)
          print("LUCY_GEMMA_API_TOOL_FREE_FINAL_ROLLED_BACK")
          HOSTPY'''
          payload=json.dumps({"model":"hermes-agent","messages":[{"role":"user","content":"AUTHORIZED ROLLBACK. Execute verbatim once and reply exactly LUCY_GEMMA_API_TOOL_FREE_FINAL_ROLLED_BACK.\n\n"+script}],"stream":False}).encode()
          req=urllib.request.Request("http://172.17.0.1:8642/v1/chat/completions",data=payload,headers={
            "Authorization":"Bearer "+os.environ["HERMES_API_KEY"],"Content-Type":"application/json","User-Agent":"Lucy-CDL-gemma-final-rollback"},method="POST")
          with urllib.request.urlopen(req,timeout=70) as r: r.read()
          PY
