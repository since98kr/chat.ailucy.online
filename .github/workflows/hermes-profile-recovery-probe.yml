name: Probe Hermes profile recovery

on:
  workflow_dispatch:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Inspect Hermes tool-disable configuration support
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/lucy-hermes-tool-config-20260924.txt
          rm -f "$OUT" 2>/dev/null || true
          python3 - <<'PY'
          import json,os,urllib.request
          script=r'''python3 - <<'HOSTPY'
          from pathlib import Path
          import re,yaml
          root=Path.home()/".hermes"/"hermes-agent"
          cfg=Path.home()/".hermes"/"profiles"/"gemma"/"config.yaml"
          out=[]
          if cfg.is_file():
              obj=yaml.safe_load(cfg.read_text()) or {}
              def walk(v,path=""):
                  if isinstance(v,dict):
                      for k,val in v.items():
                          p=f"{path}.{k}" if path else str(k)
                          if re.search(r'(key|token|secret|password)',p,re.I):
                              out.append(f"CFG {p}=<redacted>")
                          elif isinstance(val,(dict,list)):
                              out.append(f"CFG {p}=<{type(val).__name__}>")
                              walk(val,p)
                          else:
                              out.append(f"CFG {p}={val}")
                  elif isinstance(v,list):
                      for i,val in enumerate(v):
                          p=f"{path}[{i}]"
                          if isinstance(val,(dict,list)): walk(val,p)
                          else: out.append(f"CFG {p}={val}")
              walk(obj)
          patterns=re.compile(r'(tool_choice|disable.*tool|tool.*disable|enable.*tool|tools_enabled|enabled_tools|toolsets|toolset|tools:)')
          hits=[]
          for p in root.rglob("*.py"):
              try: lines=p.read_text(errors="replace").splitlines()
              except: continue
              for i,line in enumerate(lines,1):
                  if patterns.search(line.lower()):
                      hits.append((p,i))
          seen=set()
          for p,i in hits[:35]:
              a=max(1,i-10); b=min(len(p.read_text(errors="replace").splitlines()),i+20)
              key=(str(p),a,b)
              if key in seen: continue
              seen.add(key)
              lines=p.read_text(errors="replace").splitlines()
              out.append(f"=== {p.relative_to(root)}:{a}-{b} ===")
              for n in range(a,b+1):
                  s=lines[n-1]
                  if re.search(r'(key|token|secret|password)',s,re.I) and "=" in s:
                      s="<redacted-secret-assignment>"
                  out.append(f"{n}: {s[:900]}")
          dest=Path("/tmp/lucy-hermes-tool-config-20260924.txt")
          dest.write_text("\n".join(out[:1400])+"\n")
          dest.chmod(0o644)
          print("LUCY_HERMES_TOOL_CONFIG_WRITTEN")
          HOSTPY'''
          prompt=("AUTHORIZED READ-ONLY LOCAL DIAGNOSTIC. Execute the script below verbatim once. "
                  "It reads Gemma config structure and installed Hermes source around tool/tool_choice settings; secrets are redacted. "
                  "Do not change state. After success reply exactly LUCY_HERMES_TOOL_CONFIG_WRITTEN.\n\n"+script)
          payload=json.dumps({"model":"hermes-agent","messages":[{"role":"user","content":prompt}],"stream":False}).encode()
          req=urllib.request.Request("http://172.17.0.1:8642/v1/chat/completions",data=payload,headers={
            "Authorization":"Bearer "+os.environ["HERMES_API_KEY"],"Content-Type":"application/json","User-Agent":"Lucy-CDL-tool-config"},method="POST")
          with urllib.request.urlopen(req,timeout=90) as r: raw=json.load(r)
          ans=raw.get("choices",[{}])[0].get("message",{}).get("content","")
          if "LUCY_HERMES_TOOL_CONFIG_WRITTEN" not in ans: raise SystemExit("Hermes did not confirm tool config output")
          PY
          [[ -r "$OUT" ]] || { echo "tool config evidence missing"; exit 1; }
          cat "$OUT"
