name: Probe Hermes profile recovery

on:
  workflow_dispatch:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 6
    steps:
      - name: Inspect B200 vLLM launch mode read-only
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/lucy-b200-vllm-launch-20260924.json
          rm -f "$OUT" 2>/dev/null || true
          python3 - <<'PY'
          import json,os,urllib.request
          script = r"""python3 - <<'HOSTPY'
          from pathlib import Path
          import json,re,subprocess

          ssh=[
            "ssh","-o","BatchMode=yes","-o","ConnectTimeout=12",
            "-o","StrictHostKeyChecking=no","-o","UserKnownHostsFile=/dev/null",
            "-i",str(Path.home()/".ssh"/"kgeo-2026-dev2_key"),
            "-o",f"ProxyCommand=ssh -i {Path.home()}/.ssh/hni-gpu-tunnel.key -p 3006 -W %h:%p -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null hni-gpu-tunnel@59.14.42.208",
            "-p","44703","kgeo_01@59.150.32.1"
          ]
          remote="\n".join([
            "set +e",
            "echo '=== 8080 listener ==='",
            "ss -ltnp 2>/dev/null | awk 'NR==1 || /:8080[[:space:]]/'",
            "echo '=== candidate processes ==='",
            "ps -eo pid,ppid,user,etime,comm,args | grep -E '[v]llm|[a]pi_server|[q]wen3\\.5|[8]080' | head -80",
            "echo '=== user units ==='",
            "systemctl --user list-units --type=service --all --no-pager 2>/dev/null | grep -Ei 'vllm|qwen|8001|8080|model|router' || true",
            "systemctl --user list-unit-files --type=service --no-pager 2>/dev/null | grep -Ei 'vllm|qwen|8001|8080|model|router' || true",
            "echo '=== system units ==='",
            "systemctl list-units --type=service --all --no-pager 2>/dev/null | grep -Ei 'vllm|qwen|8001|8080|model|router' || true",
            "systemctl list-unit-files --type=service --no-pager 2>/dev/null | grep -Ei 'vllm|qwen|8001|8080|model|router' || true",
            "echo '=== docker containers ==='",
            "docker ps --format '{{.ID}} {{.Names}} {{.Image}} {{.Ports}} {{.Command}}' 2>/dev/null | grep -Ei 'vllm|qwen|8001|8080|model|router' || true"
          ])
          p=subprocess.run(ssh+[remote],capture_output=True,text=True,timeout=45)
          raw=(p.stdout+"\n"+p.stderr)
          raw=re.sub(r'((?:api[-_]?key|token|secret|password)(?:=|\s+))\S+',r'\1<redacted>',raw,flags=re.I)
          raw=re.sub(r'(--api-key\s+)\S+',r'\1<redacted>',raw,flags=re.I)
          data={"rc":p.returncode,"output":raw[:30000]}
          dest=Path("/tmp/lucy-b200-vllm-launch-20260924.json")
          dest.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
          dest.chmod(0o644)
          print("LUCY_B200_VLLM_LAUNCH_WRITTEN")
          HOSTPY"""
          prompt=("AUTHORIZED READ-ONLY B200 DIAGNOSTIC. Execute the script below verbatim once with the terminal tool. "
                  "It uses the already-configured SSH path only to inspect the remote 8080 listener, process command, service names, and container metadata. "
                  "It makes no remote changes and redacts credential-like arguments. After success reply exactly LUCY_B200_VLLM_LAUNCH_WRITTEN.\n\n"+script)
          payload=json.dumps({"model":"hermes-agent","messages":[{"role":"user","content":prompt}],"stream":False}).encode()
          req=urllib.request.Request("http://172.17.0.1:8642/v1/chat/completions",data=payload,headers={
            "Authorization":"Bearer "+os.environ["HERMES_API_KEY"],"Content-Type":"application/json","User-Agent":"Lucy-CDL-b200-vllm-readonly"},method="POST")
          with urllib.request.urlopen(req,timeout=120) as r: raw=json.load(r)
          ans=raw.get("choices",[{}])[0].get("message",{}).get("content","")
          if "LUCY_B200_VLLM_LAUNCH_WRITTEN" not in ans: raise SystemExit("Hermes did not confirm B200 launch file")
          PY
          [[ -r "$OUT" ]] || { echo "B200 launch evidence missing"; exit 1; }
          cat "$OUT"
