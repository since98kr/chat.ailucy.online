name: Probe Hermes profile recovery

on:
  workflow_dispatch:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Inspect 18793 process as Hermes service user
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/lucy-18793-process-20260924.json
          rm -f "$OUT" 2>/dev/null || true
          python3 - <<'PY'
          import json,os,urllib.request
          script=r'''python3 - <<'HOSTPY'
          from pathlib import Path
          import json, os, re, subprocess

          def sh(cmd):
              p=subprocess.run(cmd,shell=True,capture_output=True,text=True,timeout=15)
              return p.returncode,(p.stdout+"\n"+p.stderr)

          rc,ss=sh("ss -ltnp 'sport = :18793'")
          pids=sorted(set(re.findall(r'pid=(\d+)',ss)))
          rows=[]
          for pid in pids:
              rc2,out=sh(f"ps -o pid=,ppid=,user=,etime=,comm=,args= -p {pid}")
              out=re.sub(r'((?:api[-_]?key|token|secret|password)(?:=|\s+))\S+',r'\1<redacted>',out,flags=re.I)
              rows.append({"pid":pid,"ps":out.strip()[:5000]})
              ppid=""
              try:
                  stat=Path(f"/proc/{pid}/stat").read_text()
                  ppid=stat.split()[3]
              except Exception:
                  pass
              if ppid:
                  rc3,pout=sh(f"ps -o pid=,ppid=,user=,etime=,comm=,args= -p {ppid}")
                  pout=re.sub(r'((?:api[-_]?key|token|secret|password)(?:=|\s+))\S+',r'\1<redacted>',pout,flags=re.I)
                  rows[-1]["parent"]=pout.strip()[:5000]

          rc_u,units=sh("systemctl --user list-units --type=service --all --no-pager")
          rel=[x for x in units.splitlines() if re.search(r'qwen|vllm|18793|gemma|tunnel|b200',x,re.I)]
          rc_f,files=sh("systemctl --user list-unit-files --type=service --no-pager")
          relf=[x for x in files.splitlines() if re.search(r'qwen|vllm|18793|gemma|tunnel|b200',x,re.I)]

          data={"ss":ss[:6000],"processes":rows,"userUnits":rel[:100],"userUnitFiles":relf[:100]}
          dest=Path("/tmp/lucy-18793-process-20260924.json")
          dest.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
          dest.chmod(0o644)
          print("LUCY_18793_PROCESS_WRITTEN")
          HOSTPY'''
          prompt=("AUTHORIZED READ-ONLY LOCAL DIAGNOSTIC. Execute the script below verbatim once with the terminal tool. "
                  "It only identifies the local process bound to 127.0.0.1:18793 and matching user services. "
                  "Do not change state or reveal secrets. After success reply exactly LUCY_18793_PROCESS_WRITTEN.\n\n"+script)
          payload=json.dumps({"model":"hermes-agent","messages":[{"role":"user","content":prompt}],"stream":False}).encode()
          req=urllib.request.Request("http://172.17.0.1:8642/v1/chat/completions",data=payload,headers={
            "Authorization":"Bearer "+os.environ["HERMES_API_KEY"],"Content-Type":"application/json","User-Agent":"Lucy-CDL-18793-process"},method="POST")
          with urllib.request.urlopen(req,timeout=100) as r: raw=json.load(r)
          ans=raw.get("choices",[{}])[0].get("message",{}).get("content","")
          if "LUCY_18793_PROCESS_WRITTEN" not in ans: raise SystemExit("Hermes did not confirm process file")
          PY
          [[ -r "$OUT" ]] || { echo "process evidence missing"; exit 1; }
          cat "$OUT"
