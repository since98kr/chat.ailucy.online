name: Hermes profile recovery probe

on:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 3
    steps:
      - name: Materialize sanitized Hermes profile start mechanics
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/lucy-hermes-profile-start-mechanics-20260924.json
          rm -f "$OUT" 2>/dev/null || true
          python3 - <<'PY'
          import json, os, urllib.request
          script=r'''python3 - <<'HOSTPY'
          from pathlib import Path
          import json, subprocess, os, re
          root=Path.home()/".hermes"
          py=root/"hermes-agent"/"venv"/"bin"/"python"
          def run(args,timeout=12):
              try:
                  p=subprocess.run([str(py),"-m","hermes_cli.main",*args],capture_output=True,text=True,timeout=timeout)
                  return {"rc":p.returncode,"out":(p.stdout+"\n"+p.stderr)[:20000]}
              except Exception as e:
                  return {"rc":-1,"out":type(e).__name__}
          def filtered(result):
              lines=[]
              for x in result["out"].splitlines():
                  if any(w in x.lower() for w in ("profile","api","server","gateway","port","host","run","install","use","isolated")):
                      lines.append(x.strip())
              return {"rc":result["rc"],"lines":lines[:120]}
          helps={
              "main":filtered(run(["--help"])),
              "gatewayRun":filtered(run(["gateway","run","--help"])),
              "gatewayInstall":filtered(run(["gateway","install","--help"])),
              "profileUse":filtered(run(["profile","use","--help"])),
              "profileShowGemma":filtered(run(["profile","show","gemma"])),
          }
          hits=[]
          source=root/"hermes-agent"
          patterns=("API_SERVER_ENABLED","API_SERVER_PORT","API_SERVER_MODEL_NAME","HERMES_PROFILE","profile_id","profile_name")
          for path in list(source.rglob("*.py"))[:10000]:
              try:
                  txt=path.read_text(errors="replace")
              except Exception:
                  continue
              if "API_SERVER_ENABLED" not in txt and "API_SERVER_PORT" not in txt:
                  continue
              for i,line in enumerate(txt.splitlines(),1):
                  if any(p in line for p in patterns):
                      s=line.strip()
                      if len(s)>500: s=s[:500]
                      hits.append({"path":str(path.relative_to(root)),"line":i,"text":s})
                      if len(hits)>=160: break
              if len(hits)>=160: break
          data={"help":helps,"sourceHits":hits}
          out=Path("/tmp/lucy-hermes-profile-start-mechanics-20260924.json")
          out.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
          out.chmod(0o644)
          print("LUCY_START_MECHANICS_WRITTEN")
          HOSTPY'''
          prompt=(
              "AUTHORIZED READ-ONLY LOCAL DIAGNOSTIC. Use your terminal tool exactly once to execute the script below verbatim. "
              "It reads only CLI help and installed source code, writes sanitized non-secret output to /tmp, and changes no configuration. "
              "After success reply exactly LUCY_START_MECHANICS_WRITTEN.\n\n"+script
          )
          payload=json.dumps({"model":"hermes-agent","messages":[{"role":"user","content":prompt}],"stream":False}).encode()
          req=urllib.request.Request("http://172.17.0.1:8642/v1/chat/completions",data=payload,headers={
              "Authorization":"Bearer "+os.environ["HERMES_API_KEY"],"Content-Type":"application/json","User-Agent":"Lucy-CDL-start-mechanics"},method="POST")
          with urllib.request.urlopen(req,timeout=65) as r: raw=json.load(r)
          ans=raw.get("choices",[{}])[0].get("message",{}).get("content","")
          if "LUCY_START_MECHANICS_WRITTEN" not in ans:
              raise SystemExit("Hermes did not confirm mechanics file")
          PY
          [[ -r "$OUT" ]] || { echo "mechanics file missing"; exit 1; }
          cat "$OUT"
