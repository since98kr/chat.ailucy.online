name: Probe Hermes profile recovery

on:
  workflow_dispatch:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 3
    steps:
      - name: Inspect Qwen backend tunnel and listener read-only
        shell: bash
        run: |
          set -euo pipefail
          echo '=== 18793 listener ==='
          ss -ltnp 2>/dev/null | awk 'NR==1 || /:18793[[:space:]]/' || true

          echo '=== process candidates ==='
          ps -eo pid=,ppid=,user=,etime=,comm=,args=             | grep -E '[1]8793|[q]wen3\.5|[v]llm|[s]sh .*18793|[c]loudflared.*18793'             | sed -E 's/(Bearer|token|key|secret|password)([ =:]+)[^ ]+/\1\2<redacted>/Ig'             | head -120 || true

          echo '=== related services ==='
          systemctl list-units --type=service --all --no-pager 2>/dev/null             | grep -Ei 'qwen|vllm|b200|18793|tunnel|ssh' | head -80 || true
          systemctl --user list-units --type=service --all --no-pager 2>/dev/null             | grep -Ei 'qwen|vllm|b200|18793|tunnel|ssh' | head -80 || true

          echo '=== backend unauthenticated models probe ==='
          python3 - <<'PY'
          import urllib.request,urllib.error
          url='http://127.0.0.1:18793/v1/models'
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Lucy-CDL-readonly'}),timeout=5) as r:
                  print('HTTP',r.status)
                  print(r.read(2000).decode('utf-8','replace'))
          except urllib.error.HTTPError as e:
              print('HTTP',e.code)
              print(e.read(1000).decode('utf-8','replace'))
          except Exception as e:
              print(type(e).__name__,str(e))
          PY
