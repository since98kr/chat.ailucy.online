name: Probe Hermes profile recovery

on:
  workflow_dispatch:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-staging-disk-recovery
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    timeout-minutes: 6
    steps:
      - name: Reclaim unused Docker build cache only
        shell: bash
        run: |
          set -euo pipefail
          echo '=== before ==='
          df -B1 / | tail -1
          docker system df || true

          docker builder prune --force

          echo '=== after ==='
          df -B1 / | tail -1
          docker system df || true

          free_bytes=$(df -B1 --output=avail / | tail -1 | tr -d ' ')
          min_bytes=$((2147483648))
          echo "free_bytes=$free_bytes minimum=$min_bytes"
          if (( free_bytes < min_bytes )); then
            echo "Insufficient space remains after build-cache prune." >&2
            exit 2
          fi
