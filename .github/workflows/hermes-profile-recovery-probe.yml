name: Probe Hermes profile recovery

on:
  workflow_dispatch:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Inspect Gemma backend listener and model surface read-only
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/lucy-gemma-backend-18793-20260924.json
          rm -f "$OUT" 2>/dev/null || true
          python3 - <<'PY'
          import json,os,urllib.request
          script=r'''python3 - <<'HOSTPY'
          from pathlib import Path
          import json, subprocess, urllib.request, urllib.error, os, re

          def sh(args,timeout=12):
              try:
                  p=subprocess.run(args,capture_output=True,text=True,timeout=timeout)
                  return {"rc":p.returncode,"out":(p.stdout+"\n"+p.stderr)[:16000]}
              except Exception as e:
                  return {"rc":-1,"out":type(e).__name__}

          listener=sh(["sh","-lc","ss -ltnp 2>/dev/null | grep ':18793 ' || true"])
          proc=sh(["sh","-lc","pid=$(ss -ltnp 2>/dev/null | sed -n 's/.*:18793 .*pid=\\([0-9][0-9]*\\).*/\\1/p' | head -1); if [ -n \"$pid\" ]; then ps -o pid=,ppid=,user=,comm=,args= -p \"$pid\"; readlink /proc/\"$pid\"/exe 2>/dev/null || true; readlink /proc/\"$pid\"/cwd 2>/dev/null || true; fi"])

          urls=["http://127.0.0.1:18793/v1/models","http://127.0.0.1:18793/health","http://127.0.0.1:18793/version"]
          http=[]
          for url in urls:
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Lucy-CDL-readonly"})
                  with urllib.request.urlopen(req,timeout=6) as r:
                      body=r.read(12000).decode("utf-8","replace")
                  # redact obvious token/key fields if any
                  body=re.sub(r'(?i)(api[_-]?key|token|secret|password)\s*[:=]\s*["\\\']?[^,}"\\\'\s]+',r'\\1=<redacted>',body)
                  http.append({"url":url,"status":r.status,"body":body[:12000]})
              except urllib.error.HTTPError as e:
                  body=e.read(4000).decode("utf-8","replace")
                  http.append({"url":url,"status":e.code,"body":body[:4000]})
              except Exception as e:
                  http.append({"url":url,"status":None,"error":type(e).__name__})

          # Search shell/systemd/user config for literal 18793 references, filenames + sanitized matching lines only.
          hits=[]
          roots=[Path.home()/".config",Path.home()/".hermes",Path.home()/".local"]
          for root in roots:
              if not root.exists(): continue
              for p in root.rglob("*"):
                  if not p.is_file() or p.stat().st_size>2_000_000: continue
                  try: txt=p.read_text(errors="replace")
                  except: continue
                  if "18793" not in txt: continue
                  for i,line in enumerate(txt.splitlines(),1):
                      if "18793" in line:
                          s=line.strip()
                          if re.search(r'(key|token|secret|password)',s,re.I):
                              s="<redacted-secret-line>"
                          hits.append({"path":str(p),"line":i,"text":s[:800]})
                          if len(hits)>=120: break
                  if len(hits)>=120: break
              if len(hits)>=120: break

          out={"listener":listener,"process":proc,"http":http,"references":hits}
          dest=Path("/tmp/lucy-gemma-backend-18793-20260924.json")
          dest.write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          dest.chmod(0o644)
          print("LUCY_GEMMA_BACKEND_18793_WRITTEN")
          HOSTPY'''
          prompt=("AUTHORIZED READ-ONLY LOCAL DIAGNOSTIC. Execute the script below verbatim once with the terminal tool. "
                  "It inspects only the local 18793 listener/process, non-secret model endpoints, and config references; it changes nothing. "
                  "After success reply exactly LUCY_GEMMA_BACKEND_18793_WRITTEN.\n\n"+script)
          payload=json.dumps({"model":"hermes-agent","messages":[{"role":"user","content":prompt}],"stream":False}).encode()
          req=urllib.request.Request("http://172.17.0.1:8642/v1/chat/completions",data=payload,headers={
            "Authorization":"Bearer "+os.environ["HERMES_API_KEY"],"Content-Type":"application/json","User-Agent":"Lucy-CDL-gemma-backend"},method="POST")
          with urllib.request.urlopen(req,timeout=100) as r: raw=json.load(r)
          ans=raw.get("choices",[{}])[0].get("message",{}).get("content","")
          if "LUCY_GEMMA_BACKEND_18793_WRITTEN" not in ans: raise SystemExit("Hermes did not confirm backend inspection")
          PY
          [[ -r "$OUT" ]] || { echo "backend inspection evidence missing"; exit 1; }
          cat "$OUT"
