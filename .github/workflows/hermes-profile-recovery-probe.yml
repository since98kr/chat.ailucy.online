name: Probe Hermes profile recovery

on:
  workflow_dispatch:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 3
    steps:
      - name: Recover current Gemma backend evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/lucy-gemma-current-backend-20260924.json
          [[ -r "$OUT" ]] || { echo "evidence missing"; exit 2; }
          cat "$OUT"
