name: Hermes profile recovery probe

on:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 4
    steps:
      - name: Probe default Hermes multiplexer models
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          base="http://172.17.0.1:8642"
          headers={"Authorization":"Bearer "+os.environ["HERMES_API_KEY"],"User-Agent":"Lucy-CDL-multiplexer-probe"}
          req=urllib.request.Request(base+"/v1/models",headers=headers)
          with urllib.request.urlopen(req,timeout=15) as r:
              obj=json.load(r)
          ids=[]
          for item in obj.get("data",[]):
              mid=item.get("id")
              if isinstance(mid,str): ids.append(mid)
          print("MODELS="+json.dumps(sorted(ids),ensure_ascii=False))
          for model in ["hermes-agent","gemma","lynn","xixi"]:
              payload=json.dumps({"model":model,"messages":[{"role":"user","content":"Reply with exactly READY"}],"stream":False}).encode()
              rq=urllib.request.Request(base+"/v1/chat/completions",data=payload,headers={**headers,"Content-Type":"application/json"},method="POST")
              try:
                  with urllib.request.urlopen(rq,timeout=45) as r:
                      body=json.load(r)
                  text=((body.get("choices") or [{}])[0].get("message") or {}).get("content","")
                  print(json.dumps({"model":model,"http":200,"ok":bool(text.strip()),"text":text.strip()[:120]},ensure_ascii=False))
              except urllib.error.HTTPError as e:
                  raw=e.read(1200).decode("utf-8","replace")
                  print(json.dumps({"model":model,"http":e.code,"ok":False,"error":raw[:500]},ensure_ascii=False))
              except Exception as e:
                  print(json.dumps({"model":model,"http":0,"ok":False,"error":type(e).__name__+":"+str(e)[:300]},ensure_ascii=False))
          PY
