name: Probe Hermes profile recovery

on:
  workflow_dispatch:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 3
    steps:
      - name: Probe current Gemma image acceptance
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          png="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z9U8AAAAASUVORK5CYII="
          payload={
            "model":"gemma",
            "messages":[{"role":"user","content":[
              {"type":"text","text":"Reply with READY."},
              {"type":"image_url","image_url":{"url":"data:image/png;base64,"+png}}
            ]}],
            "max_tokens":16
          }
          req=urllib.request.Request(
            "http://172.17.0.1:8643/v1/chat/completions",
            data=json.dumps(payload).encode(),
            headers={
              "Content-Type":"application/json",
              "Authorization":"Bearer "+os.environ["HERMES_API_KEY"],
              "User-Agent":"Lucy-CDL-gemma-image-canary"
            },
            method="POST"
          )
          try:
              with urllib.request.urlopen(req,timeout=90) as r:
                  body=r.read(4000).decode("utf-8","replace")
              print(json.dumps({"http":r.status,"imageAccepted":r.status==200,"bodyPrefix":body[:800]},ensure_ascii=False))
              raise SystemExit(0 if r.status==200 else 2)
          except urllib.error.HTTPError as e:
              body=e.read(4000).decode("utf-8","replace")
              print(json.dumps({"http":e.code,"imageAccepted":False,"bodyPrefix":body[:1200]},ensure_ascii=False))
              raise SystemExit(3)
          except Exception as e:
              print(json.dumps({"http":None,"imageAccepted":False,"error":type(e).__name__+":"+str(e)},ensure_ascii=False))
              raise SystemExit(4)
          PY
