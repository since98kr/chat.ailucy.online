name: Probe Hermes profile recovery

on:
  workflow_dispatch:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 4
    steps:
      - name: Snapshot current Gemma state
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/lucy-gemma-current-state-20260924.json
          rm -f "$OUT" 2>/dev/null || true
          python3 - <<'PY'
          import json,os,urllib.request
          script=r'''python3 - <<'HOSTPY'
          from pathlib import Path
          import json,yaml,subprocess
          root=Path.home()/".hermes"
          p=root/"profiles"/"gemma"/"config.yaml"
          obj=yaml.safe_load(p.read_text()) or {}
          model=obj.get("model") or {}
          pts=obj.get("platform_toolsets") or {}
          agent=obj.get("agent") or {}
          py=root/"hermes-agent"/"venv"/"bin"/"python"
          s=subprocess.run([str(py),"-m","hermes_cli.main","profile","show","gemma"],capture_output=True,text=True,timeout=15)
          ev=Path("/tmp/lucy-gemma-no-tools-restart-20260924.json")
          out={
            "defaultModel":model.get("default"),
            "supportsVision":model.get("supports_vision"),
            "contextLength":model.get("context_length"),
            "cliToolsets":pts.get("cli"),
            "toolUseEnforcement":agent.get("tool_use_enforcement"),
            "gatewayRunning":"Gateway: running" in s.stdout,
            "successEvidenceExists":ev.is_file()
          }
          Path("/tmp/lucy-gemma-current-state-20260924.json").write_text(json.dumps(out,sort_keys=True)+"\n")
          Path("/tmp/lucy-gemma-current-state-20260924.json").chmod(0o644)
          print("LUCY_GEMMA_STATE_OK")
          HOSTPY'''
          prompt=("AUTHORIZED READ-ONLY CHECK. Execute the script below verbatim once. It reads only sanitized Gemma runtime/config state, "
                  "writes /tmp evidence, and changes nothing. After success reply exactly LUCY_GEMMA_STATE_OK.\n\n"+script)
          payload=json.dumps({"model":"hermes-agent","messages":[{"role":"user","content":prompt}],"stream":False}).encode()
          req=urllib.request.Request("http://172.17.0.1:8642/v1/chat/completions",data=payload,headers={
            "Authorization":"Bearer "+os.environ["HERMES_API_KEY"],"Content-Type":"application/json","User-Agent":"Lucy-CDL-gemma-state-short"},method="POST")
          with urllib.request.urlopen(req,timeout=70) as r: raw=json.load(r)
          ans=raw.get("choices",[{}])[0].get("message",{}).get("content","")
          if "LUCY_GEMMA_STATE_OK" not in ans: raise SystemExit("Hermes did not confirm state snapshot")
          PY
          cat "$OUT"

      - name: Direct Gemma image canary
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          png="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z9U8AAAAASUVORK5CYII="
          payload={"model":"gemma","messages":[{"role":"user","content":[
            {"type":"text","text":"Reply with READY after processing this attached image."},
            {"type":"image_url","image_url":{"url":"data:image/png;base64,"+png}}
          ]}],"max_tokens":32}
          req=urllib.request.Request("http://172.17.0.1:8643/v1/chat/completions",data=json.dumps(payload).encode(),
            headers={"Content-Type":"application/json","Authorization":"Bearer "+os.environ["HERMES_API_KEY"],"User-Agent":"Lucy-CDL-gemma-direct-state"},method="POST")
          try:
            with urllib.request.urlopen(req,timeout=90) as r: body=json.load(r)
            h=body.get("hermes") or {}
            msg=((body.get("choices") or [{}])[0].get("message") or {}).get("content","")
            passed=(r.status==200 and h.get("completed") is True and not h.get("failed"))
            print(json.dumps({"http":r.status,"completed":h.get("completed"),"failed":h.get("failed"),"contentPrefix":str(msg)[:300],"passed":passed},ensure_ascii=False))
            raise SystemExit(0 if passed else 2)
          except urllib.error.HTTPError as e:
            body=e.read(1200).decode("utf-8","replace")
            print(json.dumps({"http":e.code,"completed":False,"failed":True,"errorPrefix":body},ensure_ascii=False))
            raise SystemExit(3)
          PY
