name: Probe Hermes profile recovery

on:
  workflow_dispatch:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Inspect remote Qwen serving process read-only
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/lucy-qwen-remote-serving-20260924.txt
          rm -f "$OUT" 2>/dev/null || true
          python3 - <<'PY'
          import json,os,urllib.request
          script=r'''python3 - <<'HOSTPY'
          from pathlib import Path
          import subprocess,re
          home=Path.home()
          remote_script=r"""
          set +e
          echo '=== hostname ==='
          hostname
          echo '=== 8080 listener ==='
          ss -ltnp 2>/dev/null | awk 'NR==1 || /:8080[[:space:]]/'
          echo '=== serving processes ==='
          ps -eo pid=,ppid=,user=,etime=,comm=,args= | grep -E '[v]llm|[q]wen3[._-]?5|[a]pi_server|[o]penai.*server' | head -120
          echo '=== relevant services ==='
          systemctl list-units --type=service --all --no-pager 2>/dev/null | grep -Ei 'vllm|qwen|llm' | head -80
          echo '=== containers ==='
          docker ps --format '{{.ID}} {{.Image}} {{.Names}} {{.Status}} {{.Ports}}' 2>/dev/null | grep -Ei 'vllm|qwen|8080' | head -80
          """
          proxy=f"ssh -i {home}/.ssh/hni-gpu-tunnel.key -p 44703 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null hni-gpu-tunnel@59.14.42.208 -W %h:%p"
          cmd=[
            "ssh","-o","ConnectTimeout=15","-o","ServerAliveInterval=30","-o","ServerAliveCountMax=3",
            "-o","StrictHostKeyChecking=no","-o","UserKnownHostsFile=/dev/null",
            "-i",str(home/".ssh"/"kgeo-2026-dev2_key"),
            "-o","ProxyCommand="+proxy,
            "kgeo_01@59.150.32.1","bash","-s"
          ]
          p=subprocess.run(cmd,input=remote_script,capture_output=True,text=True,timeout=45)
          text=(p.stdout+"\n"+p.stderr)
          # Redact command-line credentials if any.
          text=re.sub(r'(?i)(--api-key(?:=|\s+))\S+',r'\1<redacted>',text)
          text=re.sub(r'(?i)((?:token|secret|password|api_key)(?:=|\s+))\S+',r'\1<redacted>',text)
          out=Path("/tmp/lucy-qwen-remote-serving-20260924.txt")
          out.write_text(f"ssh_rc={p.returncode}\n"+text[:30000])
          out.chmod(0o644)
          HOSTPY'''
          prompt=("AUTHORIZED READ-ONLY GPU BACKEND DIAGNOSTIC. Use the terminal tool exactly once to execute the following script verbatim. "
                  "It performs only read-only SSH inspection of the existing Qwen backend and redacts command-line credentials. "
                  "Do not restart, stop, edit, install, or modify anything.\n\n"+script)
          payload=json.dumps({"model":"hermes-agent","messages":[{"role":"user","content":prompt}],"stream":False}).encode()
          req=urllib.request.Request("http://172.17.0.1:8642/v1/chat/completions",data=payload,headers={
            "Authorization":"Bearer "+os.environ["HERMES_API_KEY"],"Content-Type":"application/json","User-Agent":"Lucy-CDL-qwen-remote-inspect"},method="POST")
          with urllib.request.urlopen(req,timeout=120) as r:
              r.read()
          PY
          [[ -r "$OUT" ]] || { echo "remote serving evidence missing"; exit 1; }
          cat "$OUT"
