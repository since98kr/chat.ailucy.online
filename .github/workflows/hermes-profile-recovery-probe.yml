name: Probe Hermes profile recovery

on:
  workflow_dispatch:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 6
    steps:
      - name: Inspect B200 vLLM 8080 runtime read-only
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/lucy-b200-vllm-8080-20260924.json
          rm -f "$OUT" 2>/dev/null || true
          python3 - <<'PY'
          import json,os,urllib.request
          script=r'''python3 - <<'HOSTPY'
          from pathlib import Path
          import json,re,subprocess

          ssh=[
            "ssh","-o","BatchMode=yes","-o","ConnectTimeout=12",
            "-o","StrictHostKeyChecking=no","-o","UserKnownHostsFile=/dev/null",
            "-i",str(Path.home()/".ssh"/"kgeo-2026-dev2_key"),
            "-o",f"ProxyCommand=ssh -i {Path.home()}/.ssh/hni-gpu-tunnel.key -p 3006 -W %h:%p -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null hni-gpu-tunnel@59.14.42.208",
            "-p","44703","kgeo_01@59.150.32.1"
          ]

          remote=r"""set +e
          echo '=== identity ==='
          id
          hostname
          echo '=== listener 8080 ==='
          ss -ltnp 'sport = :8080' 2>/dev/null || true
          echo '=== process tree ==='
          for pid in $(ss -ltnp 'sport = :8080' 2>/dev/null | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | sort -u); do
            ps -o pid=,ppid=,user=,etime=,comm=,args= -p "$pid"
            ppid=$(ps -o ppid= -p "$pid" | tr -d ' ')
            [ -n "$ppid" ] && ps -o pid=,ppid=,user=,etime=,comm=,args= -p "$ppid"
          done
          echo '=== user services ==='
          systemctl --user list-units --type=service --all --no-pager 2>/dev/null | grep -Ei 'vllm|qwen|8080|model|router' || true
          systemctl --user list-unit-files --type=service --no-pager 2>/dev/null | grep -Ei 'vllm|qwen|8080|model|router' || true
          echo '=== system services ==='
          systemctl list-units --type=service --all --no-pager 2>/dev/null | grep -Ei 'vllm|qwen|8080|model|router' || true
          systemctl list-unit-files --type=service --no-pager 2>/dev/null | grep -Ei 'vllm|qwen|8080|model|router' || true
          echo '=== containers ==='
          docker ps --format '{{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Ports}}\t{{.Command}}' 2>/dev/null | grep -Ei 'vllm|qwen|8080|model|router' || true
          podman ps --format '{{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Ports}}\t{{.Command}}' 2>/dev/null | grep -Ei 'vllm|qwen|8080|model|router' || true
          echo '=== api ==='
          python3 - <<'R'
import urllib.request,urllib.error
for path in ['/version','/health']:
  try:
    with urllib.request.urlopen('http://127.0.0.1:8080'+path,timeout=5) as r:
      print(path,r.status,r.read(1000).decode('utf-8','replace'))
  except Exception as e: print(path,type(e).__name__,str(e))
R
          """
          p=subprocess.run(ssh+[remote],capture_output=True,text=True,timeout=60)
          text=(p.stdout+"\n"+p.stderr)
          text=re.sub(r'((?:api[-_]?key|token|secret|password)(?:=|\s+))\S+',r'\1<redacted>',text,flags=re.I)
          text=re.sub(r'(-i\s+)\S+',r'\1<redacted-path>',text)
          data={"rc":p.returncode,"output":text[:40000]}
          dest=Path("/tmp/lucy-b200-vllm-8080-20260924.json")
          dest.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
          dest.chmod(0o644)
          print("LUCY_B200_8080_WRITTEN")
          HOSTPY'''
          prompt=("AUTHORIZED READ-ONLY B200 DIAGNOSTIC. Execute the script below verbatim once with the terminal tool. "
                  "It uses the already-configured SSH route to inspect only the remote 127.0.0.1:8080 vLLM listener/process/service/container metadata. "
                  "Do not change, restart, stop, or create anything. Do not reveal key contents or secrets. "
                  "After success reply exactly LUCY_B200_8080_WRITTEN.\n\n"+script)
          payload=json.dumps({"model":"hermes-agent","messages":[{"role":"user","content":prompt}],"stream":False}).encode()
          req=urllib.request.Request("http://172.17.0.1:8642/v1/chat/completions",data=payload,headers={
            "Authorization":"Bearer "+os.environ["HERMES_API_KEY"],"Content-Type":"application/json","User-Agent":"Lucy-CDL-b200-vllm"},method="POST")
          with urllib.request.urlopen(req,timeout=120) as r: raw=json.load(r)
          ans=raw.get("choices",[{}])[0].get("message",{}).get("content","")
          if "LUCY_B200_8080_WRITTEN" not in ans: raise SystemExit("Hermes did not confirm B200 probe")
          PY
          [[ -r "$OUT" ]] || { echo "B200 evidence missing"; exit 1; }
          cat "$OUT"
