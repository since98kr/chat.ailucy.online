name: Probe Hermes profile recovery

on:
  workflow_dispatch:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 3
    steps:
      - name: Current Gemma direct image canary
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          png="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z9U8AAAAASUVORK5CYII="
          payload={"model":"gemma","messages":[{"role":"user","content":[
            {"type":"text","text":"Reply with READY after processing this attached image."},
            {"type":"image_url","image_url":{"url":"data:image/png;base64,"+png}}
          ]}],"max_tokens":32}
          req=urllib.request.Request("http://172.17.0.1:8643/v1/chat/completions",data=json.dumps(payload).encode(),
            headers={"Authorization":"Bearer "+os.environ["HERMES_API_KEY"],"Content-Type":"application/json","User-Agent":"Lucy-CDL-gemma-current-canary"},method="POST")
          try:
            with urllib.request.urlopen(req,timeout=90) as r: body=json.load(r)
          except urllib.error.HTTPError as e:
            raw=e.read(1500).decode("utf-8","replace")
            print(json.dumps({"http":e.code,"passed":False,"errorPrefix":raw},ensure_ascii=False))
            raise
          msg=str(((body.get("choices") or [{}])[0].get("message") or {}).get("content",""))
          passed=(r.status==200 and "READY" in msg.upper() and "HTTP 400" not in msg.upper())
          print(json.dumps({"http":r.status,"contentPrefix":msg[:300],"passed":passed},ensure_ascii=False))
          if not passed: raise SystemExit(2)
          PY
