name: Hermes profile recovery probe

on:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 3
    steps:
      - name: Read Gemma profile metadata via default Hermes
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          prompt = (
            "AUTHORIZED READ-ONLY LOCAL PROBE. Use one terminal command only. "
            "Inspect $HOME/.hermes/profiles/gemma/.env. Never print credential values. "
            "Return exactly JSON with exists plus strings API_SERVER_ENABLED, API_SERVER_HOST, API_SERVER_PORT, API_SERVER_MODEL_NAME, PROVIDER, MODEL, LLM_PROVIDER, LLM_MODEL, "
            "and credentialSet booleans for API_SERVER_KEY, OPENROUTER_API_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY, DEEPSEEK_API_KEY, LLM_API_KEY. "
            "Do not inspect anything else."
          )
          payload=json.dumps({"model":"hermes-agent","messages":[{"role":"user","content":prompt}],"stream":False}).encode()
          req=urllib.request.Request("http://172.17.0.1:8642/v1/chat/completions",data=payload,headers={
            "Authorization":"Bearer "+os.environ["HERMES_API_KEY"],"Content-Type":"application/json","User-Agent":"Lucy-CDL-gemma-probe"},method="POST")
          with urllib.request.urlopen(req,timeout=60) as r: raw=json.load(r)
          ans=raw.get("choices",[{}])[0].get("message",{}).get("content","")
          a=ans.find("{"); b=ans.rfind("}")
          if a<0 or b<a: raise SystemExit("no JSON")
          obj=json.loads(ans[a:b+1])
          allowed=["API_SERVER_ENABLED","API_SERVER_HOST","API_SERVER_PORT","API_SERVER_MODEL_NAME","PROVIDER","MODEL","LLM_PROVIDER","LLM_MODEL"]
          safe={"exists":bool(obj.get("exists",False))}
          for k in allowed: safe[k]=str(obj.get(k,""))[:200]
          creds=obj.get("credentialSet") or {}
          safe["credentialSet"]={k:bool(creds.get(k,False)) for k in ["API_SERVER_KEY","OPENROUTER_API_KEY","ANTHROPIC_API_KEY","OPENAI_API_KEY","DEEPSEEK_API_KEY","LLM_API_KEY"]}
          print(json.dumps(safe,ensure_ascii=False,sort_keys=True))
          PY
