name: Probe Hermes profile recovery

on:
  workflow_dispatch:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Inspect B200 router vision path and model listeners
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/lucy-b200-router-vision-20260924.json
          rm -f "$OUT" 2>/dev/null || true
          python3 - <<'PY'
          import json,os,urllib.request
          script=r'''python3 - <<'HOSTPY'
          from pathlib import Path
          import json, subprocess, re

          proxy="ssh -i /home/since98kr/.ssh/hni-gpu-tunnel.key -p 3006 -W %h:%p -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null hni-gpu-tunnel@59.14.42.208"
          base=[
              "ssh","-i","/home/since98kr/.ssh/kgeo-2026-dev2_key",
              "-o","StrictHostKeyChecking=no",
              "-o","UserKnownHostsFile=/dev/null",
              "-o","ProxyCommand="+proxy,
              "-p","44703","kgeo_01@59.150.32.1"
          ]
          remote="\n".join([
              "set -e",
              "cd /NHNHOME/WORKSPACE/26molit001_KGEO/gis-llm",
              "echo '=== router vision/model references ==='",
              "python3 - <<'PYR'",
              "from pathlib import Path",
              "import re",
              "p=Path('model_router.py')",
              "lines=p.read_text(errors='replace').splitlines()",
              "pat=re.compile(r'image|vision|multimodal|qwen|kimi|8001|8004|limit[_-]?mm|max[_-]?image|model',re.I)",
              "secret=re.compile(r'key|token|secret|password|authorization',re.I)",
              "for i,line in enumerate(lines,1):",
              "    if pat.search(line):",
              "        text='<redacted-secret-line>' if secret.search(line) else line.strip()[:900]",
              "        print(f'{i}: {text}')",
              "PYR",
              "echo '=== listeners 8001/8004 ==='",
              "ss -ltnp 2>/dev/null | grep -E ':(8001|8004) ' || true",
              "echo '=== listener process args ==='",
              "for port in 8001 8004; do pid=$(ss -ltnp 2>/dev/null | sed -n \"s/.*:$port .*pid=\\([0-9][0-9]*\\).*/\\1/p\" | head -1); if [ -n \"$pid\" ]; then echo PORT=$port PID=$pid; ps -o pid=,ppid=,user=,comm=,args= -p \"$pid\"; fi; done",
              "echo '=== local model surfaces ==='",
              "for port in 8001 8004; do echo PORT=$port; curl -fsS --max-time 5 http://127.0.0.1:$port/version || true; echo; curl -fsS --max-time 5 http://127.0.0.1:$port/v1/models 2>/dev/null | head -c 5000 || true; echo; done"
          ])
          p=subprocess.run(base+[remote],capture_output=True,text=True,timeout=40)
          out=(p.stdout+"\n"+p.stderr)
          out=re.sub(r'(?i)(--api-key|api[_-]?key|token|secret|password|authorization)(?:=|\s+)\S+',r'\1 <redacted>',out)
          dest=Path("/tmp/lucy-b200-router-vision-20260924.json")
          dest.write_text(json.dumps({"rc":p.returncode,"output":out[:32000]},ensure_ascii=False,indent=2)+"\n")
          dest.chmod(0o644)
          print("LUCY_B200_ROUTER_VISION_WRITTEN")
          HOSTPY'''
          prompt=("AUTHORIZED READ-ONLY INFRA DIAGNOSTIC. Execute this script verbatim once with the terminal tool. "
                  "It uses the existing B200 SSH path to inspect only model_router.py vision/model references, ports 8001/8004, "
                  "process arguments, and local model metadata; no mutation. Do not expose secret values. "
                  "After success reply exactly LUCY_B200_ROUTER_VISION_WRITTEN.\n\n"+script)
          payload=json.dumps({"model":"hermes-agent","messages":[{"role":"user","content":prompt}],"stream":False}).encode()
          req=urllib.request.Request("http://172.17.0.1:8642/v1/chat/completions",data=payload,headers={
              "Authorization":"Bearer "+os.environ["HERMES_API_KEY"],
              "Content-Type":"application/json",
              "User-Agent":"Lucy-CDL-b200-router-vision"
          },method="POST")
          with urllib.request.urlopen(req,timeout=100) as r:
              raw=json.load(r)
          ans=raw.get("choices",[{}])[0].get("message",{}).get("content","")
          if "LUCY_B200_ROUTER_VISION_WRITTEN" not in ans:
              raise SystemExit("Hermes did not confirm B200 router inspection")
          PY
          [[ -r "$OUT" ]] || { echo "B200 router evidence missing"; exit 1; }
          cat "$OUT"
