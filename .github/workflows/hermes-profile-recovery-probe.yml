name: Probe Hermes profile recovery

on:
  workflow_dispatch:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 4
    steps:
      - name: Inspect Gemma upstream inference server safely
        shell: bash
        run: |
          set -euo pipefail
          echo '=== listener 18793 ==='
          ss -ltnp 2>/dev/null | awk 'NR==1 || /:18793[[:space:]]/' || true

          echo '=== process metadata ==='
          for pid in $(ss -ltnp 2>/dev/null | awk '/:18793[[:space:]]/ {match($0,/pid=([0-9]+)/,m); if(m[1]) print m[1]}' | sort -u); do
            ps -o pid=,ppid=,user=,etime=,comm=,args= -p "$pid" \
              | sed -E 's/((api[-_]?key|token|secret|password)(=|[[:space:]]+))[^[:space:]]+/\1<redacted>/Ig'
          done

          echo '=== matching service definitions ==='
          systemctl list-units --type=service --all --no-pager 2>/dev/null \
            | awk 'tolower($0) ~ /qwen|vllm|18793|gemma|tunnel/' || true
          systemctl list-unit-files --type=service --no-pager 2>/dev/null \
            | awk 'tolower($0) ~ /qwen|vllm|18793|gemma|tunnel/' || true

          echo '=== upstream API metadata ==='
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          for path in ['/version','/v1/models','/health']:
              url='http://127.0.0.1:18793'+path
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Lucy-CDL-upstream-readonly'})
                  with urllib.request.urlopen(req,timeout=8) as r:
                      raw=r.read(12000).decode('utf-8','replace')
                  print(f'--- {path} HTTP {r.status} ---')
                  print(raw[:12000])
              except urllib.error.HTTPError as e:
                  print(f'--- {path} HTTP {e.code} ---')
                  print(e.read(2000).decode('utf-8','replace'))
              except Exception as e:
                  print(f'--- {path} {type(e).__name__}: {e} ---')
          PY
