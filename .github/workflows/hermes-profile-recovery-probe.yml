name: Probe Hermes profile recovery

on:
  workflow_dispatch:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 4
    steps:
      - name: Inspect 18793 tunnel topology safely
        shell: bash
        run: |
          set -euo pipefail
          echo '=== 1879x listeners ==='
          ss -ltn 2>/dev/null | awk 'NR==1 || /:1879[0-9][[:space:]]/' || true

          echo '=== tunnel service state ==='
          systemctl --no-pager --full status letta-bridge-tunnel.service 2>&1 \
            | sed -E 's#(IdentityFile=| -i )[[:graph:]]+#\1<redacted-path>#Ig' \
            | sed -E 's#(UserKnownHostsFile=)[[:graph:]]+#\1<redacted-path>#Ig' \
            | sed -n '1,90p' || true

          echo '=== tunnel unit definition ==='
          systemctl cat letta-bridge-tunnel.service --no-pager 2>/dev/null \
            | sed -E 's#(IdentityFile=| -i )[[:graph:]]+#\1<redacted-path>#Ig' \
            | sed -E 's#(UserKnownHostsFile=)[[:graph:]]+#\1<redacted-path>#Ig' \
            | sed -E 's#([A-Za-z0-9_]*(KEY|TOKEN|SECRET|PASSWORD)[A-Za-z0-9_]*=)[^[:space:]]+#\1<redacted>#Ig' || true

          echo '=== all tunnel-ish units ==='
          systemctl list-units --type=service --all --no-pager 2>/dev/null \
            | awk 'tolower($0) ~ /tunnel|ssh|b200|vllm|qwen|letta/' || true
          systemctl list-unit-files --type=service --no-pager 2>/dev/null \
            | awk 'tolower($0) ~ /tunnel|ssh|b200|vllm|qwen|letta/' || true
