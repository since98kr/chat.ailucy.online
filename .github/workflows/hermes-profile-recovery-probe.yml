name: Probe Hermes profile recovery

on:
  workflow_dispatch:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 4
    steps:
      - name: Prove 8642 Hermes multiplexer personas
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          key=os.environ["HERMES_API_KEY"]
          rows=[]
          for model in ["hermes-agent","gemma","lynn","xixi"]:
              payload={
                "model":model,
                "messages":[{"role":"user","content":"Reply exactly READY."}],
                "max_tokens":16
              }
              req=urllib.request.Request(
                "http://172.17.0.1:8642/v1/chat/completions",
                data=json.dumps(payload).encode(),
                headers={
                  "Authorization":"Bearer "+key,
                  "Content-Type":"application/json",
                  "User-Agent":"Lucy-CDL-261-multiplexer-canary"
                },
                method="POST"
              )
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      body=json.load(r)
                  msg=str(((body.get("choices") or [{}])[0].get("message") or {}).get("content",""))
                  ok=(r.status==200 and "READY" in msg.upper())
                  rows.append({"model":model,"http":r.status,"ready":ok,"contentPrefix":msg[:160]})
                  if not ok:
                      raise SystemExit(f"{model} did not return READY")
              except urllib.error.HTTPError as e:
                  detail=e.read(1200).decode("utf-8","replace")
                  rows.append({"model":model,"http":e.code,"ready":False,"errorPrefix":detail})
                  print(json.dumps(rows,ensure_ascii=False))
                  raise
          print(json.dumps(rows,ensure_ascii=False,sort_keys=True))
          PY
