name: Probe Hermes profile recovery

on:
  workflow_dispatch:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 4
    steps:
      - name: Verify profile listeners and authenticated model endpoints
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          echo '=== listeners ==='
          ss -ltn 2>/dev/null | awk 'NR==1 || /:(8642|8643|8644|8645)[[:space:]]/' || true

          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          key=os.environ["HERMES_API_KEY"]
          for name,port,expected in [
              ("default",8642,"hermes-agent"),
              ("gemma",8643,"gemma"),
              ("lynn",8644,"lynn"),
              ("xixi",8645,"xixi"),
          ]:
              url=f"http://172.17.0.1:{port}/v1/models"
              req=urllib.request.Request(url,headers={"Authorization":"Bearer "+key,"User-Agent":"Lucy-CDL-profile-health"})
              try:
                  with urllib.request.urlopen(req,timeout=8) as r:
                      obj=json.load(r)
                  ids=[x.get("id") for x in obj.get("data",[]) if isinstance(x,dict)]
                  print(json.dumps({"profile":name,"port":port,"http":200,"models":ids,"expectedPresent":expected in ids},sort_keys=True))
              except urllib.error.HTTPError as e:
                  print(json.dumps({"profile":name,"port":port,"http":e.code,"error":"http"},sort_keys=True))
              except Exception as e:
                  print(json.dumps({"profile":name,"port":port,"http":None,"error":type(e).__name__},sort_keys=True))
          PY
