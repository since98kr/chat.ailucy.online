name: Probe Hermes profile recovery

on:
  workflow_dispatch:
  push:
    branches:
      - lucy/hermes-profile-diagnostics-20260923

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 3
    steps:
      - name: Direct Gemma native-image canary
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          key=os.environ["HERMES_API_KEY"]

          req=urllib.request.Request("http://172.17.0.1:8643/v1/models",headers={
              "Authorization":"Bearer "+key,
              "User-Agent":"Lucy-CDL-gemma-direct-canary"
          })
          with urllib.request.urlopen(req,timeout=8) as r:
              models=json.load(r)
          ids=[x.get("id") for x in models.get("data",[]) if isinstance(x,dict)]
          print(json.dumps({"modelsHttp":r.status,"models":ids},sort_keys=True))
          if r.status!=200 or "gemma" not in ids:
              raise SystemExit("Gemma model surface unhealthy")

          png_b64="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZP4sAAAAASUVORK5CYII="
          payload={
              "model":"gemma",
              "messages":[{
                  "role":"user",
                  "content":[
                      {"type":"text","text":"A tiny ordinary PNG is attached. Briefly acknowledge receiving an image payload."},
                      {"type":"image_url","image_url":{"url":"data:image/png;base64,"+png_b64}}
                  ]
              }],
              "stream":False
          }
          req=urllib.request.Request("http://172.17.0.1:8643/v1/chat/completions",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization":"Bearer "+key,
                  "Content-Type":"application/json",
                  "User-Agent":"Lucy-CDL-gemma-direct-canary"
              },
              method="POST")
          try:
              with urllib.request.urlopen(req,timeout=90) as r:
                  raw=r.read().decode("utf-8","replace")
                  status=r.status
          except urllib.error.HTTPError as e:
              raw=e.read().decode("utf-8","replace")
              status=e.code

          safe=raw[:4000]
          print(json.dumps({"imageHttp":status,"body":safe},ensure_ascii=False))
          if status!=200:
              raise SystemExit(f"Gemma native-image canary failed HTTP {status}")
          obj=json.loads(raw)
          content=obj.get("choices",[{}])[0].get("message",{}).get("content","")
          if not str(content).strip():
              raise SystemExit("Gemma native-image canary returned empty assistant content")
          print("GEMMA_NATIVE_IMAGE_CANARY_OK")
          PY
