name: Chat 199 federation identity guard worker

on:
  push:
    branches:
      - lucy/chat-199-federation-identity-guard-20260903

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lucy/chat-199-federation-identity-guard-20260903
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply federation identity guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64

          route = Path('server/federation-routes.ts')
          text = route.read_text()
          old = """    const conversation = database.getConversation(id);
    if (!conversation) return reply.status(404).send({ error: 'CONVERSATION_NOT_FOUND' });
    const coordinator = collaboration.getAgent(input.coordinatorAgentId);"""
          new = """    const conversation = database.getConversation(id);
    if (!conversation) return reply.status(404).send({ error: 'CONVERSATION_NOT_FOUND' });
    if (conversation.systemId !== 'hermes' || conversation.agentId !== '[Hermes] Lucy') {
      return reply.status(409).send({ error: 'FEDERATED_CONVERSATION_REQUIRES_HERMES_LUCY' });
    }
    const coordinator = collaboration.getAgent(input.coordinatorAgentId);"""
          if old not in text:
              raise SystemExit('federation route anchor not found')
          route.write_text(text.replace(old, new, 1))

          header = Path('src/ChatHeader.tsx')
          text = header.read_text()
          old = """        {chat.activeConversation && <button className={`federation-button ${federation.active ? 'is-active' : ''}`} onClick={onOpenFederation}><Network size={16} /> {federation.active ? '교차' : '연합'}</button>}"""
          new = """        {chat.activeConversation?.systemId === 'hermes' && chat.activeConversation.agentId === '[Hermes] Lucy' && <button className={`federation-button ${federation.active ? 'is-active' : ''}`} onClick={onOpenFederation}><Network size={16} /> {federation.active ? '교차' : '연합'}</button>}"""
          if old not in text:
              raise SystemExit('chat header federation anchor not found')
          header.write_text(text.replace(old, new, 1))

          encoded = ''
          Path('server/federation-identity.test.ts').write_bytes(base64.b64decode(encoded))
          PY
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and contract tests
        run: npm test -- --run
      - name: Production build
        run: npm run build
      - name: Commit verified source and remove worker
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chat199-federation-identity-worker.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/federation-routes.ts src/ChatHeader.tsx server/federation-identity.test.ts .github/workflows/chat199-federation-identity-worker.yml
          git diff --cached --check
          git commit -m "fix(chat): preserve personal Lucy identity across federation [chat199-federation-guard-done]"
          git push origin HEAD:lucy/chat-199-federation-identity-guard-20260903
