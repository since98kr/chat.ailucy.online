name: Chat199 Hotfix Worker

on:
  push:
    branches:
      - lucy/chat-stream-refresh-race-199

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply stream/navigation lifecycle fix
        run: |
          set -euo pipefail
          python3 .github/chat199-hotfix.py
          git diff --check
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and contract tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Repeat personal Lucy browser scenarios three times
        run: npx playwright test e2e/chat.spec.ts --project=desktop-chromium --grep 'personal Lucy' --retries=0 --repeat-each=3
      - name: Commit verified hotfix and remove one-off worker
        run: |
          set -euo pipefail
          git rm .github/workflows/chat199-hotfix-worker.yml .github/chat199-hotfix.py
          git diff --check
          git config user.name since98kr
          git config user.email since98kr@gmail.com
          git add src/useChat.ts
          git commit -m 'fix(chat): isolate stream lifecycle across navigation'
          git push origin HEAD:lucy/chat-stream-refresh-race-199
