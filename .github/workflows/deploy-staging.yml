name: Deploy staging

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or commit to deploy
        required: true
        default: main
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: chat-v2-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify isolated staging
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 80

    steps:
      - name: Checkout approved revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify source revision
        id: source
        run: |
          set -euo pipefail
          git status --short
          git rev-parse HEAD
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mark staging verification pending
        uses: actions/github-script@v7
        env:
          DEPLOY_SHA: ${{ steps.source.outputs.sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'pending',
              context: 'chat-v2/staging',
              description: 'OpenClaw-backed staging deploy and QA are running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Require private OpenClaw staging ingress
        shell: bash
        env:
          OPENCLAW_GATEWAY_BASE_URL: ${{ vars.OPENCLAW_GATEWAY_BASE_URL }}
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${OPENCLAW_GATEWAY_BASE_URL}" ]] || { echo 'OPENCLAW_GATEWAY_BASE_URL is required for staging cutover.' >&2; exit 1; }
          [[ -n "${OPENCLAW_GATEWAY_TOKEN}" ]] || { echo 'OPENCLAW_GATEWAY_TOKEN is required for staging cutover.' >&2; exit 1; }
          case "${OPENCLAW_GATEWAY_BASE_URL}" in
            http://127.0.0.1:*|http://localhost:*)
              echo 'OpenClaw Gateway loopback URL is not reachable from the staging container; provide a private host/container-reachable ingress.' >&2
              exit 1
              ;;
          esac
          echo 'Private authenticated OpenClaw staging ingress is configured.'

      - name: Legacy Letta bridge rollout is not used in OpenClaw mode
        run: |
          echo 'SKIP: Letta Lucy cognition remains in Letta, while Chat side-effect execution is now routed through the OpenClaw Gateway.'
          echo 'The legacy full-CLI bridge files remain in the repository for rollback investigation only.'

      - name: Enforce fail-closed staging QA gate configuration
        env:
          CHAT_MULTIMODAL_QA_REQUIRED: ${{ vars.CHAT_MULTIMODAL_QA_REQUIRED }}
          CHAT_GENERATED_ARTIFACT_QA_REQUIRED: ${{ vars.CHAT_GENERATED_ARTIFACT_QA_REQUIRED }}
          CHAT_EXTERNAL_QA_REQUIRED: ${{ vars.CHAT_EXTERNAL_QA_REQUIRED }}
          CHAT_LETTA_FULL_RUNTIME_QA_REQUIRED: ${{ vars.CHAT_LETTA_FULL_RUNTIME_QA_REQUIRED }}
          HERMES_PROTOCOL: ${{ vars.HERMES_PROTOCOL }}
          HERMES_ARTIFACT_TOOL_ENABLED: ${{ vars.HERMES_ARTIFACT_TOOL_ENABLED }}
          HERMES_ARTIFACT_ENVELOPE_ENABLED: ${{ vars.HERMES_ARTIFACT_ENVELOPE_ENABLED }}
        run: bash scripts/ops/staging-qa-gate-guard.sh enforce-all

      - name: Deploy with strict preflight, backup, health check, and rollback
        env:
          CHAT_STAGING_ROOT: /opt/chat-v2/staging
          CHAT_STAGING_DATA_DIR: /opt/chat-v2/staging/data
          CHAT_STAGING_PORT: '14174'
          CHAT_PREFLIGHT_STRICT: 'true'
          CHAT_PREFLIGHT_MIN_FREE_BYTES: ${{ vars.CHAT_PREFLIGHT_MIN_FREE_BYTES }}
          CHAT_BACKUP_RETENTION: ${{ vars.CHAT_BACKUP_RETENTION }}
          CHAT_PUBLIC_ORIGIN: ${{ vars.CHAT_PUBLIC_ORIGIN }}
          CHAT_ALLOWED_ORIGIN: ${{ vars.CHAT_ALLOWED_ORIGIN }},http://127.0.0.1:14174
          CHAT_AUTH_MODE: ${{ vars.CHAT_AUTH_MODE }}
          CHAT_ALLOWED_EMAILS: ${{ vars.CHAT_ALLOWED_EMAILS }}
          CHAT_ALLOWED_SERVICE_CLIENT_IDS: ${{ vars.CHAT_ALLOWED_SERVICE_CLIENT_IDS }}
          CHAT_CF_ACCESS_ISSUER: ${{ vars.CHAT_CF_ACCESS_ISSUER }}
          CHAT_CF_ACCESS_AUD: ${{ vars.CHAT_CF_ACCESS_AUD }}
          CHAT_ACCESS_TOKEN: ${{ secrets.CHAT_ACCESS_TOKEN }}
          CHAT_RATE_LIMIT_GENERAL: ${{ vars.CHAT_RATE_LIMIT_GENERAL }}
          CHAT_RATE_LIMIT_CHAT: ${{ vars.CHAT_RATE_LIMIT_CHAT }}
          CHAT_RATE_LIMIT_UPLOAD: ${{ vars.CHAT_RATE_LIMIT_UPLOAD }}
          CHAT_MAX_UPLOAD_BYTES: ${{ vars.CHAT_MAX_UPLOAD_BYTES }}
          CHAT_MAX_GENERATED_ARTIFACT_BYTES: ${{ vars.CHAT_MAX_GENERATED_ARTIFACT_BYTES }}
          CHAT_MAX_INLINE_GENERATED_ARTIFACT_PAYLOAD_BYTES: ${{ vars.CHAT_MAX_INLINE_GENERATED_ARTIFACT_PAYLOAD_BYTES }}
          LETTA_BASE_URL: ${{ vars.OPENCLAW_GATEWAY_BASE_URL }}
          LETTA_CHAT_PATH: ${{ vars.LETTA_CHAT_PATH || '/v1/chat/completions' }}
          LETTA_HEALTH_PATH: ${{ vars.LETTA_HEALTH_PATH || '/health' }}
          LETTA_AGENT_ID: ${{ vars.LETTA_AGENT_ID }}
          LETTA_API_KEY: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
          LETTA_TIMEOUT_MS: ${{ vars.LETTA_TIMEOUT_MS }}
          LETTA_PROTOCOL: openclaw
          LETTA_OPENCLAW_AGENT_TARGET: openclaw/main
          LETTA_OPENCLAW_SESSION_PREFIX: ${{ vars.LETTA_OPENCLAW_SESSION_PREFIX }}
          CF_ACCESS_CLIENT_ID: ${{ vars.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          LETTA_MODEL_MAP_JSON: ''
          LETTA_MAX_ARTIFACT_BYTES: ${{ vars.LETTA_MAX_ARTIFACT_BYTES }}
          LETTA_MAX_ARTIFACT_TOTAL_BYTES: ${{ vars.LETTA_MAX_ARTIFACT_TOTAL_BYTES }}
          LETTA_MAX_TEXT_ARTIFACT_BYTES: ${{ vars.LETTA_MAX_TEXT_ARTIFACT_BYTES }}
          LETTA_NATIVE_BINARY_ARTIFACTS: 'false'
          LETTA_ARTIFACT_TOOL_ENABLED: ${{ vars.LETTA_ARTIFACT_TOOL_ENABLED }}
          HERMES_BASE_URL: ${{ vars.HERMES_BASE_URL }}
          HERMES_BASE_URL_MAP_JSON: ${{ vars.HERMES_BASE_URL_MAP_JSON }}
          HERMES_CHAT_PATH: ${{ vars.HERMES_CHAT_PATH }}
          HERMES_HEALTH_PATH: ${{ vars.HERMES_HEALTH_PATH }}
          HERMES_AGENT_ID: ${{ vars.HERMES_AGENT_ID }}
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
          HERMES_TIMEOUT_MS: ${{ vars.HERMES_TIMEOUT_MS }}
          HERMES_PROTOCOL: ${{ vars.HERMES_PROTOCOL }}
          HERMES_MODEL_MAP_JSON: ${{ vars.HERMES_MODEL_MAP_JSON }}
          HERMES_MAX_ARTIFACT_BYTES: ${{ vars.HERMES_MAX_ARTIFACT_BYTES }}
          HERMES_MAX_ARTIFACT_TOTAL_BYTES: ${{ vars.HERMES_MAX_ARTIFACT_TOTAL_BYTES }}
          HERMES_ARTIFACT_TOOL_ENABLED: ${{ vars.HERMES_ARTIFACT_TOOL_ENABLED }}
          HERMES_ARTIFACT_ENVELOPE_ENABLED: ${{ vars.HERMES_ARTIFACT_ENVELOPE_ENABLED }}
          HERMES_DOCKER_NETWORK: ${{ vars.HERMES_DOCKER_NETWORK }}
          CHAT_MULTIMODAL_QA_REQUIRED: ${{ vars.CHAT_MULTIMODAL_QA_REQUIRED }}
          CHAT_GENERATED_ARTIFACT_QA_REQUIRED: ${{ vars.CHAT_GENERATED_ARTIFACT_QA_REQUIRED }}
          CHAT_EXTERNAL_QA_REQUIRED: ${{ vars.CHAT_EXTERNAL_QA_REQUIRED }}
          CHAT_LETTA_FULL_RUNTIME_QA_REQUIRED: ${{ vars.CHAT_LETTA_FULL_RUNTIME_QA_REQUIRED }}
        run: bash scripts/deploy/staging.sh "$(git rev-parse HEAD)"

      - name: Verify real Hermes and Letta transport
        env:
          CHAT_STAGING_BASE_URL: http://127.0.0.1:14174
          CHAT_STAGING_EMAIL: ${{ vars.CHAT_ALLOWED_EMAILS }}
        run: bash scripts/ops/staging-smoke.sh

      - name: Verify OpenClaw-backed Letta session continuity
        env:
          CHAT_STAGING_BASE_URL: http://127.0.0.1:14174
          CHAT_STAGING_EMAIL: ${{ vars.CHAT_ALLOWED_EMAILS }}
        run: bash scripts/ops/openclaw-letta-staging-smoke.sh

      - name: Verify real browser links and configured artifacts
        env:
          CHAT_STAGING_BASE_URL: http://127.0.0.1:14174
          CHAT_STAGING_EMAIL: ${{ vars.CHAT_ALLOWED_EMAILS }}
          CHAT_MULTIMODAL_QA_REQUIRED: ${{ vars.CHAT_MULTIMODAL_QA_REQUIRED }}
          CHAT_GENERATED_ARTIFACT_QA_REQUIRED: ${{ vars.CHAT_GENERATED_ARTIFACT_QA_REQUIRED }}
          CHAT_LETTA_FULL_RUNTIME_QA_REQUIRED: ${{ vars.CHAT_LETTA_FULL_RUNTIME_QA_REQUIRED }}
          CHAT_HERMES_VISION_AGENT_ID: ${{ vars.CHAT_HERMES_VISION_AGENT_ID }}
        run: bash scripts/ops/staging-browser-smoke.sh

      - name: Capture authenticated OpenClaw Lucy target evidence
        shell: bash
        env:
          OPENCLAW_GATEWAY_BASE_URL: ${{ vars.OPENCLAW_GATEWAY_BASE_URL }}
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ vars.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          OPENCLAW_LUCY_TARGET: openclaw/main
          OPENCLAW_MODELS_EVIDENCE_PATH: ${{ runner.temp }}/openclaw-models.json
        run: |
          set -euo pipefail
          [[ -n "${OPENCLAW_GATEWAY_BASE_URL}" && -n "${OPENCLAW_GATEWAY_TOKEN}" ]]
          umask 077
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${OPENCLAW_GATEWAY_TOKEN}" \
            --header "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            --header "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            "${OPENCLAW_GATEWAY_BASE_URL%/}/v1/models" >"${OPENCLAW_MODELS_EVIDENCE_PATH}"
          node - "${OPENCLAW_MODELS_EVIDENCE_PATH}" "${OPENCLAW_LUCY_TARGET}" <<'NODE'
          const fs = require('node:fs');
          const [path, target] = process.argv.slice(2);
          const value = JSON.parse(fs.readFileSync(path, 'utf8'));
          const items = Array.isArray(value.data) ? value.data : Array.isArray(value.models) ? value.models : [];
          const ids = items.map((item) => typeof item === 'string' ? item : item && typeof item.id === 'string' ? item.id : '').filter(Boolean);
          if (!ids.includes(target)) {
            console.error(`Configured OpenClaw Lucy target is not advertised: ${target}`);
            process.exit(1);
          }
          fs.writeFileSync(path, JSON.stringify({ object: value.object || 'list', targetAdvertised: true, target }, null, 2) + '\n');
          NODE
          echo 'Authenticated OpenClaw Lucy target evidence captured without credential or provider-model disclosure.'

      - name: Verify public Cloudflare Access and artifact transport
        env:
          CHAT_EXTERNAL_QA_REQUIRED: ${{ vars.CHAT_EXTERNAL_QA_REQUIRED }}
          CHAT_MULTIMODAL_QA_REQUIRED: ${{ vars.CHAT_MULTIMODAL_QA_REQUIRED }}
          CHAT_GENERATED_ARTIFACT_QA_REQUIRED: ${{ vars.CHAT_GENERATED_ARTIFACT_QA_REQUIRED }}
          CHAT_LETTA_FULL_RUNTIME_QA_REQUIRED: ${{ vars.CHAT_LETTA_FULL_RUNTIME_QA_REQUIRED }}
          CHAT_HERMES_VISION_AGENT_ID: ${{ vars.CHAT_HERMES_VISION_AGENT_ID }}
          CHAT_STAGING_BASE_URL: ${{ vars.CHAT_PUBLIC_ORIGIN }}
          CF_ACCESS_CLIENT_ID: ${{ vars.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [[ "${CHAT_EXTERNAL_QA_REQUIRED,,}" != 'true' ]]; then
            echo '[chat-v2-external-smoke] SKIP: external QA is not activated.'
            exit 0
          fi
          bash scripts/ops/external-staging-browser-smoke.sh

      - name: Publish deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Chat V2 staging'
            echo
            echo "- Requested revision: \`$(git rev-parse HEAD)\`"
            echo '- Local endpoint: `http://127.0.0.1:14174`'
            echo "- Public endpoint: \`${{ vars.CHAT_PUBLIC_ORIGIN }}\`"
            echo '- Letta transport: `openclaw`'
            echo '- OpenClaw Lucy target: `openclaw/main`'
            echo '- Backend model override: disabled; OpenClaw main keeps its configured model (`letta/lucy`)'
            echo "- External QA required: \`${{ vars.CHAT_EXTERNAL_QA_REQUIRED }}\`"
            echo "- Multimodal QA required: \`${{ vars.CHAT_MULTIMODAL_QA_REQUIRED }}\`"
            echo "- Generated artifact QA required: \`${{ vars.CHAT_GENERATED_ARTIFACT_QA_REQUIRED }}\`"
            echo "- Letta full runtime QA required: \`${{ vars.CHAT_LETTA_FULL_RUNTIME_QA_REQUIRED }}\`"
            echo '- Required Letta/OpenClaw gates: private Gateway health, canonical main agent target, real Chat transport, two-turn same-Conversation session continuity, redaction, and configured artifact/browser gates'
            echo '- Legacy direct Letta CLI/HMAC tool proof is not a release gate in OpenClaw mode.'
            for item in last-deployment.json last-preflight.json last-backup.json last-backup-verify.json last-health.json last-ops-status.json; do
              path="/opt/chat-v2/staging/state/${item}"
              if [[ -f "${path}" ]]; then
                echo
                echo "### ${item}"
                echo '```json'
                cat "${path}"
                echo
                echo '```'
              fi
            done
            if [[ -f "${RUNNER_TEMP}/openclaw-models.json" ]]; then
              echo
              echo '### openclaw-models.json'
              echo '```json'
              cat "${RUNNER_TEMP}/openclaw-models.json"
              echo
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-v2-staging-deployment-${{ github.run_id }}
          path: |
            /opt/chat-v2/staging/state/last-deployment.json
            /opt/chat-v2/staging/state/last-preflight.json
            /opt/chat-v2/staging/state/last-preflight-output.log
            /opt/chat-v2/staging/state/last-backup.json
            /opt/chat-v2/staging/state/last-backup-verify.json
            /opt/chat-v2/staging/state/last-health.json
            /opt/chat-v2/staging/state/last-ops-status.json
            ${{ runner.temp }}/openclaw-models.json
            test-results-staging-browser
            playwright-staging-report
            test-results-external-staging-browser
            playwright-external-staging-report
          if-no-files-found: warn
          retention-days: 30

      - name: Publish staging verification status
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_SHA: ${{ steps.source.outputs.sha }}
          DEPLOY_RESULT: ${{ job.status }}
        with:
          script: |
            const success = process.env.DEPLOY_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: success ? 'success' : 'failure',
              context: 'chat-v2/staging',
              description: success
                ? 'OpenClaw-backed staging and configured QA gates passed'
                : 'OpenClaw staging deploy or QA failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });