name: AICOS OpenClaw relay GitHub-hosted canary

on:
  push:
    branches:
      - test/openclaw-github-hosted-relay
    paths:
      - .github/workflows/aicos-openclaw-relay-github-hosted-canary.yml

permissions:
  contents: read
  issues: write

env:
  NODE_ENV: test

jobs:
  canary:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify relay source
        run: |
          node --check scripts/aicos-relay-v1.mjs
          node --check scripts/aicos-openclaw-relay-handler.mjs
          node --test tests/aicos-relay-v1.contract.mjs
      - name: Sweep canonical mailbox through public Gateway
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENCLAW_GATEWAY_BASE_URL: ${{ vars.OPENCLAW_GATEWAY_BASE_URL }}
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ vars.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          LETTA_OPENCLAW_AGENT_TARGET: ${{ vars.LETTA_OPENCLAW_AGENT_TARGET }}
        run: |
          set -Eeuo pipefail
          umask 077
          node scripts/aicos-openclaw-relay-handler.mjs sweep
