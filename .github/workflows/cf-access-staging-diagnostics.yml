name: Diagnose CF Access staging

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: [self-hosted, chat-staging]
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Probe public staging endpoint with service token
        env:
          CHAT_PUBLIC_ORIGIN: ${{ vars.CHAT_PUBLIC_ORIGIN }}
          CF_ACCESS_CLIENT_ID: ${{ vars.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/cf_probe.out -w '%{http_code}' \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            "${CHAT_PUBLIC_ORIGIN}/api/health" || true)
          echo "RESULT http_code=${code}"

      - name: Cloudflare API capability and Access inventory
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ vars.CF_ACCESS_CLIENT_ID }}
        run: |
          set -euo pipefail
          api() {
            curl -sS -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4$1"
          }
          vt=$(api "/user/tokens/verify")
          echo "RESULT token_verify_success=$(echo "$vt" | jq -r '.success') status=$(echo "$vt" | jq -r '.result.status // "n/a"')"
          echo "$vt" | jq -r '.errors[]? | "RESULT verify_error code=\(.code) msg=\(.message)"'

          apps=$(api "/accounts/${CF_ACCOUNT_ID}/access/apps?per_page=100")
          echo "RESULT apps_success=$(echo "$apps" | jq -r '.success')"
          echo "$apps" | jq -r '.errors[]? | "RESULT apps_error code=\(.code) msg=\(.message)"'
          echo "RESULT apps_count=$(echo "$apps" | jq -r '[.result[]?]|length')"
          echo "$apps" | jq -r '.result[]? | "RESULT APP name=\(.name) domain=\(.domain)"'

          appid=$(echo "$apps" | jq -r '[.result[]? | select((.domain//"")|test("chat-staging"))][0].id // empty')
          if [ -z "$appid" ]; then
            echo "RESULT no_app_matched=chat-staging"
          else
            pol=$(api "/accounts/${CF_ACCOUNT_ID}/access/apps/${appid}/policies")
            echo "$pol" | jq -r '.result[]? | "RESULT POLICY name=\(.name) decision=\(.decision) include=\((.include//[])|map(keys[0])|join(","))"'
            echo "RESULT service_token_includes=$(echo "$pol" | jq -r '[.result[]?.include[]?|select(has("service_token") or has("any_valid_service_token"))]|length')"
          fi

          st=$(api "/accounts/${CF_ACCOUNT_ID}/access/service_tokens?per_page=100")
          echo "RESULT tokens_success=$(echo "$st" | jq -r '.success')"
          echo "$st" | jq -r --arg cid "${CF_ACCESS_CLIENT_ID}" '.result[]? | "RESULT TOKEN name=\(.name) expires_at=\(.expires_at) matches_configured_id=\(.client_id==$cid)"'
