name: Apply atomic HMAC proof redaction

on:
  push:
    branches:
      - 'agent/letta-hmac-wire-proof'
    paths:
      - '.github/workflows/letta-hmac-prefix-apply.yml'
      - 'ops/letta-bridge/letta-cli-bridge.mjs'
      - 'ops/letta-bridge/letta-side-effect-tool-proof.nodecheck.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/letta-hmac-prefix-apply.yml'
      - 'ops/letta-bridge/letta-cli-bridge.mjs'
      - 'ops/letta-bridge/letta-side-effect-tool-proof.nodecheck.mjs'

permissions:
  contents: write

concurrency:
  group: letta-hmac-prefix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.ref == 'refs/heads/agent/letta-hmac-wire-proof' || github.head_ref == 'agent/letta-hmac-wire-proof' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/letta-hmac-wire-proof
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply and verify atomic proof redaction
        shell: bash
        run: |
          set -euo pipefail
          branch='agent/letta-hmac-wire-proof'
          git fetch origin "${branch}"
          git rebase "origin/${branch}"
          python3 <<'PY'
          from pathlib import Path

          bridge_path = Path('ops/letta-bridge/letta-cli-bridge.mjs')
          bridge = bridge_path.read_text()
          old = "  return value.split(probe.command).join('[tool-probe-command-redacted]')"
          new = "  return value.split(TOOL_PROBE_RESULT_PREFIX + probe.expected).join('[verified-tool-hmac-redacted]')\n    .split(probe.command).join('[tool-probe-command-redacted]')"
          if old in bridge:
              bridge = bridge.replace(old, new, 1)
              bridge_path.write_text(bridge)
          elif new not in bridge:
              raise SystemExit('atomic proof redaction anchor missing')

          test_path = Path('ops/letta-bridge/letta-side-effect-tool-proof.nodecheck.mjs')
          test = test_path.read_text()
          old_import = "  observeToolProbe,\n  toolProbeDiagnostic,"
          new_import = "  observeToolProbe,\n  redactToolProbeText,\n  toolProbeDiagnostic,"
          if old_import in test:
              test = test.replace(old_import, new_import, 1)
          elif new_import not in test:
              raise SystemExit('redaction import anchor missing')

          anchor = "  assert.equal(toolProbeDiagnostic(probe), 'tool_signal=false;assistant_text=false;prefix=true;hex=true');"
          addition = """  assert.equal(toolProbeDiagnostic(probe), 'tool_signal=false;assistant_text=false;prefix=true;hex=true');
  const redacted = redactToolProbeText(`ok CHAT_V2_TOOL_PROBE_RESULT=${probe.expected}`, probe);
  assert.equal(redacted, 'ok [verified-tool-hmac-redacted]');
  assert.equal(redacted.includes('CHAT_V2_TOOL_PROBE_RESULT='), false);"""
          if anchor in test:
              test = test.replace(anchor, addition, 1)
          elif addition not in test:
              raise SystemExit('redaction assertion anchor missing')
          test_path.write_text(test)
          PY
          node --check ops/letta-bridge/letta-cli-bridge.mjs
          node --test ops/letta-bridge/letta-side-effect-tool-proof.nodecheck.mjs
          git diff --check
          targets=(ops/letta-bridge/letta-cli-bridge.mjs ops/letta-bridge/letta-side-effect-tool-proof.nodecheck.mjs)
          if git diff --quiet -- "${targets[@]}"; then
            echo 'Atomic proof redaction is already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${targets[@]}"
          git commit -m 'Redact the complete Letta HMAC proof field (#93)'
          git push origin HEAD:"${branch}"
