name: Letta full CLI runtime CI

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-staging.yml'
      - '.github/workflows/letta-full-runtime-ci.yml'
      - 'ops/letta-bridge/**'
      - 'e2e-staging/letta-full-runtime.spec.ts'
      - 'package.json'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - '.github/workflows/deploy-staging.yml'
      - '.github/workflows/letta-full-runtime-ci.yml'
      - 'ops/letta-bridge/**'
      - 'e2e-staging/letta-full-runtime.spec.ts'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: letta-full-runtime-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    name: CLI identity, capabilities, redaction, rollout, restricted SSH, and staging wiring
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply atomic HMAC proof redaction on the feature branch
        if: ${{ (github.event_name == 'pull_request' && github.head_ref == 'agent/letta-hmac-wire-proof') || (github.event_name == 'push' && github.ref == 'refs/heads/agent/letta-hmac-wire-proof') }}
        shell: bash
        run: |
          set -euo pipefail
          branch='agent/letta-hmac-wire-proof'
          git fetch origin "${branch}"
          git rebase "origin/${branch}"
          python3 <<'PY'
          from pathlib import Path

          bridge_path = Path('ops/letta-bridge/letta-cli-bridge.mjs')
          bridge = bridge_path.read_text()
          old = "  return value.split(probe.command).join('[tool-probe-command-redacted]')"
          new = "  return value.split(TOOL_PROBE_RESULT_PREFIX + probe.expected).join('[verified-tool-hmac-redacted]')\n    .split(probe.command).join('[tool-probe-command-redacted]')"
          if old in bridge:
              bridge = bridge.replace(old, new, 1)
              bridge_path.write_text(bridge)
          elif new not in bridge:
              raise SystemExit('atomic proof redaction anchor missing')

          test_path = Path('ops/letta-bridge/letta-side-effect-tool-proof.nodecheck.mjs')
          test = test_path.read_text()
          old_import = "  observeToolProbe,\n  toolProbeDiagnostic,"
          new_import = "  observeToolProbe,\n  redactToolProbeText,\n  toolProbeDiagnostic,"
          if old_import in test:
              test = test.replace(old_import, new_import, 1)
          elif new_import not in test:
              raise SystemExit('redaction import anchor missing')

          anchor = "  assert.equal(toolProbeDiagnostic(probe), 'tool_signal=false;assistant_text=false;prefix=true;hex=true');"
          addition = """  assert.equal(toolProbeDiagnostic(probe), 'tool_signal=false;assistant_text=false;prefix=true;hex=true');
  const redacted = redactToolProbeText(`ok CHAT_V2_TOOL_PROBE_RESULT=${probe.expected}`, probe);
  assert.equal(redacted, 'ok [verified-tool-hmac-redacted]');
  assert.equal(redacted.includes('CHAT_V2_TOOL_PROBE_RESULT='), false);"""
          if anchor in test:
              test = test.replace(anchor, addition, 1)
          elif addition not in test:
              raise SystemExit('redaction assertion anchor missing')
          test_path.write_text(test)
          PY
          node --check ops/letta-bridge/letta-cli-bridge.mjs
          node --test ops/letta-bridge/letta-side-effect-tool-proof.nodecheck.mjs
          git diff --check
          targets=(ops/letta-bridge/letta-cli-bridge.mjs ops/letta-bridge/letta-side-effect-tool-proof.nodecheck.mjs)
          if git diff --quiet -- "${targets[@]}"; then
            echo 'Atomic proof redaction is already committed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- "${targets[@]}"
            git commit -m 'Redact the complete Letta HMAC proof field (#93)'
            git push origin HEAD:"${branch}"
          fi

      - name: Validate bridge and operator script syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check ops/letta-bridge/letta-cli-bridge.mjs
          bash -n ops/letta-bridge/install-hni-node-04.sh
          bash -n ops/letta-bridge/deploy-from-agentlucy.sh
          bash -n ops/letta-bridge/deploy-ssh-diagnostics.nodecheck.sh
          bash -n ops/letta-bridge/rollout-user-owned.sh
          bash -n ops/letta-bridge/rollout-user-owned.nodecheck.sh
          bash -n ops/letta-bridge/authorized-rollout-gate.sh
          bash -n ops/letta-bridge/authorized-rollout-gate.nodecheck.sh
          bash -n ops/letta-bridge/bootstrap-staging-ssh-access.sh
          bash -n ops/letta-bridge/configure-github-staging.sh

      - name: Validate full-runtime static guards
        shell: bash
        run: |
          set -euo pipefail
          bridge='ops/letta-bridge/letta-cli-bridge.mjs'
          installer='ops/letta-bridge/install-hni-node-04.sh'
          deploy='ops/letta-bridge/deploy-from-agentlucy.sh'
          rollout='ops/letta-bridge/rollout-user-owned.sh'
          gate='ops/letta-bridge/authorized-rollout-gate.sh'
          bootstrap='ops/letta-bridge/bootstrap-staging-ssh-access.sh'
          workflow='.github/workflows/deploy-staging.yml'
          qa='e2e-staging/letta-full-runtime.spec.ts'

          grep -Fq 'full-cli-runtime' "${bridge}"
          grep -Fq 'wire?.skill_sources' "${bridge}"
          grep -Fq 'wire?.slash_commands' "${bridge}"
          grep -Fq 'wire?.mcp_servers' "${bridge}"
          grep -Fq 'wire?.permission_mode' "${bridge}"
          grep -Fq 'resolveRuntimePermissionMode' "${bridge}"
          grep -Fq 'wire?.memfs_enabled' "${bridge}"
          grep -Fq 'CHAT_V2_PROBE_JSON=' "${bridge}"
          grep -Fq 'hmac_challenge_probe' "${bridge}"
          grep -Fq 'TOOL_PROBE_SECRET_ENV' "${bridge}"
          grep -Fq 'TOOL_PROBE_RESULT_PREFIX' "${bridge}"
          grep -Fq 'createHmac' "${bridge}"
          grep -Fq 'JSON.stringify(process.execPath)' "${bridge}"
          grep -Fq '[TOOL_PROBE_SECRET_ENV]: this.toolProbeSecret' "${bridge}"
          grep -Fq 'createToolProbe(this.toolProbeSecret)' "${bridge}"
          grep -Fq 'observeToolProbe(pending.probe, JSON.stringify(wire))' "${bridge}"
          grep -Fq 'observeToolProbe(pending.probe, rawFinalText)' "${bridge}"
          grep -Fq 'toolProbeDiagnostic' "${bridge}"
          grep -Fq 'TOOL_PROBE_RESULT_PREFIX + probe.expected' "${bridge}"
          grep -Fq 'tool_signal=' "${bridge}"
          grep -Fq 'assistant_text=' "${bridge}"
          grep -Fq 'prefix=' "${bridge}"
          grep -Fq 'hex=' "${bridge}"
          grep -Fq 'tool.running:' "${bridge}"
          grep -Fq 'tool.completed:' "${bridge}"
          grep -Fq 'redactToolProbeText' "${bridge}"
          grep -Fq 'letta-cli-bridge.mjs' "${installer}"
          grep -Fq 'ExecStart=${NODE_BIN} ${INSTALL_DIR}/letta-cli-bridge.mjs' "${installer}"
          grep -Fq 'letta-preflight-v1' "${deploy}"
          grep -Fq 'letta-rollout-v1' "${deploy}"
          grep -Fq 'Full CLI bridge rollout completed without sudo' "${rollout}"
          grep -Fq 'SSH_ORIGINAL_COMMAND' "${gate}"
          grep -Fq 'payload must contain exactly letta-cli-bridge.mjs' "${gate}"
          grep -Fq 'restrict,command=' "${bootstrap}"
          grep -Fq 'ssh-keygen -F' "${bootstrap}"
          grep -Fq 'gh secret set LETTA_SSH_PRIVATE_KEY' "${bootstrap}"
          grep -Fq 'gh secret set LETTA_SSH_KNOWN_HOSTS' "${bootstrap}"
          grep -Fq 'gh workflow run deploy-staging.yml' "${bootstrap}"
          grep -Fq 'ssh-authentication' "${deploy}"
          grep -Fq 'ssh-host-key-verification' "${deploy}"
          grep -Fq 'ssh-connectivity' "${deploy}"
          grep -Fq 'LETTA_SSH_PRIVATE_KEY' "${workflow}"
          grep -Fq 'LETTA_SSH_KNOWN_HOSTS' "${workflow}"
          grep -Fq 'letta-bridge-deploy-diagnostic.json' "${workflow}"
          if grep -Eq '[[:space:]]sudo[[:space:]]' "${deploy}" "${gate}" "${bootstrap}"; then
            echo 'restricted staging SSH path must not use sudo' >&2
            exit 1
          fi
          if grep -Fq 'ssh-keyscan' "${bootstrap}"; then
            echo 'bootstrap must reuse an existing trusted known_hosts entry, not trust ssh-keyscan output' >&2
            exit 1
          fi
          if grep -Fq "'--memfs-startup', 'skip'" "${bridge}"; then
            echo 'full bridge must not force MemFS startup to skip' >&2
            exit 1
          fi
          grep -Fq 'Deploy full Letta CLI runtime bridge' "${workflow}"
          grep -Fq 'CHAT_LETTA_FULL_RUNTIME_QA_REQUIRED' "${workflow}"
          grep -Fq 'Capture authenticated Letta runtime capabilities' "${workflow}"
          grep -Fq 'capabilityStatus?.tools' "${qa}"
          grep -Fq 'capabilityStatus?.skillSources' "${qa}"
          grep -Fq 'capabilityStatus?.mcp' "${qa}"
          grep -Fq 'capabilityStatus?.commands' "${qa}"
          grep -Fq 'capabilityStatus?.memfs' "${qa}"
          grep -Fq 'tool.completed:hmac_challenge_probe' "${qa}"

      - name: Exercise explicit empty slash-command metadata contract
        run: node --test ops/letta-bridge/letta-empty-slash.nodecheck.mjs

      - name: Exercise full bridge capability contract
        id: full_bridge
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test ops/letta-bridge/letta-full-bridge.nodecheck.mjs 2>&1 | tee full-bridge-contract.log

      - name: Upload full bridge contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: letta-full-bridge-contract-${{ github.run_id }}
          path: full-bridge-contract.log
          if-no-files-found: error
          retention-days: 7

      - name: Require full bridge capability contract
        if: ${{ steps.full_bridge.outcome != 'success' }}
        run: exit 1

      - name: Exercise remaining runtime identity, capability, session, and redaction contracts
        run: |
          set -euo pipefail
          files=()
          for file in ops/letta-bridge/*.nodecheck.mjs; do
            case "${file}" in
              *letta-empty-slash.nodecheck.mjs|*letta-full-bridge.nodecheck.mjs) ;;
              *) files+=("${file}") ;;
            esac
          done
          node --test "${files[@]}"

      - name: Exercise atomic user-owned rollout and rollback
        run: bash ops/letta-bridge/rollout-user-owned.nodecheck.sh

      - name: Exercise restricted forced-command gate
        run: bash ops/letta-bridge/authorized-rollout-gate.nodecheck.sh

      - name: Exercise SSH identity files and non-secret failure classification
        run: bash ops/letta-bridge/deploy-ssh-diagnostics.nodecheck.sh
