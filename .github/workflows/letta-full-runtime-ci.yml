name: Letta legacy bridge and OpenClaw staging CI

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-staging.yml'
      - '.github/workflows/staging-preflight.yml'
      - '.github/workflows/letta-full-runtime-ci.yml'
      - 'compose.staging.yml'
      - 'scripts/ops/openclaw-letta-staging-smoke.sh'
      - 'scripts/ops/staging-preflight.sh'
      - 'ops/letta-bridge/**'
      - 'e2e-staging/letta-full-runtime.spec.ts'
      - 'package.json'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - '.github/workflows/deploy-staging.yml'
      - '.github/workflows/staging-preflight.yml'
      - '.github/workflows/letta-full-runtime-ci.yml'
      - 'compose.staging.yml'
      - 'scripts/ops/openclaw-letta-staging-smoke.sh'
      - 'scripts/ops/staging-preflight.sh'
      - 'ops/letta-bridge/**'
      - 'e2e-staging/letta-full-runtime.spec.ts'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: letta-openclaw-runtime-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    name: Legacy bridge preservation and OpenClaw staging wiring
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate bridge, staging, and operator script syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check ops/letta-bridge/letta-cli-bridge.mjs
          bash -n ops/letta-bridge/install-hni-node-04.sh
          bash -n ops/letta-bridge/deploy-from-agentlucy.sh
          bash -n ops/letta-bridge/deploy-ssh-diagnostics.nodecheck.sh
          bash -n ops/letta-bridge/rollout-user-owned.sh
          bash -n ops/letta-bridge/rollout-user-owned.nodecheck.sh
          bash -n ops/letta-bridge/authorized-rollout-gate.sh
          bash -n ops/letta-bridge/authorized-rollout-gate.nodecheck.sh
          bash -n ops/letta-bridge/bootstrap-staging-ssh-access.sh
          bash -n ops/letta-bridge/configure-github-staging.sh
          bash -n scripts/ops/staging-preflight.sh
          bash -n scripts/ops/openclaw-letta-staging-smoke.sh

      - name: Validate legacy bridge preservation and OpenClaw staging guards
        shell: bash
        run: |
          set -euo pipefail
          bridge='ops/letta-bridge/letta-cli-bridge.mjs'
          installer='ops/letta-bridge/install-hni-node-04.sh'
          deploy='ops/letta-bridge/deploy-from-agentlucy.sh'
          rollout='ops/letta-bridge/rollout-user-owned.sh'
          gate='ops/letta-bridge/authorized-rollout-gate.sh'
          bootstrap='ops/letta-bridge/bootstrap-staging-ssh-access.sh'
          workflow='.github/workflows/deploy-staging.yml'
          preflight_workflow='.github/workflows/staging-preflight.yml'
          compose='compose.staging.yml'
          preflight='scripts/ops/staging-preflight.sh'
          continuity='scripts/ops/openclaw-letta-staging-smoke.sh'
          qa='e2e-staging/letta-full-runtime.spec.ts'

          # Legacy bridge implementation remains intact as rollback/debugging evidence.
          grep -Fq 'full-cli-runtime' "${bridge}"
          grep -Fq 'wire?.skill_sources' "${bridge}"
          grep -Fq 'wire?.slash_commands' "${bridge}"
          grep -Fq 'wire?.mcp_servers' "${bridge}"
          grep -Fq 'wire?.permission_mode' "${bridge}"
          grep -Fq 'resolveRuntimePermissionMode' "${bridge}"
          grep -Fq 'wire?.memfs_enabled' "${bridge}"
          grep -Fq 'CHAT_V2_PROBE_JSON=' "${bridge}"
          grep -Fq 'hmac_challenge_probe' "${bridge}"
          grep -Fq 'TOOL_PROBE_SECRET_ENV' "${bridge}"
          grep -Fq 'TOOL_PROBE_RESULT_PREFIX' "${bridge}"
          grep -Fq 'createHmac' "${bridge}"
          grep -Fq '[TOOL_PROBE_SECRET_ENV]: this.toolProbeSecret' "${bridge}"
          grep -Fq 'createToolProbe(this.toolProbeSecret)' "${bridge}"
          grep -Fq 'observeToolProbe(pending.probe, rawFinalText)' "${bridge}"
          grep -Fq 'tool.running:' "${bridge}"
          grep -Fq 'tool.completed:' "${bridge}"
          grep -Fq 'redactToolProbeText' "${bridge}"
          grep -Fq 'verified-tool-hmac-redacted' "${bridge}"
          grep -Fq 'letta-cli-bridge.mjs' "${installer}"
          grep -Fq 'ExecStart=${NODE_BIN} ${INSTALL_DIR}/letta-cli-bridge.mjs' "${installer}"
          grep -Fq 'letta-preflight-v1' "${deploy}"
          grep -Fq 'letta-rollout-v1' "${deploy}"
          grep -Fq 'Full CLI bridge rollout completed without sudo' "${rollout}"
          grep -Fq 'SSH_ORIGINAL_COMMAND' "${gate}"
          grep -Fq 'payload must contain exactly letta-cli-bridge.mjs' "${gate}"
          grep -Fq 'restrict,command=' "${bootstrap}"
          grep -Fq 'ssh-keygen -F' "${bootstrap}"
          grep -Fq 'gh secret set LETTA_SSH_PRIVATE_KEY' "${bootstrap}"
          grep -Fq 'gh secret set LETTA_SSH_KNOWN_HOSTS' "${bootstrap}"
          grep -Fq 'ssh-authentication' "${deploy}"
          grep -Fq 'ssh-host-key-verification' "${deploy}"
          grep -Fq 'ssh-connectivity' "${deploy}"
          if grep -Eq '[[:space:]]sudo[[:space:]]' "${deploy}" "${gate}" "${bootstrap}"; then
            echo 'restricted legacy SSH path must not use sudo' >&2
            exit 1
          fi
          if grep -Fq 'ssh-keyscan' "${bootstrap}"; then
            echo 'legacy bootstrap must reuse an existing trusted known_hosts entry, not trust ssh-keyscan output' >&2
            exit 1
          fi
          if grep -Fq "'--memfs-startup', 'skip'" "${bridge}"; then
            echo 'legacy full bridge must not force MemFS startup to skip' >&2
            exit 1
          fi

          # OpenClaw staging is the active acceptance boundary.
          grep -Fq 'OPENCLAW_GATEWAY_BASE_URL' "${workflow}"
          grep -Fq 'OPENCLAW_GATEWAY_TOKEN' "${workflow}"
          grep -Fq 'LETTA_PROTOCOL: openclaw' "${workflow}"
          grep -Fq 'LETTA_OPENCLAW_AGENT_TARGET' "${workflow}"
          grep -Fq '/v1/chat/completions' "${workflow}"
          grep -Fq 'Verify OpenClaw-backed Letta session continuity' "${workflow}"
          grep -Fq 'Capture authenticated OpenClaw Lucy target evidence' "${workflow}"
          grep -Fq 'CHAT_LETTA_FULL_RUNTIME_QA_REQUIRED: '\''false'\''' "${workflow}"
          grep -Fq 'OPENCLAW_GATEWAY_BASE_URL' "${preflight_workflow}"
          grep -Fq 'LETTA_PROTOCOL: openclaw' "${preflight_workflow}"
          grep -Fq 'LETTA_OPENCLAW_AGENT_TARGET' "${compose}"
          grep -Fq 'LETTA_OPENCLAW_SESSION_PREFIX' "${compose}"
          grep -Fq 'LETTA_OPENCLAW_AGENT_TARGET' "${preflight}"
          grep -Fq 'LETTA_OPENCLAW_SESSION_PREFIX' "${preflight}"
          grep -Fq 'two-turn OpenClaw session proof' "${continuity}"
          grep -Fq 'immediately previous turn' "${continuity}"
          ! grep -Fq 'LETTA_SSH_PRIVATE_KEY' "${workflow}"
          ! grep -Fq 'LETTA_SSH_KNOWN_HOSTS' "${workflow}"
          ! grep -Fq 'Capture authenticated Letta runtime capabilities' "${workflow}"

          # The old browser spec is retained only for explicit legacy runs.
          grep -Fq 'capabilityStatus?.tools' "${qa}"
          grep -Fq 'capabilityStatus?.skillSources' "${qa}"
          grep -Fq 'capabilityStatus?.mcp' "${qa}"
          grep -Fq 'capabilityStatus?.commands' "${qa}"
          grep -Fq 'capabilityStatus?.memfs' "${qa}"
          grep -Fq 'tool.completed:hmac_challenge_probe' "${qa}"

      - name: Exercise explicit empty slash-command metadata contract
        run: node --test ops/letta-bridge/letta-empty-slash.nodecheck.mjs

      - name: Exercise preserved full bridge capability contract
        id: full_bridge
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test ops/letta-bridge/letta-full-bridge.nodecheck.mjs 2>&1 | tee full-bridge-contract.log

      - name: Upload preserved bridge contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: letta-full-bridge-contract-${{ github.run_id }}
          path: full-bridge-contract.log
          if-no-files-found: error
          retention-days: 7

      - name: Require preserved bridge capability contract
        if: ${{ steps.full_bridge.outcome != 'success' }}
        run: exit 1

      - name: Exercise remaining legacy runtime identity, session, and redaction contracts
        run: |
          set -euo pipefail
          files=()
          for file in ops/letta-bridge/*.nodecheck.mjs; do
            case "${file}" in
              *letta-empty-slash.nodecheck.mjs|*letta-full-bridge.nodecheck.mjs) ;;
              *) files+=("${file}") ;;
            esac
          done
          node --test "${files[@]}"

      - name: Exercise atomic user-owned rollout and rollback
        run: bash ops/letta-bridge/rollout-user-owned.nodecheck.sh

      - name: Exercise restricted forced-command gate
        run: bash ops/letta-bridge/authorized-rollout-gate.nodecheck.sh

      - name: Exercise SSH identity files and non-secret failure classification
        run: bash ops/letta-bridge/deploy-ssh-diagnostics.nodecheck.sh
