name: Verify OpenClaw private bridge proxy

on:
  push:
    branches:
      - diag/openclaw-main-model
    paths:
      - '.github/workflows/openclaw-main-model-diagnostic.yml'

permissions:
  contents: read
  statuses: write

jobs:
  proxy:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Mark proxy verification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'chat-v2/openclaw-proxy-host',
              description: 'Verifying private Docker bridge proxy',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Verify existing listener and real OpenClaw main route
        id: verify
        shell: bash
        env:
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ -n "${OPENCLAW_GATEWAY_TOKEN:-}" ]]
          bridge="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
          container_host="$(docker exec chat-v2-staging getent hosts host.docker.internal | awk '{print $1}' | head -n1)"
          [[ "${container_host}" == "${bridge}" ]]
          echo "RESULT bridge=${bridge}"
          echo 'RESULT listener:'
          ss -ltnp 'sport = :18791' || true
          ss -ltn 'sport = :18791' | tail -n +2 | grep -Fq "${bridge}:18791"
          echo "RESULT user_service=$(XDG_RUNTIME_DIR=/run/user/$(id -u) systemctl --user is-active chat-v2-openclaw-proxy.service 2>/dev/null || true)"
          echo "RESULT system_service=$(sudo -n systemctl is-active chat-v2-openclaw-proxy.service 2>/dev/null || true)"
          curl --fail --silent --show-error --max-time 5 "http://${bridge}:18791/health" >/dev/null
          docker exec -i \
            -e OPENCLAW_GATEWAY_TOKEN="${OPENCLAW_GATEWAY_TOKEN}" \
            chat-v2-staging node --input-type=module - <<'NODE'
          const response = await fetch('http://host.docker.internal:18791/v1/chat/completions', {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.OPENCLAW_GATEWAY_TOKEN}`,
              'content-type': 'application/json',
            },
            body: JSON.stringify({
              model: 'openclaw/main',
              user: 'chat-private-existing-proxy-canary',
              messages: [{ role: 'user', content: 'Reply exactly OPENCLAW_EXISTING_PROXY_OK' }],
              stream: false,
            }),
          });
          const raw = await response.text();
          const marker = raw.includes('OPENCLAW_EXISTING_PROXY_OK');
          const noCredits = raw.toLowerCase().includes('no credits remaining');
          console.log(`RESULT proxy_http=${response.status}`);
          console.log(`RESULT proxy_marker=${marker}`);
          console.log(`RESULT proxy_no_credits=${noCredits}`);
          if (!response.ok || !marker || noCredits) process.exit(2);
          NODE

      - name: Publish proxy verification status
        if: always()
        uses: actions/github-script@v7
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            const success = process.env.VERIFY_OUTCOME === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'chat-v2/openclaw-proxy-host',
              description: success ? 'Private OpenClaw bridge proxy verified' : 'Private OpenClaw bridge proxy verification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
