name: Diagnose OpenClaw private tunnel

on:
  pull_request:
    paths:
      - '.github/workflows/openclaw-main-model-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probe real OpenClaw main through private reverse tunnel
        shell: bash
        env:
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${OPENCLAW_GATEWAY_TOKEN:-}" ]]
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          status="$(curl --silent --show-error --max-time 120 \
            -D "$tmp/headers" -o "$tmp/body" -w '%{http_code}' \
            -H "Authorization: Bearer ${OPENCLAW_GATEWAY_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"model":"openclaw/main","user":"chat-private-tunnel-diagnostic","messages":[{"role":"user","content":"Reply exactly OPENCLAW_PRIVATE_TUNNEL_OK"}],"stream":false}' \
            'http://127.0.0.1:18789/v1/chat/completions' || true)"
          STATUS="$status" BODY="$tmp/body" node <<'NODE'
          const fs = require('node:fs');
          const status = Number(process.env.STATUS || 0);
          const raw = fs.existsSync(process.env.BODY) ? fs.readFileSync(process.env.BODY, 'utf8') : '';
          let value = null;
          try { value = JSON.parse(raw); } catch {}
          const text = value?.choices?.[0]?.message?.content ?? '';
          const error = value?.error?.error?.message ?? value?.error?.message ?? value?.message ?? null;
          const marker = String(text).includes('OPENCLAW_PRIVATE_TUNNEL_OK');
          const noCredits = raw.toLowerCase().includes('no credits remaining');
          console.log(`RESULT http_status=${status}`);
          console.log(`RESULT private_tunnel_marker=${marker}`);
          console.log(`RESULT no_credits=${noCredits}`);
          if (error) console.log(`RESULT sanitized_error=${String(error).slice(0, 220).replace(/\s+/g, ' ')}`);
          if (status !== 200 || !marker || noCredits) process.exitCode = 2;
          NODE
