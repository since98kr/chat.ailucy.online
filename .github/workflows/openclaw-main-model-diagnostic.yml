name: Diagnose OpenClaw private tunnel

on:
  pull_request:
    paths:
      - '.github/workflows/openclaw-main-model-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probe real OpenClaw main through host private reverse tunnel
        shell: bash
        env:
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          status="$(curl -sS --max-time 120 -o "$tmp" -w '%{http_code}' \
            -H "Authorization: Bearer ${OPENCLAW_GATEWAY_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"model":"openclaw/main","user":"chat-private-host-diagnostic","messages":[{"role":"user","content":"Reply exactly OPENCLAW_PRIVATE_HOST_OK"}],"stream":false}' \
            'http://127.0.0.1:18789/v1/chat/completions' || true)"
          STATUS="$status" BODY="$tmp" node <<'NODE'
          const fs = require('node:fs');
          const raw = fs.readFileSync(process.env.BODY, 'utf8');
          const ok = Number(process.env.STATUS) === 200 && raw.includes('OPENCLAW_PRIVATE_HOST_OK') && !raw.toLowerCase().includes('no credits remaining');
          console.log(`RESULT host_http=${process.env.STATUS}`);
          console.log(`RESULT host_marker=${raw.includes('OPENCLAW_PRIVATE_HOST_OK')}`);
          console.log(`RESULT host_no_credits=${raw.toLowerCase().includes('no credits remaining')}`);
          if (!ok) process.exit(2);
          NODE

      - name: Probe real OpenClaw main from running Chat staging container
        shell: bash
        env:
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          docker inspect chat-v2-staging >/dev/null
          docker exec \
            -e OPENCLAW_GATEWAY_TOKEN="${OPENCLAW_GATEWAY_TOKEN}" \
            chat-v2-staging node --input-type=module - <<'NODE'
          const response = await fetch('http://host.docker.internal:18789/v1/chat/completions', {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.OPENCLAW_GATEWAY_TOKEN}`,
              'content-type': 'application/json',
            },
            body: JSON.stringify({
              model: 'openclaw/main',
              user: 'chat-private-container-diagnostic',
              messages: [{ role: 'user', content: 'Reply exactly OPENCLAW_PRIVATE_CONTAINER_OK' }],
              stream: false,
            }),
          });
          const raw = await response.text();
          const noCredits = raw.toLowerCase().includes('no credits remaining');
          const marker = raw.includes('OPENCLAW_PRIVATE_CONTAINER_OK');
          console.log(`RESULT container_http=${response.status}`);
          console.log(`RESULT container_marker=${marker}`);
          console.log(`RESULT container_no_credits=${noCredits}`);
          if (!response.ok || !marker || noCredits) process.exit(2);
          NODE
