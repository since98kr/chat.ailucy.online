name: Diagnose OpenClaw private tunnel

on:
  pull_request:
    paths:
      - '.github/workflows/openclaw-main-model-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Inspect host and Docker ingress geometry
        shell: bash
        run: |
          set -euo pipefail
          echo "RESULT socat=$(command -v socat || true)"
          echo "RESULT systemd_user=$(systemctl --user is-system-running 2>/dev/null || true)"
          echo 'RESULT host_listener:'
          ss -ltnp 'sport = :18789' || true
          echo 'RESULT bridge_gateway:'
          docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}'
          echo 'RESULT hermes_gateway:'
          docker network inspect hermes_default --format '{{(index .IPAM.Config 0).Gateway}}'
          echo 'RESULT container_host_mapping:'
          docker exec chat-v2-staging getent hosts host.docker.internal || true
          echo 'RESULT container_health:'
          docker exec chat-v2-staging node -e "fetch('http://host.docker.internal:18789/health').then(async r=>{console.log('http='+r.status);process.exit(r.ok?0:2)}).catch(e=>{console.log('error='+e.code);process.exit(3)})" || true

      - name: Confirm host OpenClaw route still succeeds
        shell: bash
        env:
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          status="$(curl -sS --max-time 120 -o "$tmp" -w '%{http_code}' \
            -H "Authorization: Bearer ${OPENCLAW_GATEWAY_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"model":"openclaw/main","user":"chat-private-host-diagnostic","messages":[{"role":"user","content":"Reply exactly OPENCLAW_PRIVATE_HOST_OK"}],"stream":false}' \
            'http://127.0.0.1:18789/v1/chat/completions' || true)"
          STATUS="$status" BODY="$tmp" node <<'NODE'
          const fs = require('node:fs');
          const raw = fs.readFileSync(process.env.BODY, 'utf8');
          const ok = Number(process.env.STATUS) === 200 && raw.includes('OPENCLAW_PRIVATE_HOST_OK') && !raw.toLowerCase().includes('no credits remaining');
          console.log(`RESULT host_http=${process.env.STATUS}`);
          console.log(`RESULT host_marker=${raw.includes('OPENCLAW_PRIVATE_HOST_OK')}`);
          console.log(`RESULT host_no_credits=${raw.toLowerCase().includes('no credits remaining')}`);
          if (!ok) process.exit(2);
          NODE
