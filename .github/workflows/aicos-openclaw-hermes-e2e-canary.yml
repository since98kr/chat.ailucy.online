name: AICOS OpenClaw Hermes E2E canary

on:
  push:
    branches:
      - test/aicos-relay-gateway-bridge
    paths:
      - .github/workflows/aicos-openclaw-hermes-e2e-canary.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: aicos-openclaw-hermes-e2e-canary
  cancel-in-progress: false

jobs:
  e2e:
    if: ${{ github.actor == 'since98kr' }}
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed relay candidate
        uses: actions/checkout@v4
        with:
          ref: 87b3a4466d42b1366fffae0f27b039efafab862f
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact relay candidate source
        run: |
          test "$(git rev-parse HEAD)" = "87b3a4466d42b1366fffae0f27b039efafab862f"
          node --check scripts/aicos-relay-v1.mjs
          node --check scripts/aicos-openclaw-relay-handler.mjs
          node --check scripts/aicos-hermes-relay-handler.mjs
          node --test tests/aicos-relay-v1.test.mjs
          node --test tests/aicos-hermes-relay.test.mjs
      - name: Run OpenClaw -> Hermes -> OpenClaw durable relay cycle
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENCLAW_GATEWAY_BASE_URL: ${{ vars.OPENCLAW_GATEWAY_BASE_URL }}
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ vars.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          LETTA_OPENCLAW_AGENT_TARGET: ${{ vars.LETTA_OPENCLAW_AGENT_TARGET }}
          HERMES_BASE_URL: ${{ vars.HERMES_BASE_URL }}
          HERMES_CHAT_PATH: ${{ vars.HERMES_CHAT_PATH }}
          HERMES_AGENT_ID: ${{ vars.HERMES_AGENT_ID }}
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
          HERMES_PROTOCOL: ${{ vars.HERMES_PROTOCOL }}
          HERMES_MODEL_MAP_JSON: ${{ vars.HERMES_MODEL_MAP_JSON }}
        run: |
          set -Eeuo pipefail
          umask 077
          if [[ "${HERMES_BASE_URL}" == *"host.docker.internal"* ]]; then
            docker_gateway="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
            [[ -n "${docker_gateway}" ]] || { echo 'Docker bridge gateway unavailable' >&2; exit 1; }
            export HERMES_BASE_URL="${HERMES_BASE_URL/host.docker.internal/${docker_gateway}}"
          fi

          echo 'phase=openclaw-dispatch'
          node scripts/aicos-openclaw-relay-handler.mjs sweep
          echo 'phase=hermes-consume'
          node scripts/aicos-hermes-relay-handler.mjs sweep
          echo 'phase=openclaw-result-consume'
          node scripts/aicos-openclaw-relay-handler.mjs sweep

          node --input-type=module <<'NODE'
          const issueNumber = 121;
          const taskId = 'aicos-114-openclaw-hermes-e2e-001';
          const marker = '<!-- aicos-agent-relay:v1:result -->';
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/issues/${issueNumber}/comments?per_page=100`, {
            headers: {
              accept: 'application/vnd.github+json',
              authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              'x-github-api-version': '2022-11-28'
            }
          });
          if (!response.ok) throw new Error(`GitHub comments failed: ${response.status}`);
          const comments = await response.json();
          const results = [];
          for (const comment of comments) {
            if (typeof comment.body !== 'string' || !comment.body.includes(marker)) continue;
            const match = comment.body.slice(comment.body.indexOf(marker) + marker.length).match(/```json\s*([\s\S]*?)\s*```/i);
            if (!match) continue;
            try { results.push(JSON.parse(match[1])); } catch {}
          }
          const parentPass = results.find((r) => r.taskId === taskId && r.agent === 'openclaw' && ['PASS','PASS_WITH_NOTE','PARTIAL_PASS'].includes(r.status));
          if (!parentPass) throw new Error('terminal OpenClaw parent PASS not found');
          console.log(JSON.stringify({
            parentTaskId: taskId,
            parentStatus: parentPass.status,
            openclawHermesRoundTrip: true,
            secretValuePrinted: false
          }));
          NODE
