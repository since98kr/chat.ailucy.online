name: Sync PR 205 with current main

on:
  push:
    branches:
      - claude/add-theia-agent-relay-participant-20260902

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[pr205-main-synced]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main and remove this worker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name since98kr
          git config user.email since98kr@gmail.com
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/pr205-sync-main.yml
          git commit -m "chore: sync Claude participant with current main [pr205-main-synced]"
          git push origin HEAD:claude/add-theia-agent-relay-participant-20260902
