name: Hermes profile recovery metadata

on:
  push:
    branches:
      - lucy/hermes-profile-recovery-exec-20260924

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-recovery-metadata
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        profile: [gemma, lynn, xixi]
    steps:
      - name: Probe profile metadata through default Hermes service user
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
          PROFILE: ${{ matrix.profile }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          profile=os.environ["PROFILE"]
          prompt=f"""AUTHORIZED READ-ONLY LOCAL PROBE. Use your terminal tool on this host as the current Hermes service user. Do not modify anything.
          Read only $HOME/.hermes/profiles/{profile}/.env and return exactly one compact JSON object.
          Allowed cleartext keys: API_SERVER_ENABLED, API_SERVER_HOST, API_SERVER_PORT, API_SERVER_MODEL_NAME, LLM_MODEL, MODEL, MODEL_NAME, LLM_PROVIDER, PROVIDER.
          For API_SERVER_KEY, OPENROUTER_API_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY, DEEPSEEK_API_KEY, LLM_API_KEY return only boolean set/unset, NEVER values.
          Also return exists boolean. Do not inspect unrelated files. Output JSON only."""
          payload=json.dumps({"model":"hermes-agent","messages":[{"role":"user","content":prompt}],"stream":False}).encode()
          req=urllib.request.Request(
              "http://172.17.0.1:8642/v1/chat/completions",
              data=payload,
              headers={
                  "Authorization":"Bearer "+os.environ["HERMES_API_KEY"],
                  "Content-Type":"application/json",
                  "User-Agent":"Lucy-CDL-profile-metadata-"+profile
              },
              method="POST")
          with urllib.request.urlopen(req,timeout=75) as r:
              raw=json.load(r)
          ans=raw.get("choices",[{}])[0].get("message",{}).get("content","")
          a=ans.find("{"); b=ans.rfind("}")
          if a<0 or b<a: raise SystemExit("no JSON")
          obj=json.loads(ans[a:b+1])
          safe={"profile":profile,"exists":bool(obj.get("exists",False))}
          allowed=("API_SERVER_ENABLED","API_SERVER_HOST","API_SERVER_PORT","API_SERVER_MODEL_NAME","LLM_MODEL","MODEL","MODEL_NAME","LLM_PROVIDER","PROVIDER")
          for k in allowed:
              safe[k]=str(obj.get(k,""))[:240]
          creds=obj.get("credentialSet") or {}
          safe["credentialSet"]={k:bool(creds.get(k,False)) for k in ("API_SERVER_KEY","OPENROUTER_API_KEY","ANTHROPIC_API_KEY","OPENAI_API_KEY","DEEPSEEK_API_KEY","LLM_API_KEY")}
          print(json.dumps(safe,sort_keys=True))
          PY

