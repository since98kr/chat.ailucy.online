name: AICOS relay OpenClaw outbound canary

on:
  push:
    branches:
      - test/aicos-relay-gateway-bridge
    paths:
      - .github/workflows/aicos-relay-openclaw-outbound-canary.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: aicos-relay-openclaw-outbound-canary
  cancel-in-progress: false

jobs:
  dispatch:
    if: ${{ github.actor == 'since98kr' }}
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 15
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ask OpenClaw to select downstream endpoint and publish child Work Order
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PARENT_ISSUE: "118"
          OPENCLAW_GATEWAY_BASE_URL: ${{ vars.OPENCLAW_GATEWAY_BASE_URL }}
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ vars.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          LETTA_OPENCLAW_AGENT_TARGET: ${{ vars.LETTA_OPENCLAW_AGENT_TARGET }}
        run: |
          set -Eeuo pipefail
          umask 077
          node --input-type=module <<'NODE'
          const workMarker = '<!-- aicos-agent-relay:v1:work-order -->';
          const resultMarker = '<!-- aicos-agent-relay:v1:result -->';
          const repo = process.env.GH_REPO;
          const parentIssue = Number(process.env.PARENT_ISSUE);
          const ghToken = process.env.GH_TOKEN || '';
          const gatewayBase = (process.env.OPENCLAW_GATEWAY_BASE_URL || '').replace(/\/$/, '');
          const gatewayToken = process.env.OPENCLAW_GATEWAY_TOKEN || '';
          const target = process.env.LETTA_OPENCLAW_AGENT_TARGET || '';
          const parentTaskId = 'aicos-114-openclaw-outbound-canary-001';
          const childTaskId = 'aicos-114-openclaw-outbound-canary-001:chatgpt-001';
          const exactDecision = {
            action: 'DISPATCH',
            targetAgent: 'chatgpt',
            childTaskId,
            requestToken: 'CHATGPT_RELAY_CHILD_OK'
          };

          function fail(message) { throw new Error(message); }
          function secretLike(value) {
            const text = JSON.stringify(value);
            return [
              /-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----/i,
              /\bBearer\s+[A-Za-z0-9._~+\/=:-]{12,}/i,
              /\bgithub_pat_[A-Za-z0-9_]{20,}/i,
              /\bgh[pousr]_[A-Za-z0-9]{20,}/i,
              /\bsk-[A-Za-z0-9_-]{16,}/i
            ].some((re) => re.test(text));
          }
          async function gh(path, options = {}) {
            const response = await fetch('https://api.github.com' + path, {
              ...options,
              headers: {
                accept: 'application/vnd.github+json',
                authorization: 'Bearer ' + ghToken,
                'x-github-api-version': '2022-11-28',
                'content-type': 'application/json',
                ...(options.headers || {})
              }
            });
            if (!response.ok) fail('GitHub API ' + response.status + ' ' + response.statusText);
            return response.status === 204 ? null : response.json();
          }
          function parseEnvelope(body) {
            if (typeof body !== 'string' || !body.includes(workMarker)) fail('parent Work Order marker missing');
            const match = body.slice(body.indexOf(workMarker) + workMarker.length).match(/```json\s*([\s\S]*?)\s*```/i);
            if (!match) fail('parent Work Order JSON missing');
            const value = JSON.parse(match[1]);
            if (value.schemaVersion !== 'aicos.agent-relay/v1' || value.kind !== 'work_order') fail('invalid parent relay envelope');
            if (value.taskId !== parentTaskId || value.sourceAgent !== 'chatgpt' || value.targetAgent !== 'openclaw') fail('unexpected parent relay identity');
            if (!Array.isArray(value.allowedScope) || !Array.isArray(value.forbiddenScope)) fail('parent scope missing');
            for (const gate of ['merge','productionDeploy','secretChange','destructiveDb','liveAction']) {
              if (value.approvals?.[gate] !== 'denied') fail('all canary gates must be denied');
            }
            if (secretLike(value)) fail('secret-shaped parent rejected');
            return value;
          }
          function render(marker, value) {
            return marker + '\n\n```json\n' + JSON.stringify(value, null, 2) + '\n```';
          }
          async function findChild() {
            for (let page = 1; page <= 10; page += 1) {
              const issues = await gh(`/repos/${repo}/issues?state=all&per_page=100&page=${page}&sort=created&direction=desc`);
              for (const issue of issues) {
                if (issue.pull_request || typeof issue.body !== 'string' || !issue.body.includes(workMarker)) continue;
                if (issue.body.includes(`\"taskId\": \"${childTaskId}\"`)) return issue;
              }
              if (issues.length < 100) break;
            }
            return null;
          }

          if (!ghToken || !gatewayToken) fail('required relay credential unavailable');
          const gatewayUrl = new URL(gatewayBase || 'https://invalid.invalid');
          if (gatewayUrl.protocol !== 'https:' || gatewayUrl.hostname !== 'gateway.ailucy.online') fail('unexpected Gateway endpoint');
          if (!/^(?:openclaw[/:]|agent:)[A-Za-z0-9._:-]+$/.test(target)) fail('OpenClaw target unavailable');

          const parent = await gh(`/repos/${repo}/issues/${parentIssue}`);
          const parentWork = parseEnvelope(parent.body || '');
          let child = await findChild();

          if (!child) {
            const prompt = [
              'You are OpenClaw + persistent Letta Lucy acting as the primary orchestrator.',
              'You received a validated sanitized aicos.agent-relay/v1 Work Order.',
              'No tools, shell, host access, memory mutation, deployment, credentials, or live action are allowed.',
              'For this fixed relay canary, choose the downstream advisory endpoint required by the Work Order.',
              'Return exactly one JSON object, with no markdown or extra text, equal to:',
              JSON.stringify(exactDecision)
            ].join(' ');
            const response = await fetch(gatewayBase + '/v1/chat/completions', {
              method: 'POST',
              headers: {
                authorization: 'Bearer ' + gatewayToken,
                'content-type': 'application/json',
                'cf-access-client-id': process.env.CF_ACCESS_CLIENT_ID || '',
                'cf-access-client-secret': process.env.CF_ACCESS_CLIENT_SECRET || '',
                'x-openclaw-session-key': 'aicos-relay:' + parentTaskId + ':dispatch:run-' + process.env.GITHUB_RUN_ID
              },
              body: JSON.stringify({model: target, stream: false, messages: [{role:'user', content:prompt}]}),
              signal: AbortSignal.timeout(600000)
            });
            let payload = null;
            try { payload = await response.json(); } catch {}
            let reply = payload?.choices?.[0]?.message?.content;
            if (Array.isArray(reply)) reply = reply.map((p) => typeof p === 'string' ? p : p?.text || '').join('');
            if (typeof reply !== 'string') reply = '';
            let decision = null;
            try { decision = JSON.parse(reply.trim()); } catch {}
            const exact = decision && JSON.stringify(decision) === JSON.stringify(exactDecision);
            if (!response.ok || !exact) {
              const blocked = {
                schemaVersion:'aicos.agent-relay/v1', kind:'result', taskId:parentTaskId,
                agent:'openclaw', status:'BLOCKED', observedAt:new Date().toISOString(),
                summary:'OpenClaw did not return the exact bounded downstream dispatch decision.',
                evidence:['gateway:http:' + response.status, 'gateway:dispatch-decision-match:false'],
                blockedReason:'OPENCLAW_DISPATCH_DECISION_MISMATCH'
              };
              await gh(`/repos/${repo}/issues/${parentIssue}/comments`, {method:'POST', body:JSON.stringify({body:render(resultMarker, blocked)})});
              fail('OpenClaw dispatch decision mismatch');
            }

            const childWork = {
              schemaVersion:'aicos.agent-relay/v1',
              kind:'work_order',
              taskId:childTaskId,
              createdAt:new Date().toISOString(),
              sourceAgent:'openclaw',
              targetAgent:'chatgpt',
              objective:'Return exactly CHATGPT_RELAY_CHILD_OK as a sanitized advisory relay canary result.',
              allowedScope:['read this validated child Work Order','return the exact advisory canary token as sanitized evidence'],
              forbiddenScope:['shell or host execution','merge or deploy','secret or credential access/change','live external action'],
              expectedOutput:['one canonical chatgpt Result correlated to this child taskId'],
              approvals:{...parentWork.approvals},
              idempotencyKey:childTaskId + '-v1'
            };
            if (secretLike(childWork)) fail('constructed child contains secret-shaped material');
            child = await gh(`/repos/${repo}/issues`, {
              method:'POST',
              body:JSON.stringify({
                title:`[AGENT-RELAY][chatgpt] ${childTaskId}`,
                body:render(workMarker, childWork)
              })
            });
          }

          const running = {
            schemaVersion:'aicos.agent-relay/v1', kind:'result', taskId:parentTaskId,
            agent:'openclaw', status:'RUNNING', observedAt:new Date().toISOString(),
            summary:'OpenClaw selected chatgpt and dispatched the bounded child Work Order through the relay.',
            evidence:[`relay:child-issue:${child.number}`, `relay:child-task:${childTaskId}`, 'gateway:dispatch-decision-match:true'],
            nextAction:'Await the correlated chatgpt child Result, then return it to OpenClaw for parent completion.'
          };
          const comments = await gh(`/repos/${repo}/issues/${parentIssue}/comments?per_page=100`);
          const runningExists = comments.some((c) => typeof c.body === 'string' && c.body.includes(resultMarker) && c.body.includes(`relay:child-task:${childTaskId}`));
          if (!runningExists) {
            await gh(`/repos/${repo}/issues/${parentIssue}/comments`, {method:'POST', body:JSON.stringify({body:render(resultMarker, running)})});
          }
          console.log(JSON.stringify({parentTaskId, childTaskId, childIssue:child.number, dispatchedBy:'openclaw', resultPublished:true, secretValuePrinted:false}));
          NODE
