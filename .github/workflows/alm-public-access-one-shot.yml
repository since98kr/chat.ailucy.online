name: One-shot AI Live Map public Access exception

on:
  push:
    branches:
      - ops/alm-public-access-20260917
    paths:
      - .github/workflows/alm-public-access-one-shot.yml

permissions:
  contents: read

jobs:
  diagnose-auth:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 10
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Diagnose available Cloudflare auth without exposing credentials
        shell: bash
        run: |
          set -u
          echo "RESULT api_token_configured=$([[ -n "${CF_API_TOKEN:-}" ]] && echo true || echo false)"
          echo "RESULT account_id_configured=$([[ -n "${CF_ACCOUNT_ID:-}" ]] && echo true || echo false)"

          if [[ -n "${CF_API_TOKEN:-}" ]]; then
            code="$(curl -sS -o /tmp/cf-token-verify.json -w '%{http_code}' -H "Authorization: Bearer ${CF_API_TOKEN}" https://api.cloudflare.com/client/v4/user/tokens/verify || true)"
            echo "RESULT api_token_verify_http=${code}"
            rm -f /tmp/cf-token-verify.json
          fi

          echo "RESULT cloudflared_present=$([[ -x "$(command -v cloudflared 2>/dev/null || true)" ]] && echo true || echo false)"
          echo "RESULT wrangler_present=$([[ -x "$(command -v wrangler 2>/dev/null || true)" ]] && echo true || echo false)"

          cert="$HOME/.cloudflared/cert.pem"
          echo "RESULT cloudflared_cert_present=$([[ -r "$cert" ]] && echo true || echo false)"
          if command -v cloudflared >/dev/null 2>&1 && [[ -r "$cert" ]]; then
            if cloudflared tunnel list --output json >/tmp/cf-tunnels.json 2>/tmp/cf-tunnels.err; then
              echo "RESULT cloudflared_tunnel_auth=true count=$(jq 'length' /tmp/cf-tunnels.json 2>/dev/null || echo unknown)"
            else
              echo 'RESULT cloudflared_tunnel_auth=false'
            fi
            rm -f /tmp/cf-tunnels.json /tmp/cf-tunnels.err
          fi

          candidates=(
            "$HOME/.config/.wrangler/config/default.toml"
            "$HOME/.wrangler/config/default.toml"
            "$HOME/.config/wrangler/config/default.toml"
          )
          found=''
          for f in "${candidates[@]}"; do
            if [[ -r "$f" ]]; then
              found="$f"
              echo 'RESULT wrangler_oauth_config_present=true'
              python3 - "$f" <<'PY'
          import re, sys
          p=sys.argv[1]
          keys=[]
          for line in open(p, encoding='utf-8', errors='ignore'):
              m=re.match(r'\s*([A-Za-z0-9_.-]+)\s*=', line)
              if m:
                  keys.append(m.group(1))
          safe=[k for k in keys if k.lower() in {'oauth_token','refresh_token','expiration_time','scopes'}]
          print('RESULT wrangler_oauth_keys=' + ','.join(safe))
          PY
              break
            fi
          done
          [[ -n "$found" ]] || echo 'RESULT wrangler_oauth_config_present=false'

          if command -v wrangler >/dev/null 2>&1; then
            if wrangler whoami >/tmp/whoami.out 2>/tmp/whoami.err; then
              echo 'RESULT wrangler_whoami=true'
            else
              echo 'RESULT wrangler_whoami=false'
            fi
            rm -f /tmp/whoami.out /tmp/whoami.err
          fi
