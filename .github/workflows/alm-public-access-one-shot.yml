name: One-shot AI Live Map public Access exception

on:
  push:
    branches:
      - ops/alm-public-access-20260917
    paths:
      - .github/workflows/alm-public-access-one-shot.yml

permissions:
  contents: read

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID_CONFIGURED: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_DOMAIN: alm.ailucy.online
      ORIGIN_CERT: /home/since98kr/.cloudflared/cert.pem
    steps:
      - name: Apply exact-host Access bypass using existing Cloudflare account certificate
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          helper="alm-cf-cert-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker rm -f "$helper" >/dev/null 2>&1 || true; rm -rf "$tmp"; }
          trap cleanup EXIT
          umask 077

          command -v docker >/dev/null
          command -v python3 >/dev/null
          command -v curl >/dev/null
          command -v jq >/dev/null

          docker create --name "$helper" \
            --mount "type=bind,source=${ORIGIN_CERT},target=/run/cloudflare/cert.pem,readonly" \
            cloudflare/cloudflared:latest version >/dev/null
          docker cp "$helper:/run/cloudflare/cert.pem" "$tmp/cert.pem"
          [[ -s "$tmp/cert.pem" ]]

          python3 - "$tmp/cert.pem" "$tmp/api-token" "$tmp/account-id" "$tmp/zone-id" <<'PY'
          import base64, json, re, sys, os
          src, token_path, account_path, zone_path = sys.argv[1:]
          text = open(src, encoding='utf-8', errors='strict').read()
          m = re.search(r'-----BEGIN ARGO TUNNEL TOKEN-----\s*(.*?)\s*-----END ARGO TUNNEL TOKEN-----', text, re.S)
          if not m:
              raise SystemExit('origin certificate has no ARGO TUNNEL TOKEN block')
          raw = base64.b64decode(re.sub(r'\s+', '', m.group(1)), validate=True)
          data = json.loads(raw.decode('utf-8'))
          token, account, zone = data.get('apiToken'), data.get('accountID'), data.get('zoneID')
          if not all(isinstance(x, str) and x for x in (token, account, zone)):
              raise SystemExit('origin certificate token payload is incomplete')
          for path, value in ((token_path, token), (account_path, account), (zone_path, zone)):
              open(path, 'w', encoding='utf-8').write(value)
              os.chmod(path, 0o600)
          print('RESULT origin_cert_decoded=true fields=zoneID,accountID,apiToken')
          PY

          CF_API_TOKEN="$(cat "$tmp/api-token")"
          CF_ACCOUNT_ID="$(cat "$tmp/account-id")"
          CF_ZONE_ID="$(cat "$tmp/zone-id")"
          [[ -n "$CF_API_TOKEN" && -n "$CF_ACCOUNT_ID" && -n "$CF_ZONE_ID" ]]
          if [[ -n "${CF_ACCOUNT_ID_CONFIGURED:-}" && "$CF_ACCOUNT_ID_CONFIGURED" != "$CF_ACCOUNT_ID" ]]; then
            echo 'ERROR configured account ID does not match origin certificate account'
            exit 2
          fi

          request() {
            local method="$1" path="$2" body="${3:-}" out="$4"
            local args=(--silent --show-error --output "$out" --write-out '%{http_code}'
              --request "$method"
              --header "Authorization: Bearer ${CF_API_TOKEN}"
              --header 'Content-Type: application/json')
            [[ -z "$body" ]] || args+=(--data "$body")
            curl "${args[@]}" "https://api.cloudflare.com/client/v4${path}" || true
          }

          verify_code="$(request GET '/user/tokens/verify' '' "$tmp/verify.json")"
          echo "RESULT origin_cert_token_verify_http=${verify_code}"
          [[ "$verify_code" = 200 ]]

          # Account scope is preferred. The cloudflared origin certificate is
          # historically zone-scoped, so use Cloudflare's supported zone form
          # only when account-scope write is rejected.
          scope="accounts/${CF_ACCOUNT_ID}"
          apps_code="$(request GET "/${scope}/access/apps?per_page=100" '' "$tmp/apps.json")"
          echo "RESULT account_access_apps_http=${apps_code}"
          [[ "$apps_code" = 200 && "$(jq -r '.success // false' "$tmp/apps.json")" = true ]]
          exact_count="$(jq -r --arg d "$TARGET_DOMAIN" '[.result[]? | select(.domain == $d)] | length' "$tmp/apps.json")"
          [[ "$exact_count" -le 1 ]] || { echo 'ERROR multiple exact-host Access apps exist'; exit 4; }
          app_id="$(jq -r --arg d "$TARGET_DOMAIN" '[.result[]? | select(.domain == $d)][0].id // empty' "$tmp/apps.json")"

          app_payload="$(jq -nc --arg n 'AI Live Map Public Demo' --arg d "$TARGET_DOMAIN" '{name:$n,domain:$d,type:"self_hosted",session_duration:"24h",app_launcher_visible:false}')"
          if [[ -z "$app_id" ]]; then
            create_code="$(request POST "/${scope}/access/apps" "$app_payload" "$tmp/app-create.json")"
            echo "RESULT account_access_app_create_http=${create_code}"
            if [[ "$create_code" != 200 && "$create_code" != 201 ]]; then
              scope="zones/${CF_ZONE_ID}"
              zone_list_code="$(request GET "/${scope}/access/apps?per_page=100" '' "$tmp/zone-apps.json")"
              echo "RESULT zone_access_apps_http=${zone_list_code}"
              [[ "$zone_list_code" = 200 && "$(jq -r '.success // false' "$tmp/zone-apps.json")" = true ]] || {
                jq -r '.errors[]? | "ERROR zone_apps code=\(.code) msg=\(.message)"' "$tmp/zone-apps.json" | head -5; exit 5; }
              zone_exact_count="$(jq -r --arg d "$TARGET_DOMAIN" '[.result[]? | select(.domain == $d)] | length' "$tmp/zone-apps.json")"
              [[ "$zone_exact_count" -le 1 ]] || { echo 'ERROR multiple zone exact-host apps exist'; exit 6; }
              app_id="$(jq -r --arg d "$TARGET_DOMAIN" '[.result[]? | select(.domain == $d)][0].id // empty' "$tmp/zone-apps.json")"
              if [[ -z "$app_id" ]]; then
                zone_create_code="$(request POST "/${scope}/access/apps" "$app_payload" "$tmp/zone-app-create.json")"
                echo "RESULT zone_access_app_create_http=${zone_create_code}"
                if [[ "$zone_create_code" != 200 && "$zone_create_code" != 201 ]]; then
                  jq -r '.errors[]? | "ERROR zone_app_create code=\(.code) msg=\(.message)"' "$tmp/zone-app-create.json" | head -5
                  exit 7
                fi
                [[ "$(jq -r '.success // false' "$tmp/zone-app-create.json")" = true ]]
                app_id="$(jq -r '.result.id' "$tmp/zone-app-create.json")"
                echo 'RESULT exact_app_created=true scope=zone'
              else
                echo 'RESULT exact_app_created=false scope=zone'
              fi
            else
              [[ "$(jq -r '.success // false' "$tmp/app-create.json")" = true ]]
              app_id="$(jq -r '.result.id' "$tmp/app-create.json")"
              echo 'RESULT exact_app_created=true scope=account'
            fi
          else
            echo 'RESULT exact_app_created=false scope=account'
          fi

          policies_code="$(request GET "/${scope}/access/apps/${app_id}/policies" '' "$tmp/policies.json")"
          echo "RESULT policies_http=${policies_code}"
          [[ "$policies_code" = 200 && "$(jq -r '.success // false' "$tmp/policies.json")" = true ]]
          bypass_id="$(jq -r '[.result[]? | select(.decision == "bypass") | select(any(.include[]?; has("everyone")))][0].id // empty' "$tmp/policies.json")"

          if [[ -z "$bypass_id" ]]; then
            policy_payload='{"name":"AI Live Map public demo - bypass everyone","decision":"bypass","include":[{"everyone":{}}],"exclude":[],"require":[]}'
            policy_code="$(request POST "/${scope}/access/apps/${app_id}/policies" "$policy_payload" "$tmp/policy-create.json")"
            echo "RESULT bypass_create_http=${policy_code}"
            if [[ "$policy_code" != 200 && "$policy_code" != 201 ]]; then
              jq -r '.errors[]? | "ERROR policy_create code=\(.code) msg=\(.message)"' "$tmp/policy-create.json" | head -5
              exit 8
            fi
            [[ "$(jq -r '.success // false' "$tmp/policy-create.json")" = true ]]
            echo 'RESULT bypass_created=true'
          else
            echo 'RESULT bypass_created=false'
          fi

          final_code="$(request GET "/${scope}/access/apps/${app_id}/policies" '' "$tmp/final-policies.json")"
          [[ "$final_code" = 200 ]]
          final_bypass="$(jq -r '[.result[]? | select(.decision == "bypass") | select(any(.include[]?; has("everyone")))] | length' "$tmp/final-policies.json")"
          [[ "$final_bypass" -ge 1 ]]
          echo 'RESULT exact_app_present=true bypass_everyone_present=true'

      - name: Verify unauthenticated public endpoint from agentlucy
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          status=000
          location=''
          for _ in $(seq 1 15); do
            status="$(curl --silent --show-error --connect-timeout 5 --max-time 15 --max-redirs 0 -D "$tmp/headers" -o "$tmp/body" -w '%{http_code}' "https://${TARGET_DOMAIN}/" || true)"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$tmp/headers")"
            if [[ "$status" = 200 && "$location" != *cloudflareaccess.com* && "$location" != *'/cdn-cgi/access/login'* ]]; then break; fi
            sleep 2
          done
          title="$(grep -oEi '<title[^>]*>[^<]+' "$tmp/body" | head -1 | sed -E 's/<title[^>]*>//I' || true)"
          echo "RESULT public_http_status=${status}"
          echo "RESULT login_intercept_present=$([[ "$location" == *cloudflareaccess.com* || "$location" == *'/cdn-cgi/access/login'* ]] && echo true || echo false)"
          echo "RESULT title=${title:-none}"
          [[ "$status" = 200 ]]
          [[ "$location" != *cloudflareaccess.com* && "$location" != *'/cdn-cgi/access/login'* ]]
