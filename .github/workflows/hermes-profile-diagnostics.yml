name: Diagnose Hermes staging profiles

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Inspect Hermes profiles without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          echo '=== executable ==='
          command -v hermes || true
          hermes --version 2>/dev/null || true

          echo '=== profile directories ==='
          for profile in gemma lynn xixi; do
            envfile="$HOME/.hermes/profiles/$profile/.env"
            printf '%s: ' "$profile"
            if [[ -f "$envfile" ]]; then
              echo present
              awk -F= '
                /^(API_SERVER_ENABLED|API_SERVER_HOST|API_SERVER_PORT|API_SERVER_MODEL_NAME)=/ {print $1"="$2}
                /^(OPENROUTER_API_KEY|ANTHROPIC_API_KEY|OPENAI_API_KEY|DEEPSEEK_API_KEY|LLM_API_KEY)=/ {print $1"=<set:"(length($2)>0?"yes":"no")">"}
                /^(LLM_MODEL|MODEL|MODEL_NAME|LLM_PROVIDER|PROVIDER)=/ {print $1"="$2}
              ' "$envfile" | sort
            else
              echo missing
            fi
          done

          echo '=== listeners ==='
          ss -ltnp 2>/dev/null | awk 'NR==1 || /:(8642|8643|8644|8645)[[:space:]]/' || true

          echo '=== Hermes-related processes (arguments redacted to executable names only) ==='
          ps -eo pid=,comm= | awk 'tolower($2) ~ /hermes|python|uvicorn/ {print}' | head -50 || true

          echo '=== user services ==='
          systemctl --user list-units --type=service --all --no-pager 2>/dev/null | awk 'tolower($0) ~ /hermes|gemma|lynn|xixi/' || true

          echo '=== command help ==='
          for args in 'profile --help' 'serve --help' 'proxy --help' 'gateway --help'; do
            echo "--- hermes $args"
            timeout 10s hermes $args 2>&1 | sed -E 's/(key|token|secret|password)=[^[:space:]]+/\1=<redacted>/Ig' | head -120 || true
          done


      - name: Inspect Hermes host topology without reading secret values
        shell: bash
        run: |
          set -euo pipefail
          echo '=== runner identity ==='
          echo "user=$(id -un)"
          echo "home=$HOME"

          echo '=== system Hermes services ==='
          systemctl list-units --type=service --all --no-pager 2>/dev/null \
            | awk 'tolower($0) ~ /hermes|gemma|lynn|xixi/' || true
          systemctl list-unit-files --type=service --no-pager 2>/dev/null \
            | awk 'tolower($0) ~ /hermes|gemma|lynn|xixi/' || true

          echo '=== Hermes process owners and executable paths ==='
          for pid in $(pgrep -x hermes 2>/dev/null || true); do
            user=$(ps -o user= -p "$pid" | xargs || true)
            exe=$(readlink "/proc/$pid/exe" 2>/dev/null || echo '<unreadable>')
            cwd=$(readlink "/proc/$pid/cwd" 2>/dev/null || echo '<unreadable>')
            printf 'pid=%s user=%s exe=%s cwd=%s\n' "$pid" "$user" "$exe" "$cwd"
          done

          echo '=== Hermes homes/profile directory names only ==='
          for root in /home/*/.hermes /root/.hermes /opt/*/.hermes; do
            [[ -d "$root" ]] || continue
            echo "root=$root"
            if [[ -d "$root/profiles" ]]; then
              find "$root/profiles" -mindepth 1 -maxdepth 1 -type d -printf 'profile=%f\n' 2>/dev/null | sort || true
            else
              echo 'profiles=<missing-or-unreadable>'
            fi
          done

      - name: Inspect since98kr Hermes profile metadata read-only
        shell: bash
        run: |
          set -euo pipefail
          echo '=== system unit metadata ==='
          systemctl show hermes-gateway.service hermes-serve.service \
            -p Id -p User -p Group -p WorkingDirectory -p ExecStart -p EnvironmentFiles --no-pager 2>/dev/null \
            | sed -E 's/((KEY|TOKEN|SECRET|PASSWORD)[^= ]*=)[^ ;]*/\\1<redacted>/Ig' || true

          echo '=== existing sudo capability ==='
          if ! sudo -n -u since98kr true 2>/dev/null; then
            echo 'sudo-since98kr=unavailable'
            exit 0
          fi
          echo 'sudo-since98kr=available'

          sudo -n -u since98kr bash -lc '\
            set -euo pipefail; \
            echo "home=$HOME"; \
            echo "hermes_bin=$(command -v hermes 2>/dev/null || true)"; \
            hermes --version 2>/dev/null || true; \
            root="$HOME/.hermes"; \
            echo "root_exists=$([[ -d "$root" ]] && echo yes || echo no)"; \
            if [[ -d "$root/profiles" ]]; then \
              for p in gemma lynn xixi; do \
                envf="$root/profiles/$p/.env"; \
                echo "--- profile=$p env=$([[ -f "$envf" ]] && echo present || echo missing) ---"; \
                if [[ -f "$envf" ]]; then \
                  awk -F= '\''\
                    /^(API_SERVER_ENABLED|API_SERVER_HOST|API_SERVER_PORT|API_SERVER_MODEL_NAME)=/ {print $1"="$2} \
                    /^(API_SERVER_KEY|OPENROUTER_API_KEY|ANTHROPIC_API_KEY|OPENAI_API_KEY|DEEPSEEK_API_KEY|LLM_API_KEY)=/ {print $1"=<set:"(length($2)>0?"yes":"no")">"} \
                    /^(LLM_MODEL|MODEL|MODEL_NAME|LLM_PROVIDER|PROVIDER)=/ {print $1"="$2} \
                  '\'' "$envf" | sort; \
                fi; \
              done; \
            else \
              echo profiles=missing; \
            fi'

      - name: Inspect existing privilege and profile path metadata
        shell: bash
        run: |
          set -euo pipefail
          echo '=== sudo noninteractive policy ==='
          sudo -n -l 2>&1 | sed -E 's/((KEY|TOKEN|SECRET|PASSWORD)[^= ]*=)[^ ;]*/\\1<redacted>/Ig' || true

          echo '=== system unit definitions ==='
          systemctl cat hermes-gateway.service hermes-serve.service --no-pager 2>/dev/null \
            | sed -E 's/((KEY|TOKEN|SECRET|PASSWORD)[^= ]*=)[^ ;]*/\\1<redacted>/Ig' || true

          echo '=== profile path permission chain ==='
          for p in \
            /home/since98kr \
            /home/since98kr/.hermes \
            /home/since98kr/.hermes/profiles \
            /home/since98kr/.hermes/profiles/gemma \
            /home/since98kr/.hermes/profiles/lynn \
            /home/since98kr/.hermes/profiles/xixi; do
            if [[ -e "$p" ]]; then
              stat -c '%A %a %U %G %n' "$p" 2>/dev/null || true
            else
              echo "missing-or-inaccessible $p"
            fi
          done
          command -v namei >/dev/null 2>&1 && namei -l /home/since98kr/.hermes/profiles/gemma 2>/dev/null || true

      - name: Inspect Hermes service failure and sudo policy summary
        shell: bash
        run: |
          set -euo pipefail
          echo '=== sudo policy raw ==='
          sudo -n -l 2>&1 || true

          echo '=== hermes-gateway status ==='
          systemctl --no-pager --full status hermes-gateway.service 2>&1 | sed -n '1,80p' || true

          echo '=== hermes-gateway recent journal ==='
          journalctl -u hermes-gateway.service --since '10 minutes ago' --no-pager 2>/dev/null \
            | sed -E 's/((KEY|TOKEN|SECRET|PASSWORD)[^= ]*=)[^ ;]*/\\1<redacted>/Ig' \
            | tail -120 || true

          echo '=== hermes-serve status ==='
          systemctl --no-pager --full status hermes-serve.service 2>&1 | sed -n '1,60p' || true

      - name: Probe Hermes serve management surface read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error
          paths=['/health','/','/openapi.json','/docs','/api/health']
          for path in paths:
              url='http://127.0.0.1:9119'+path
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Lucy-CDL-readonly'})
                  with urllib.request.urlopen(req,timeout=5) as r:
                      body=r.read(12000).decode('utf-8','replace')
                      print(f'=== {path} HTTP {r.status} content-type={r.headers.get("content-type","")} ===')
                      if path == '/openapi.json':
                          print(body[:12000])
                      else:
                          print(body[:1200])
              except urllib.error.HTTPError as e:
                  print(f'=== {path} HTTP {e.code} ===')
                  print(e.read(1200).decode('utf-8','replace'))
              except Exception as e:
                  print(f'=== {path} {type(e).__name__}: {e} ===')
          PY

      - name: Ask default Hermes for bounded host profile inventory
        if: ${{ false }}
        shell: bash
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${HERMES_API_KEY:-}" ]]
          prompt_file="${RUNNER_TEMP}/hermes-profile-inventory-prompt.txt"
          response_file="${RUNNER_TEMP}/hermes-profile-inventory-response.json"
          cat >"${prompt_file}" <<'PROMPT'
          READ-ONLY HOST DIAGNOSTIC. You are the default Hermes Agent running on this host as the Hermes service user.

          Use your terminal tools to inspect the local Hermes installation. Do not modify files, services, profiles, credentials, config, permissions, or processes. Do not make network calls except local inspection commands.

          Inspect:
          1) id -un, HOME, Hermes CLI version;
          2) hermes profile list and hermes gateway list;
          3) whether profiles gemma, lynn, xixi exist under the real Hermes home;
          4) for each existing profile, report ONLY non-secret provider/model and API server metadata:
             API_SERVER_ENABLED, API_SERVER_HOST, API_SERVER_PORT, API_SERVER_MODEL_NAME;
             provider/model names from config;
             for credential variables report only boolean set/unset for API_SERVER_KEY, OPENROUTER_API_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY, DEEPSEEK_API_KEY, LLM_API_KEY.
             NEVER print any credential value.
          5) list profile-related backup/export candidates under ~/.hermes whose filenames indicate gemma, lynn, or xixi, paths only;
          6) list user-level/system service names related to Hermes profiles, names/status only.

          Return one compact JSON object and nothing else with:
          {
            "user": "...",
            "home": "...",
            "hermesVersion": "...",
            "profiles": {
              "gemma": {"exists":true/false,"provider":"","model":"","apiServerEnabled":"","apiServerHost":"","apiServerPort":"","apiServerModelName":"","credentialSet":{"API_SERVER_KEY":true/false,"OPENROUTER_API_KEY":true/false,"ANTHROPIC_API_KEY":true/false,"OPENAI_API_KEY":true/false,"DEEPSEEK_API_KEY":true/false,"LLM_API_KEY":true/false}},
              "lynn": {...},
              "xixi": {...}
            },
            "profileList": "...sanitized...",
            "gatewayList": "...sanitized...",
            "backupCandidates": ["path only"],
            "services": ["name/status only"]
          }
          PROMPT

          python3 - "${prompt_file}" "${response_file}" <<'PY'
          import json, os, sys, urllib.request
          prompt_path, out_path = sys.argv[1:3]
          prompt = open(prompt_path, encoding='utf-8').read()
          payload = json.dumps({
              "model":"hermes-agent",
              "messages":[{"role":"user","content":prompt}],
              "stream":False
          }).encode()
          req = urllib.request.Request(
              "http://172.17.0.1:8642/v1/chat/completions",
              data=payload,
              headers={
                  "Authorization":"Bearer "+os.environ["HERMES_API_KEY"],
                  "Content-Type":"application/json",
                  "User-Agent":"Lucy-CDL-hermes-host-inventory"
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=180) as r:
              raw = json.load(r)
          text = raw.get("choices",[{}])[0].get("message",{}).get("content","")
          # Keep the raw model answer out of logs. Parse the requested JSON and
          # re-emit only approved fields.
          start=text.find("{"); end=text.rfind("}")
          if start < 0 or end < start:
              raise SystemExit("Hermes inventory did not return JSON")
          obj=json.loads(text[start:end+1])
          safe={
            "user":obj.get("user",""),
            "home":obj.get("home",""),
            "hermesVersion":obj.get("hermesVersion",""),
            "profiles":obj.get("profiles",{}),
            "profileList":obj.get("profileList",""),
            "gatewayList":obj.get("gatewayList",""),
            "backupCandidates":obj.get("backupCandidates",[]),
            "services":obj.get("services",[]),
          }
          # Reject suspicious secret-like long values before printing.
          def walk(v,path=""):
              if isinstance(v,dict):
                  for k,x in v.items():
                      kl=k.lower()
                      if any(s in kl for s in ("key","token","secret","password")) and not isinstance(x,bool):
                          raise SystemExit(f"unsafe inventory field: {path}/{k}")
                      walk(x,path+"/"+k)
              elif isinstance(v,list):
                  for i,x in enumerate(v): walk(x,path+f"/{i}")
              elif isinstance(v,str) and len(v)>1800:
                  raise SystemExit(f"oversized inventory string: {path}")
          walk(safe)
          open(out_path,"w",encoding="utf-8").write(json.dumps(safe,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(safe,ensure_ascii=False,indent=2))
          PY

      - name: Discover Hermes serve API routes read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.request, urllib.parse
          base='http://127.0.0.1:9119'
          html=urllib.request.urlopen(base+'/',timeout=5).read().decode('utf-8','replace')
          print('=== index script refs ===')
          refs=[]
          for m in re.finditer(r'<script[^>]+src=["\\\']([^"\\\']+)', html):
              src=m.group(1)
              refs.append(src)
              print(src)
          routes=set()
          print('=== discovered /api/ route strings ===')
          for src in refs[:20]:
              url=urllib.parse.urljoin(base+'/',src)
              try:
                  body=urllib.request.urlopen(url,timeout=10).read(5_000_000).decode('utf-8','replace')
              except Exception as e:
                  print('fetch-failed',src,type(e).__name__,str(e)); continue
              for x in re.findall(r'/api/[A-Za-z0-9_?&=./:{}-]+', body):
                  routes.add(x)
          for route in sorted(routes): print(route)
          PY

      - name: Inspect staging map coverage
        shell: bash
        env:
          MODEL_MAP: ${{ vars.HERMES_MODEL_MAP_JSON }}
          URL_MAP: ${{ vars.HERMES_BASE_URL_MAP_JSON }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          required=['[Hermes] Lucy','Xixi','Lynn','Gemma']
          for label,raw in [('model',os.getenv('MODEL_MAP','')),('url',os.getenv('URL_MAP',''))]:
              try:
                  m=json.loads(raw) if raw.strip() else {}
              except Exception:
                  print(f'{label}: invalid-json')
                  continue
              print(f"{label} keys: {', '.join(sorted(m)) if m else '<none>'}")
              for ident in required:
                  print(f"{label} {ident}: {'present' if isinstance(m.get(ident),str) and m[ident].strip() else 'missing'}")
          PY
