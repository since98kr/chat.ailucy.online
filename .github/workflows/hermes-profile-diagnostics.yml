name: Diagnose Hermes staging profiles

on:
  workflow_dispatch:
  push:
    branches:
      - lucy/chat-hermes-mux-diagnostics-20260927

permissions:
  contents: read

concurrency:
  group: chat-v2-hermes-profile-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, chat-staging]
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Inspect Hermes profiles without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          echo '=== executable ==='
          command -v hermes || true
          hermes --version 2>/dev/null || true

          echo '=== profile directories ==='
          for profile in gemma lynn xixi; do
            envfile="$HOME/.hermes/profiles/$profile/.env"
            printf '%s: ' "$profile"
            if [[ -f "$envfile" ]]; then
              echo present
              awk -F= '
                /^(API_SERVER_ENABLED|API_SERVER_HOST|API_SERVER_PORT|API_SERVER_MODEL_NAME)=/ {print $1"="$2}
                /^(OPENROUTER_API_KEY|ANTHROPIC_API_KEY|OPENAI_API_KEY|DEEPSEEK_API_KEY|LLM_API_KEY)=/ {print $1"=<set:"(length($2)>0?"yes":"no")">"}
                /^(LLM_MODEL|MODEL|MODEL_NAME|LLM_PROVIDER|PROVIDER)=/ {print $1"="$2}
              ' "$envfile" | sort
            else
              echo missing
            fi
          done

          echo '=== listeners ==='
          ss -ltnp 2>/dev/null | awk 'NR==1 || /:(8642|8643|8644|8645)[[:space:]]/' || true

          echo '=== Hermes-related processes (arguments redacted to executable names only) ==='
          ps -eo pid=,comm= | awk 'tolower($2) ~ /hermes|python|uvicorn/ {print}' | head -50 || true

          echo '=== user services ==='
          systemctl --user list-units --type=service --all --no-pager 2>/dev/null | awk 'tolower($0) ~ /hermes|gemma|lynn|xixi/' || true

          echo '=== command help ==='
          for args in 'profile --help' 'serve --help' 'proxy --help' 'gateway --help'; do
            echo "--- hermes $args"
            timeout 10s hermes $args 2>&1 | sed -E 's/(key|token|secret|password)=[^[:space:]]+/\1=<redacted>/Ig' | head -120 || true
          done

      - name: Probe Hermes multiplexer Gemma text and image paths
        shell: bash
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
          HERMES_BASE_URL: ${{ vars.HERMES_BASE_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,time,urllib.request,urllib.error
          base="http://172.17.0.1:8642"
          key=os.environ["HERMES_API_KEY"]
          def call(label,payload,timeout=45):
              req=urllib.request.Request(base+"/v1/chat/completions",data=json.dumps(payload).encode(),
                headers={"Authorization":"Bearer "+key,"Content-Type":"application/json","User-Agent":"Lucy-CDL-mux-diagnostic"},
                method="POST")
              t=time.time()
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      raw=r.read(6000).decode("utf-8","replace")
                  print(json.dumps({"label":label,"http":r.status,"elapsed":round(time.time()-t,3),"bodyPrefix":raw[:1200]},ensure_ascii=False))
              except urllib.error.HTTPError as e:
                  raw=e.read(4000).decode("utf-8","replace")
                  print(json.dumps({"label":label,"http":e.code,"elapsed":round(time.time()-t,3),"bodyPrefix":raw[:1200]},ensure_ascii=False))
              except Exception as e:
                  print(json.dumps({"label":label,"http":None,"elapsed":round(time.time()-t,3),"error":type(e).__name__+":"+str(e)},ensure_ascii=False))
          call("gemma-text",{"model":"gemma","messages":[{"role":"user","content":"Reply exactly READY."}],"max_tokens":16})
          png="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z9U8AAAAASUVORK5CYII="
          call("gemma-image",{"model":"gemma","messages":[{"role":"user","content":[
            {"type":"text","text":"Reply exactly READY after processing this attached image."},
            {"type":"image_url","image_url":{"url":"data:image/png;base64,"+png}}
          ]}],"max_tokens":32},timeout=90)
          PY

      - name: Inspect staging map coverage
        shell: bash
        env:
          MODEL_MAP: ${{ vars.HERMES_MODEL_MAP_JSON }}
          URL_MAP: ${{ vars.HERMES_BASE_URL_MAP_JSON }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          required=['[Hermes] Lucy','Xixi','Lynn','Gemma']
          for label,raw in [('model',os.getenv('MODEL_MAP','')),('url',os.getenv('URL_MAP',''))]:
              try:
                  m=json.loads(raw) if raw.strip() else {}
              except Exception:
                  print(f'{label}: invalid-json')
                  continue
              print(f"{label} keys: {', '.join(sorted(m)) if m else '<none>'}")
              for ident in required:
                  print(f"{label} {ident}: {'present' if isinstance(m.get(ident),str) and m[ident].strip() else 'missing'}")
          PY
